    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
    showToast('檔案已開始下載');
}

function triggerImport() {
    document.getElementById('import-file').click();
}

function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const parsed = JSON.parse(e.target.result);
            if (Array.isArray(parsed)) {
                if(confirm(`確定要匯入並覆蓋現有資料嗎？\n檔案：${file.name}\n任務數量：${parsed.length}`)) {
                    tasks = parsed;
                    saveTasks();
                    showToast('資料匯入成功');
                    switchView('planning');
                }
            } else {
                alert('檔案格式錯誤：內容必須是任務陣列 (Array)');
            }
        } catch (ex) {
            alert('無法解析 JSON 檔案，請確認檔案是否正確。');
        }
        event.target.value = '';
    };
    reader.readAsText(file);
}

function clearData() {
    if(confirm('警告：您確定要刪除所有任務資料嗎？此操作無法復原！')) {
        if(confirm('再次確認：這將清空所有資料，是否繼續？')) {
            tasks = [];
            saveTasks();
            renderPlanning(); // Ensure views are updated if user switches back
            if (currentView === 'history') {
                 if(historyMode === 'graph') initGraph();
                 else renderHistory();
            }
            showToast('所有資料已清空');
        }
    }
}

// --- Modal Logic ---

function openModal(taskId) {
    currentEditingId = taskId;
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    
    const isReview = task.type === 'review';

    document.getElementById('modal-title').value = task.title;
    document.getElementById('modal-date').value = task.date;
    
    // UI elements
    const dateInput = document.getElementById('modal-date');
    const titleInput = document.getElementById('modal-title');
    const statusSection = document.getElementById('modal-status-section');
    
    if (isReview) {
        // Review specific: Disable date and title
        dateInput.disabled = true;
        dateInput.classList.add('opacity-50', 'cursor-not-allowed');
        
        titleInput.readOnly = true;
        titleInput.classList.add('opacity-70', 'cursor-not-allowed');
        
        // Lock status section visually instead of hiding it
        statusSection.classList.remove('hidden');
        statusSection.classList.add('opacity-60', 'cursor-not-allowed', 'pointer-events-none');
    } else {
        // Normal Task
        dateInput.disabled = false;
        dateInput.classList.remove('opacity-50', 'cursor-not-allowed');
        
        titleInput.readOnly = false;
        titleInput.classList.remove('opacity-70', 'cursor-not-allowed');
        
        // Reset status section
        statusSection.classList.remove('hidden', 'opacity-60', 'cursor-not-allowed', 'pointer-events-none');
        statusSection.classList.add('cursor-pointer');
    }
    
    // Toggle UI sections based on type
    const taskFields = document.getElementById('modal-task-fields');
    const reviewSection = document.getElementById('modal-review-section');
    
    if (isReview) {
        taskFields.classList.add('hidden');
        reviewSection.classList.remove('hidden');
        document.getElementById('modal-review-text').value = task.content || '';
    } else {
        taskFields.classList.remove('hidden');
        reviewSection.classList.add('hidden');
        document.getElementById('modal-content-text').value = task.content || '';
        document.getElementById('modal-output-text').value = task.output || '';
        currentEditingLinks = [...(task.links || [])];
        renderModalLinks();
        updateModalDatalist();
    }
    
    updateModalStatusUI(task.status);
    
    const modal = document.getElementById('task-modal');
    const modalContent = document.getElementById('modal-content');
    
    modal.classList.remove('pointer-events-none', 'opacity-0');
    modalContent.classList.remove('scale-95');
    modalContent.classList.add('scale-100');
    document.body.classList.add('modal-active');
}

function renderModalLinks() {
    const container = document.getElementById('modal-links-list');
    container.innerHTML = '';
    currentEditingLinks.forEach(linkId => {
        const linkedTask = tasks.find(t => t.id === linkId);
        if(linkedTask) {
            const chip = document.createElement('div');
            chip.className = 'flex items-center gap-1 bg-zinc-100 text-zinc-600 px-2 py-1 rounded-full text-xs border border-zinc-200';
            chip.innerHTML = `
                <span>${linkedTask.title}</span>
                <button onclick="removeLink('${linkId}')" class="hover:text-red-500 ml-1"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(chip);
        }
    });
}

function updateModalDatalist() {
    const datalist = document.getElementById('task-list-options');
    datalist.innerHTML = '';
    tasks.forEach(t => {
        if(t.id !== currentEditingId && !currentEditingLinks.includes(t.id) && t.type !== 'review') {
            const option = document.createElement('option');
            option.value = t.title;
            option.dataset.id = t.id; 
            datalist.appendChild(option);
        }
    });
}

function addLinkFromInput() {
    const input = document.getElementById('modal-link-input');
    const val = input.value;
    if(!val) return;

    const targetTask = tasks.find(t => t.title === val && t.id !== currentEditingId);
    if(targetTask && !currentEditingLinks.includes(targetTask.id)) {
        currentEditingLinks.push(targetTask.id);
        renderModalLinks();
        input.value = '';
        updateModalDatalist();
    }
}

window.removeLink = function(linkId) {
    currentEditingLinks = currentEditingLinks.filter(id => id !== linkId);
    renderModalLinks();
    updateModalDatalist();
}

function updateModalStatusUI(status) {
    const icon = document.getElementById('modal-status-icon');
    const text = document.getElementById('modal-status-text');
    const container = icon.parentElement.parentElement;
    
    if (status === 'done') {
        icon.className = 'fa-solid fa-square-check text-emerald-500 text-xl';
        text.textContent = '已完成';
        text.className = 'text-sm font-bold text-emerald-600';
        container.className = 'bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-100 transition group flex-1';
        // Note: cursor and hover styles are managed by the parent container classes in HTML usually, 
        // but here we override container class.
        // If locked, openModal handles the cursor-not-allowed
    } else {
        icon.className = 'fa-regular fa-square text-zinc-400 text-xl';
        text.textContent = '未完成';
        text.className = 'text-sm font-medium text-zinc-500';
        container.className = 'bg-zinc-50 px-3 py-2 rounded-lg border border-zinc-100 transition group flex-1';
    }
}

function toggleModalStatus() {
    const task = tasks.find(t => t.id === currentEditingId);
    // Disable toggling for review tasks
    if(task && task.type === 'review') return;
    
    if(task) {
        task.status = task.status === 'done' ? 'todo' : 'done';
        updateModalStatusUI(task.status);
    }
}

function saveModalTask() {
    const task = tasks.find(t => t.id === currentEditingId);
    if (task) {
        // Only update title if not review
        if (task.type !== 'review') {
            task.title = document.getElementById('modal-title').value;
        }
        task.date = document.getElementById('modal-date').value;
        
        if (task.type === 'review') {
            task.content = document.getElementById('modal-review-text').value;
        } else {
            task.content = document.getElementById('modal-content-text').value;
            task.output = document.getElementById('modal-output-text').value;
            task.links = currentEditingLinks;
        }
        
        saveTasks();
        closeModal();
        
        if (currentView === 'planning') renderPlanning();
        if (currentView === 'history') {
            if(historyMode === 'graph') initGraph();
            else renderHistory();
        }
        
        showToast('儲存成功');
    }
}

function deleteCurrentTask() {
    if(confirm('確定要刪除此任務嗎？')) {
        tasks = tasks.filter(t => t.id !== currentEditingId);
        tasks.forEach(t => {
            if(t.links) t.links = t.links.filter(id => id !== currentEditingId);
        });
        
        saveTasks();
        closeModal();
        if (currentView === 'planning') renderPlanning();
        if (currentView === 'history') renderHistory();
        showToast('任務已刪除', 'error');
    }
}

function closeModal() {
    const modal = document.getElementById('task-modal');
    const modalContent = document.getElementById('modal-content');
    
    modalContent.classList.remove('scale-100');
    modalContent.classList.add('scale-95');
    modal.classList.add('opacity-0');
    
    setTimeout(() => {
        modal.classList.add('pointer-events-none');
        document.body.classList.remove('modal-active');
        currentEditingId = null;
    }, 200);
}

// Start
window.onload = init;

</script>
</body>
