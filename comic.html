    <style>
        /* --- 美漫風格核心樣式 --- */
        :root {
            --marvel-red: #EC1D24;
            --comic-yellow: #F9D048;
            --comic-blue: #0277BD;
            --ink-black: #121212;
            --pure-white: #ffffff;
            --dot-color: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 20px 20px; /* Ben-Day dots effect */
            color: var(--ink-black);
            overflow-x: hidden;
        }

        /* 標題字體 */
        .comic-font {
            font-family: 'Bangers', 'Noto Sans TC', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* 漫畫面板邊框 */
        .comic-panel {
            background: var(--pure-white);
            border: 4px solid var(--ink-black);
            box-shadow: 8px 8px 0px var(--ink-black);
            transition: transform 0.2s ease;
        }

        .comic-panel:hover {
            transform: translate(-2px, -2px);
            box-shadow: 12px 12px 0px var(--ink-black);
        }

        /* 漫畫按鈕 */
        .btn-comic {
            background-color: var(--marvel-red);
            color: white;
            border: 3px solid var(--ink-black);
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--ink-black);
            transition: all 0.1s;
            clip-path: polygon(5% 0%, 100% 0%, 100% 90%, 95% 100%, 0% 100%, 0% 10%);
        }

        .btn-comic:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--ink-black);
        }

        /* 斜切風格 */
        .skew-section {
            transform: skewY(-2deg);
        }
        .unskew {
            transform: skewY(2deg);
        }

        /* 英雄卡片 */
        .hero-card {
            position: relative;
            background: linear-gradient(135deg, #222, #444);
            border: 4px solid var(--comic-yellow);
            color: white;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hero-card:hover {
            transform: scale(1.05) rotate(1deg);
            z-index: 10;
            border-color: var(--marvel-red);
        }

        .hero-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.9));
            z-index: 1;
        }

        /* 模態框背景 */
        .modal-overlay {
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(5px);
        }

        /* 對話氣泡 */
        .speech-bubble {
            background: var(--pure-white);
            border: 3px solid var(--ink-black);
            position: relative;
            padding: 15px;
            border-radius: 20px;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 30px;
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: var(--ink-black) transparent;
            display: block;
            width: 0;
        }

        /* 狀態條 */
        .stat-bar-bg {
            background: #333;
            height: 10px;
            border: 2px solid var(--ink-black);
        }
        .stat-bar-fill {
            height: 100%;
            background: var(--comic-yellow);
        }

        /* 動畫 */
        @keyframes pow {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pow {
            animation: pow 0.4s ease-out forwards;
        }
    </style>

                        </h1>
                        <p class="text-lg md:text-xl font-bold bg-yellow-400 inline-block px-4 py-1 border-2 border-black transform -rotate-1">
                            點擊封面閱讀故事
                        </p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                `;

                db.stories.forEach(story => {
                    // 判斷背景：如果有圖片則使用圖片，否則使用原本的顏色與網點
                    let backgroundHtml = '';
                    if (story.coverImage) {
                        backgroundHtml = `
                            <div class="absolute inset-0 z-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-110" 
                                 style="background-image: url('${story.coverImage}');"></div>
                            <!-- 黑色遮罩，確保文字清晰 -->
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black opacity-60 z-0"></div>
                        `;
                    } else {
                        backgroundHtml = `
                            <div class="absolute inset-0 ${story.coverColor} opacity-90 z-0"></div>
                            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/halftone.png')] opacity-30 z-0"></div>
                        `;
                    }

                    html += `
                        <div onclick="app.renderStory(${story.id})" class="comic-panel cursor-pointer group relative overflow-hidden h-96 flex flex-col justify-between">
                            <!-- 封面背景 (動態生成) -->
                            ${backgroundHtml}
                            
                            <!-- 標題 -->
                            <div class="relative z-10 p-6">
                                <span class="bg-black text-white px-2 py-1 text-xs font-bold mb-2 inline-block">ISSUE #${story.id}</span>
                                <h2 class="text-4xl font-black text-white uppercase italic leading-none" style="text-shadow: 3px 3px 0 #000;">${story.title}</h2>
                                <h3 class="text-xl font-bold text-yellow-300 mt-1 uppercase">${story.subtitle}</h3>
                            </div>

                            <!-- 中間裝飾圖示 (只有在沒有背景圖時顯示，避免擋住圖片) -->
                            ${!story.coverImage ? `
                            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-0 opacity-20 text-black">
                                <i data-lucide="book-open" width="150" height="150"></i>
                            </div>` : ''}

                            <!-- 底部資訊 -->
                            <div class="relative z-10 bg-white border-t-4 border-black p-4 skew-y-2 mt-auto transform translate-y-2 group-hover:translate-y-0 transition-transform">
                                <div class="transform -skew-y-2 flex justify-between items-center">
                                    <span class="font-bold text-sm text-gray-600">${story.chapter}</span>
                                    <span class="text-red-600 font-black flex items-center gap-1">
                                        READ NOW <i data-lucide="arrow-right-circle" width="16"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                this.container.innerHTML = html;
                lucide.createIcons();
                window.scrollTo(0,0);
            },

            // 渲染詳情頁
            renderStory(id) {
                const story = db.stories.find(s => s.id === id);
                if (!story) return;

                let html = `
                    <!-- 導航返回 -->
                    <button onclick="app.renderHome()" class="mb-6 btn-comic px-4 py-2 flex items-center gap-2">
                        <i data-lucide="arrow-left" width="20"></i> BACK TO LIST
                    </button>

                    <!-- 故事標題區 -->
                    <div class="bg-black text-white p-4 md:p-10 border-4 border-red-600 shadow-[8px_8px_0_#facc15] mb-6 relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-10 opacity-10">
                            <i data-lucide="zap" width="200" height="200" color="white"></i>
                        </div>
                        <!-- 手機相容：text-4xl md:text-6xl -->
                        <h1 class="text-4xl md:text-6xl font-black italic uppercase relative z-10">${story.title}</h1>
                        <p class="text-yellow-400 font-bold text-xl mt-2 tracking-widest relative z-10">${story.chapter}</p>
                    </div>

                    <!-- ⬇️ 新增：顯眼的閱讀聖經按鈕 -->
                    <div class="mb-12 text-center animate-pow" style="animation-delay: 0.1s;">
                        <!-- 手機相容：px-4 py-2 text-xl -->
                        <a href="${story.bibleUrl}" target="_blank" class="inline-flex items-center gap-3 bg-yellow-400 text-black border-4 border-black px-4 py-2 md:px-8 md:py-4 text-xl md:text-2xl font-black italic transform -rotate-1 hover:rotate-0 hover:scale-110 transition-all shadow-[8px_8px_0_#000] group decoration-0">
                            <i data-lucide="book-open-check" width="32" height="32"></i>
                            <span>READ BIBLE / 閱讀經文</span>
                            <i data-lucide="external-link" width="24" height="24" class="group-hover:translate-x-1 transition-transform"></i>
                        </a>
                    </div>

                    <!-- 故事內容 (漫畫分鏡感) -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 mb-16">
                        <div class="md:col-span-8 comic-panel p-4 md:p-8 bg-white relative">
                            <span class="absolute -top-4 -left-4 bg-yellow-400 border-2 border-black px-3 py-1 font-black transform -rotate-3">THE STORY</span>
                            <!-- 使用 innerHTML 渲染描述，允許 <br> 換行。手機相容：text-lg -->
                            <p class="text-lg md:text-2xl font-bold leading-relaxed text-gray-800" style="font-family: 'Bangers', 'Noto Sans TC';">
                                ${story.description}
                            </p>
                        </div>
                        
                        <div class="md:col-span-4 flex flex-col gap-4">
                            <!-- Action Panel (Clickable Modal) -->
                            <!-- ⬇️ 修改：將 ACTION 改為 EPIC MOMENT -->
                            <div onclick="app.openInfoModal('EPIC MOMENT', '${story.actionText}', 'swords', 'text-blue-600', '${story.videoUrl || ''}')" 
                                 class="comic-panel bg-blue-600 p-6 text-white text-center flex-grow flex flex-col justify-center items-center cursor-pointer hover:scale-[1.02] transition-transform relative overflow-hidden group">
                                <div>
                                    <i data-lucide="swords" width="48" height="48" class="mb-2 mx-auto"></i>
                                    <h3 class="font-black text-2xl">EPIC MOMENT</h3>
                                    <span class="text-xs bg-black text-white px-2 py-1 mt-2 inline-block transform -rotate-2 group-hover:rotate-0 transition-transform">CLICK TO VIEW!</span>
                                </div>
                            </div>

                            <!-- Faith Panel (Clickable Modal) -->
                            <div onclick="app.openInfoModal('FAITH', '${story.faithText}', 'heart', 'text-red-600')" 
                                 class="comic-panel bg-red-600 p-6 text-white text-center flex-grow flex flex-col justify-center items-center cursor-pointer hover:scale-[1.02] transition-transform relative overflow-hidden group">
                                <div>
                                    <i data-lucide="heart" width="48" height="48" class="mb-2 mx-auto"></i>
                                    <h3 class="font-black text-2xl">FAITH</h3>
                                    <span class="text-xs bg-black text-white px-2 py-1 mt-2 inline-block transform rotate-2 group-hover:rotate-0 transition-transform">CLICK TO VIEW!</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 角色陣容標題 -->
                    <div class="flex items-center gap-4 mb-8">
                        <div class="h-1 bg-black flex-grow"></div>
                        <h2 class="text-2xl md:text-4xl font-black bg-white px-4 border-4 border-black transform rotate-1 shadow-[5px_5px_0_#000]">
                            ROSTER / <span class="text-red-600">英雄圖鑑</span>
                        </h2>
                        <div class="h-1 bg-black flex-grow"></div>
                    </div>

                    <!-- 角色卡片區 -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                `;

                story.characters.forEach(charId => {
                    const char = db.characters[charId];
                    const iconName = char.imageIcon === 'crown' ? 'crown' : 
                                   char.imageIcon === 'sword' ? 'sword' : 
                                   char.imageIcon === 'waves' ? 'waves' : 
                                   char.imageIcon === 'pyramid' ? 'triangle' : 
                                   char.imageIcon === 'scroll' ? 'scroll' : 'user';

                    // ⬇️ 新增：判斷是否有人物圖片
                    let cardBgHtml = '';
                    if (char.portrait) {
                        // 有圖片：使用圖片作為滿版背景，並加上底部黑色漸層讓文字可見
                        cardBgHtml = `
                            <div class="absolute inset-0 z-0 bg-cover bg-top transition-transform duration-500 group-hover:scale-110" 
                                 style="background-image: url('${char.portrait}');"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-90 z-10"></div>
                        `;
                    } else {
                        // 無圖片：使用原本的圖示與透明度
                        cardBgHtml = `
                            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-20 text-white group-hover:scale-110 transition-transform duration-500 z-0">
                                <i data-lucide="${iconName}" width="120" height="120"></i>
                            </div>
                        `;
                    }

                    // 手機相容：h-64 md:h-80
                    html += `
                        <div onclick="app.openModal(${charId})" class="hero-card group h-64 md:h-80 flex flex-col justify-end p-2 md:p-4 border-b-8 border-r-8 overflow-hidden">
                            <!-- 角色背景 (圖片或圖示) -->
                            ${cardBgHtml}
                            
                            <div class="relative z-20">
                                <div class="bg-yellow-400 text-black text-xs font-black inline-block px-2 mb-1 transform -skew-x-12 border border-black">
                                    ${char.role}
                                </div>
                                <!-- 手機相容：text-lg md:text-2xl -->
                                <h3 class="text-lg md:text-2xl font-black text-white italic uppercase leading-none mb-1" style="text-shadow: 2px 2px 0 #000;">
                                    ${char.name}
                                </h3>
                                <p class="text-xs text-gray-300 font-mono tracking-widest uppercase mb-2">${char.alias}</p>
                                
                                <div class="w-full bg-gray-700 h-1 mt-2">
                                    <div class="bg-red-500 h-1" style="width: ${char.stats.faith || char.stats.pride || 50}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                
                // 底部留白
                html += `<div class="h-20"></div>`;

                this.container.innerHTML = html;
                lucide.createIcons();
                window.scrollTo(0,0);
            },

            // 開啟 Action/Faith 彈窗
            openInfoModal(type, text, iconName, colorClass, videoUrl = '') {
                // 如果是 EPIC MOMENT 類型且有影片網址，則生成影片 HTML
                let videoHtml = '';
                // ⬇️ 修改：判斷條件更新為 EPIC MOMENT
                if (type === 'EPIC MOMENT' && videoUrl) {
                    // 使用 HTML5 <video> 標籤
                    // ⬇️ 修改：移除 max-w-lg，保留 w-full，讓影片填滿變寬的視窗
                    // 修改：mb-6 -> mb-4 減少影片下方間距
                    videoHtml = `
                        <div class="w-full mb-4 border-4 border-black bg-black shadow-[8px_8px_0_#000] relative animate-pow">
                            <video controls class="w-full" style="display: block; max-height: 60vh;">
                                <source src="${videoUrl}" type="video/mp4">
                                <source src="${videoUrl.replace('.mp4', '.webm')}" type="video/webm">
                                您的瀏覽器不支援 HTML5 影片。
                            </video>
                        </div>
                    `;
                }

                const html = `
                    <div class="flex flex-col items-center text-center p-4">
                        <!-- ⬇️ 修改：Icon 容器縮小 (w-16 h-16)，間距減少 (mb-2) -->
                        <div class="w-16 h-16 bg-black rounded-full flex items-center justify-center border-4 border-yellow-400 shadow-lg mb-2 text-white animate-pow">
                            <!-- ⬇️ 修改：Icon 尺寸縮小 (width="24") -->
                            <i data-lucide="${iconName}" width="24" height="24"></i>
                        </div>
                        <!-- ⬇️ 修改：標題縮小 (text-3xl)，間距減少 (mb-4) -->
                        <h2 class="text-3xl font-black italic uppercase mb-4 ${colorClass}" style="text-shadow: 1px 1px 0px black;">${type}</h2>
                        
                        <!-- 影片顯示區 -->
                        ${videoHtml}

                        <div class="comic-panel bg-white p-6 relative w-full transform rotate-1">
                             <span class="absolute -top-3 -left-2 bg-yellow-400 border-2 border-black px-2 py-1 text-xs font-black transform -rotate-3">
                                <!-- ⬇️ 修改：更新子標題顯示 -->
                                ${type === 'EPIC MOMENT' ? 'THE HIGHLIGHT' : 'THE LESSON'}
                             </span>
                             <p class="text-lg md:text-2xl font-bold leading-relaxed text-gray-900" style="font-family: 'Bangers', 'Noto Sans TC';">
                                "${text}"
                             </p>
                        </div>
                    </div>
                `;
                this.modalBody.innerHTML = html;
                this.modal.classList.remove('hidden');
                lucide.createIcons();
            },

            // 開啟人物模態框
            openModal(charId) {
                const char = db.characters[charId];
                if (!char) return;

                // 準備能力值條
                let statsHtml = '';
                for (const [key, value] of Object.entries(char.stats)) {
                    statsHtml += `
                        <div class="mb-2">
                            <div class="flex justify-between text-xs font-bold uppercase mb-1">
                                <span>${key}</span>
                                <span>${value}/100</span>
                            </div>
                            <div class="stat-bar-bg">
                                <div class="stat-bar-fill" style="width: ${value}%"></div>
                            </div>
                        </div>
                    `;
                }

                // 獲取圖示
                const iconName = char.imageIcon === 'crown' ? 'crown' : 
                                char.imageIcon === 'sword' ? 'sword' : 
                                char.imageIcon === 'waves' ? 'waves' : 
                                char.imageIcon === 'pyramid' ? 'triangle' : 
                                char.imageIcon === 'scroll' ? 'scroll' : 'user';

                // ⬇️ 新增：判斷頭像顯示
                let avatarHtml = '';
                if (char.portrait) {
                    avatarHtml = `
                        <img src="${char.portrait}" 
                             class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-yellow-400 object-cover shadow-lg mb-4 bg-gray-200"
                             alt="${char.name}">
                    `;
                } else {
                    avatarHtml = `
                        <div class="w-32 h-32 md:w-32 md:h-32 bg-black rounded-full flex items-center justify-center border-4 border-yellow-400 shadow-lg mb-4 text-white">
                            <i data-lucide="${iconName}" width="64" height="64"></i>
                        </div>
                    `;
                }

                const html = `
                    <div class="flex flex-col md:flex-row gap-6">
                        <!-- 左側：頭像與數據 -->
                        <div class="md:w-1/3 flex flex-col items-center">
                            <!-- 頭像 (動態生成) -->
                            ${avatarHtml}
                            
                            <h2 class="text-3xl md:text-4xl font-black italic uppercase text-center ${char.color}">${char.name}</h2>
                            <p class="font-bold text-gray-500 uppercase tracking-widest text-sm mb-4">${char.alias}</p>
                            
                            <div class="w-full bg-gray-100 p-4 border-2 border-black rounded shadow-sm">
                                <h4 class="font-black text-sm mb-2 border-b-2 border-black inline-block">POWER STATS</h4>
                                ${statsHtml}
                            </div>
                        </div>

                        <!-- 右側：介紹與經文 -->
                        <div class="md:w-2/3">
                            <div class="mb-6">
                                <span class="bg-black text-white px-2 py-1 text-xs font-bold transform -rotate-1 inline-block mb-2">ORIGIN STORY</span>
                                <p class="text-base md:text-lg font-bold leading-relaxed text-gray-800">
                                    ${char.bio}
                                </p>
                            </div>

                            <div class="speech-bubble mb-4">
                                <p class="text-lg md:text-xl font-black italic text-center text-gray-900">
                                    "${char.verse}"
                                </p>
                            </div>
                            <div class="text-right">
                                <span class="font-bold text-red-600 bg-yellow-300 px-3 py-1 border-2 border-black text-sm transform rotate-2 inline-block shadow-md">
                                    ${char.source}
                                </span>
                            </div>
                        </div>
                    </div>
                `;

                this.modalBody.innerHTML = html;
                this.modal.classList.remove('hidden');
                lucide.createIcons();
            },

            closeModal() {
                this.modal.classList.add('hidden');
            }
        };

        // 啟動應用
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
