<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>約翰福音：見證者之旅</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS (用於地圖) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            height: 100vh;
            height: 100dvh; /* 支援手機瀏覽器動態高度 */
            overflow: hidden;
        }
        
        .serif {
            font-family: 'Noto Serif TC', serif;
        }

        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c7a988; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a68b6c; 
        }

        /* 地圖標記樣式 */
        .custom-icon {
            background-color: #8B0000;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            font-family: 'Noto Sans TC', sans-serif;
            cursor: pointer; /* 增加手指游標 */
            transition: transform 0.2s;
        }
        
        .custom-icon:hover {
            transform: scale(1.1);
            background-color: #a83232;
            z-index: 2000 !important;
        }

        .custom-icon.active {
            background-color: #d97706; /* Amber-600 */
            transform: scale(1.2);
            transition: all 0.3s ease;
            z-index: 1000 !important;
        }
        
        /* 神蹟專用標記顏色 */
        .custom-icon.sign-miracle {
            background-color: #1e3a8a; /* Blue-900 */
            border-color: #bfdbfe;
        }

        /* 特殊人物按鈕樣式 - 你 */
        .btn-highlight-you {
            background-color: #b91c1c !important; /* Red-700 */
            color: white !important;
            border-color: #991b1b !important;
            font-size: 1.1rem !important;
            padding: 0.5rem 1.5rem !important;
            font-weight: bold !important;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.5) !important;
            animation: pulse-highlight 2s infinite;
        }

        @keyframes pulse-highlight {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        .parchment-bg {
            background-color: #fffaf0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }
    </style>
</head>
<!-- 
    Layout Strategy:
    Mobile (default): flex-col. Map is first child -> Top. Narrative is second child -> Bottom.
    Desktop (md): flex-row-reverse. 
       - Flex-row-reverse lays out items from right to left.
       - 1st child (Map) goes to Right.
       - 2nd child (Narrative) goes to Left.
    This achieves: Mobile(Map Top, Narrative Bottom) & Desktop(Narrative Left, Map Right).
-->
<body class="flex flex-col md:flex-row-reverse h-screen w-full overflow-hidden">

    <!-- 區塊 1：地圖 (手機在上方 1/2，電腦在右側 2/3) -->
    <div class="w-full md:w-2/3 h-1/2 md:h-full relative z-10">
        <div id="map"></div>
        
        <!-- 地圖覆蓋層：章節提示 -->
        <div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-4 py-2 rounded shadow-lg z-[1000] border-l-4 border-red-800">
            <h2 id="map-location-title" class="font-bold text-stone-800 text-sm md:text-base">載入中...</h2>
            <p id="map-chapter-ref" class="text-xs text-stone-600">John 1</p>
        </div>
    </div>

    <!-- 區塊 2：敘事與控制面板 (手機在下方 1/2，電腦在左側 1/3) -->
    <!-- 添加 border-t (手機版分隔線) 和 md:border-t-0 md:border-r (電腦版右分隔線) -->
    <div class="w-full md:w-1/3 h-1/2 md:h-full flex flex-col shadow-[0_-4px_20px_rgba(0,0,0,0.1)] md:shadow-2xl z-20 parchment-bg border-t md:border-t-0 md:border-r border-stone-300 relative">
        
        <!-- 標題區 -->
        <header class="p-4 md:p-6 border-b border-stone-300 bg-stone-100 shrink-0">
            <h1 class="text-xl md:text-3xl font-bold text-stone-800 serif">約翰福音：見證者之旅</h1>
            <p class="text-xs md:text-sm text-stone-600 mt-1 md:mt-2 serif italic">「記這些事，要叫你們信耶穌是基督，是神的兒子。」</p>
        </header>

        <!-- 內容區 (可捲動) -->
        <main id="content-area" class="flex-1 overflow-y-auto p-4 md:p-6 relative">
            <!-- 動態內容將插入此處 -->
            <div id="narrative-container" class="fade-in">
                <div class="flex items-center justify-center h-full text-stone-500">
                    載入中...
                </div>
            </div>
            
            <hr class="my-4 md:my-6 border-stone-300">
            
            <!-- 關聯人物區 -->
            <div>
                <h3 class="text-xs md:text-sm uppercase tracking-widest text-stone-500 mb-2 md:mb-3 font-bold">本章人物誌</h3>
                <div id="characters-list" class="flex flex-wrap gap-2">
                    <!-- Character tags will go here -->
                </div>
            </div>
        </main>

        <!-- 底部控制區 -->
        <footer class="p-3 md:p-4 bg-stone-200 border-t border-stone-300 flex justify-between items-center shrink-0">
            <button id="prev-btn" onclick="prevEvent()" class="px-3 py-1.5 md:px-4 md:py-2 bg-stone-300 text-stone-600 rounded hover:bg-stone-400 transition disabled:opacity-50 disabled:cursor-not-allowed text-sm md:text-base">
                <i class="fas fa-chevron-left"></i> 上一章
            </button>
            <div class="text-stone-700 font-bold font-mono text-sm md:text-base">
                <span id="current-step">1</span> / <span id="total-steps">31</span>
            </div>
            <button id="next-btn" onclick="nextEvent()" class="px-4 py-1.5 md:px-6 md:py-2 bg-red-800 text-white rounded hover:bg-red-900 transition shadow-lg flex items-center gap-2 text-sm md:text-base">
                下一章 <span class="text-xl">→</span>
            </button>
        </footer>
    </div>

    <!-- 人物模態視窗 -->
    <div id="modal" class="fixed inset-0 bg-black/60 z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-2xl relative parchment-bg transform transition-all scale-100 max-h-[80vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-800 text-2xl">&times;</button>
            <h2 id="modal-name" class="text-2xl font-bold serif text-red-900 mb-2">人物名稱</h2>
            <p id="modal-role" class="text-sm text-stone-500 mb-4 uppercase tracking-wider font-bold">角色定位</p>
            <div id="modal-desc" class="text-stone-700 leading-relaxed serif border-l-2 border-stone-300 pl-4">
                人物描述...
            </div>
        </div>
    </div>

    <script>
        // --- 1. 資料庫 ---
        
        // 角色資料庫 (大幅擴充與細節化)
        const charactersDB = {
            "John": {
                role: "敘事者 / 使徒",
                desc: "我是西庇太的兒子，那個自稱『耶穌所愛的門徒』。這不是驕傲，而是我一生最深的震撼——神竟然愛我。我曾是性急的『雷子』，想叫火從天降下；但靠在主胸膛聽見神心跳的那一刻，我被轉化了。如今我老邁，在拔摩島回望，我唯一的使命就是作證：他是真的，道成了肉身，我親眼看過、親手摸過。"
            },
            "Jesus": {
                role: "神的兒子 / 彌賽亞",
                desc: "我與父原為一。在亞伯拉罕以前，就有了我。我來，不是要定世人的罪，乃是要叫世人因我得救。我是生命的糧、世界的光、羊的門、好牧人、復活與生命、道路真理生命、真葡萄樹。這一切的『我是』，都是為了邀請你進入我與父的愛中。"
            },
            "JohnTheBaptist": {
                role: "先鋒",
                desc: "曠野的風沙磨練了我的意志，但我深知自己的界線。我不是那光，我只是為光作見證的聲音。當我看見聖靈如鴿子降在他身上，我的喜樂就滿足了。正如伴郎聽見新郎的聲音就歡喜，他必興旺，我必衰微——這是我生命最榮耀的退場。"
            },
            "Andrew": {
                role: "首位門徒 / 引薦者",
                desc: "我總是在做同一件事：把人帶到耶穌面前。先是我的哥哥彼得，後來是帶著五餅二魚的孩童，再後來是希臘人。我不如彼得耀眼，但我知道，只要把人帶給主，微小如五餅二魚也能成為大神蹟。這就是我的使命。"
            },
            "Peter": {
                role: "使徒領袖 / 磐石",
                desc: "我是個衝動的漁夫，說話常不經大腦。我曾豪言壯語說願為他死，卻在火炭旁三次不認他。那雞叫聲至今仍刺痛我心。但他沒有放棄我，他在海邊三次問我『你愛我嗎？』，不是為了羞辱，而是為了醫治。從此，我不再是靠血氣的西門，我是牧養羊群的彼得。"
            },
            "Philip": {
                role: "來自伯賽大的使徒",
                desc: "我是個講求實際的人。當主問哪裡買餅時，我腦中算的是二十兩銀子也不夠。我曾愚拙地求主『將父顯給我們看』，卻不知道看見了他就是看見了父。主一直在擴張我的視界，讓我看見信心的算術與屬世的計算截然不同。"
            },
            "Nathanael": {
                role: "使徒 / 真以色列人",
                desc: "我曾輕蔑地說：『拿撒勒還能出什麼好的嗎？』我以為自己懂律法、懂出身。但當他說出無花果樹下的秘密時，我的防線崩潰了。他是全知的神，卻願意呼召我這個帶有偏見的人。他應許我將看見比這更大的事，我也確實看見了。"
            },
            "MaryMother": {
                role: "耶穌的母親",
                desc: "從迦拿的婚宴開始，我就在學習放手。我知道他不僅是我的兒子，更是我的主。在十字架下，當劍刺透我的心時，他將我託付給了約翰。即使在劇痛中，他依然顧念我的餘生。這是何等的愛，何等的痛。"
            },
            "Nicodemus": {
                role: "猶太公會成員",
                desc: "我是以色列的先生，卻在夜裡像個無知的孩子去敲門。『重生』的道理曾讓我困惑，但我心中對真理的渴望勝過了對同僚的恐懼。我曾試圖在公會為他辯護，最後，我不再隱藏，帶著一百斤沉香沒藥去安葬他。在最黑暗的時刻，我的信心反而亮了。"
            },
            "SamaritanWoman": {
                role: "敘加城的見證者",
                desc: "五個丈夫，無數的羞辱，讓我在正午頂著烈日打水，只為避開人群。但他——一個猶太男人，竟然向我要水喝，還給了我活水。他知道我最不堪的秘密，眼裡卻沒有輕視。我丟下水罐的那一刻，也丟下了我的羞恥。全城的人因我的話信了，你能想像嗎？"
            },
            "Official": {
                role: "希律王的大臣",
                desc: "我擁有權勢與地位，但在死亡面前，我只是一個無助的父親。我走了很遠的路求他去迦百農，他卻只給了一句話。那是信心的跳躍——我選擇相信那句話。當僕人報信說孩子活了，且時間分秒不差時，我知道這不僅是醫治，這是神蹟。我家從此屬於主。"
            },
            "Paralytic": {
                role: "畢士大池的癱子",
                desc: "三十八年，一萬三千多個日子的絕望。我甚至連求醫的力氣都沒了，只能抱怨沒人幫我。但他不需要我從水裡得醫治，他的話就是力量。雖然我後來被捲入安息日的爭議，但我知道一件事：那叫我站起來的，是生命的主。"
            },
            "BlindMan": {
                role: "生來瞎眼的乞丐",
                desc: "他們爭論是誰犯了罪，但我只經歷了泥與水。當光第一次刺入眼簾，世界變了。法利賽人擁有神學，我卻擁有經歷。他們趕我出會堂，主卻在外面尋找我。我從瞎眼變看見，他們卻從明眼變瞎子。我雖是乞丐，卻比大祭司更早看見神的榮耀。"
            },
            "Lazarus": {
                role: "復活的見證人",
                desc: "死亡是冰冷、寂靜的深淵。我已經在裡面四天了，身體開始腐朽。然後，那聲音——『拉撒路，出來！』——穿透了死亡的厚壁。那是一種無法抗拒的生命力。我裹著布跳出來，再次呼吸。現在，我的每一次心跳，都在訴說他是復活與生命。連祭司長都想殺我，因為我的存在就是最大的神蹟。"
            },
            "MaryOfBethany": {
                role: "馬大與拉撒路的妹妹",
                desc: "人說我浪費，三十兩銀子的香膏可以賙濟窮人。但他們不懂，當你看見那將死的愛，金錢算什麼？我在靈裡感到他將離去，我只想把最珍貴的獻給他。屋裡的香氣會散去，但他對我的悅納，『她是為我安葬之日存留的』，這句話我將永存心底。"
            },
            "Martha": {
                role: "馬大與拉撒路的姊姊",
                desc: "我總是為服事忙亂，甚至抱怨過妹妹。但在弟弟墳前，儘管悲傷，我仍堅定宣告：『主啊，是的，我信你是基督，是神的兒子。』我的信心不是盲目的，即便在絕望中，我仍抓住他的應許。我看見了石頭挪開後的榮耀。"
            },
            "Judas": {
                role: "加略人 / 叛徒",
                desc: "我管錢囊，卻被錢財掌管。我看著那香膏，心裡想的是三十兩銀子。撒旦進入我心時，那是一種冰冷的決絕。在最後的晚餐，我吃了蘸餅，那本是友誼的記號，對我卻是審判。我走入夜色，因為我的心早已是黑夜。"
            },
            "Caiaphas": {
                role: "當年的大祭司",
                desc: "我是為了國家！這人行神蹟迷惑眾人，羅馬人若來，我們的地位何在？我說『一個人替百姓死，免得通國滅亡』，這話其實是預言，但我當時只把它當作政治算計。為了維護體制，我必須除掉真理。歷史會記住我，作為一個為了權力扼殺彌賽亞的大祭司。"
            },
            "Pilate": {
                role: "羅馬巡撫",
                desc: "真理是什麼？這是我嘲諷的問句。我查不出他有罪，但我更怕凱撒的憤怒和猶太人的暴動。我試圖釋放他，甚至洗手表清白，但最終我還是妥協了。我看著他被帶走，心裡有個聲音說我判決了無辜者。我在十字架上寫下『猶太人的王』，這是我最後的倔強，也是諷刺的事實。"
            },
            "MaryMagdalene": {
                role: "首位復活見證者",
                desc: "曾有七個鬼從我身上趕出，我的生命是他給的。那天清早，天還黑，我就跑到墳墓。找不到他的身體讓我崩潰。直到那聲熟悉的呼喚『馬利亞！』，世界重新亮了起來。我是使徒中的使徒，因為我是第一個奉命去傳講『他活著』的女人。"
            },
            "Thomas": {
                role: "多馬 / 雙生子",
                desc: "他們叫我多疑的人。但我不願迷信，我需要真實。除非我看見釘痕，探入肋旁，否則我無法欺騙自己。八天後，他專門為我而來。他沒有責備，只有溫柔的展示。那一刻，我不需要摸了，我整個人俯伏：『我的主！我的神！』懷疑的盡頭，是更堅定的信仰。"
            },
            "JosephOfArimathea": {
                role: "亞利馬太人 / 秘密門徒",
                desc: "我曾因怕猶太人而暗暗作門徒。但看著他在十字架上斷氣，恐懼消失了，取而代之的是勇氣。我大膽進去求彼拉多，要了他的身體。我貢獻了自己的新墳墓。這是我能為他做的最後一件事，也是我公開身分的開始。我不再隱藏。"
            },
            "Annas": {
                role: "前任大祭司 / 掌權者",
                desc: "雖然女婿該亞法是名義上的大祭司，但眾人知道權力在我手中。他們先把他帶到我這裡。我看著這個加利利人，試圖找出破綻。他的回答不卑不亢，甚至被差役打了一巴掌。我雖在幕後操縱審判，卻感到一股無法掌控的力量。"
            },
            "Malchus": {
                role: "大祭司的僕人",
                desc: "那晚火把搖曳，我衝在最前面要抓他。突然一陣劇痛，我的右耳被削掉了，血流如注。然而，他——那個我們要抓的人，卻觸摸了我，止住了血與痛。我是來抓捕他的，他卻醫治了我。這份震撼，讓我手中的火把顯得如此蒼白。"
            },
            "AdulterousWoman": {
                role: "被赦免的婦人",
                desc: "我被拖到聖殿，衣衫不整，周圍是殺氣騰騰的石頭和指控。我閉上眼等待死亡的重擊。然而，聽到的卻是石子落地的聲音，和那句溫柔的『我也不定你的罪』。他救了我的命，更救了我的靈魂。從那刻起，我不再是淫婦，我是被愛的女兒。"
            },
            "MaryClopas": {
                role: "革羅罷的妻子",
                desc: "我站在十字架旁，看著他的血一滴滴落下。大多數男人都跑了，只有我們幾個婦人和約翰留下。這是最黑暗的時刻，但我不能離開。我看著他將母親託付給約翰，看著他斷氣。這份陪伴，是我們無聲的誓言。"
            },

            {
                id: 31,
                title: "結語：未完的書卷",
                chapter: "約翰福音 20:30-31; 21:25",
                location: "以弗所",
                coords: [37.94, 27.34], 
                narrative: "親愛的朋友，我們已經走過了這條見證的路。我已將我所看見、所聽見、親手摸過的生命之道傳給了你。耶穌所行的事還有許多，若是一一寫出來，我想世界也容不下了。但我記下這些特定的事，只有一個目的：要叫你信耶穌是基督，是神的兒子。這不僅僅是頭腦的認知，而是生命的連結。當你信祂，你就擁有了生命——那不被死亡拘禁、永遠湧流的生命。現在，這書卷交到了你的手中。你會如何回應這位愛你的主？願你也能說：『我的主！我的神！』",
                chars: ["John", "Jesus", "You"]
            }

        // ... 應用程式邏輯保持不變
        
        let map;
        let currentIndex = 0;
        let markers = [];
        let pathLine = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            
            // 使用 ResizeObserver 確保地圖隨容器大小變化自動更新
            const mapDiv = document.getElementById('map');
            if (mapDiv) {
                const resizeObserver = new ResizeObserver(() => {
                    if (map) {
                        map.invalidateSize();
                    }
                });
                resizeObserver.observe(mapDiv);
            }

            // 稍微延遲渲染，確保 DOM 和樣式已經應用
            setTimeout(() => {
                if (map) {
                    map.invalidateSize();
                    renderEvent(currentIndex);
                }
            }, 500);
        });

        function initMap() {
            // 中心點設在以色列中部
            map = L.map('map').setView([32.0, 35.3], 9);

            // 改用 Google Maps 圖磚以顯示中文地名
            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=zh-TW', {
                attribution: '&copy; Google Maps',
                maxZoom: 20
            }).addTo(map);
        }

        function renderEvent(index) {
            const event = events[index];
            const isLast = index === events.length - 1;
            const isFirst = index === 0;

            // 1. 更新 UI 文字
            const container = document.getElementById('narrative-container');
            container.innerHTML = ''; // 清空並觸發動畫
            
            // 強制重繪以觸發 fade-in
            setTimeout(() => {
                container.innerHTML = `
                    <div class="mb-2 text-red-800 font-bold tracking-widest text-xs uppercase serif">事件編號 ${event.id}</div>
                    <h2 class="text-2xl font-bold mb-2 text-stone-900 serif">${event.title}</h2>
                    <div class="text-stone-500 text-sm mb-4 font-mono"><i class="fas fa-book"></i> ${event.chapter} | <i class="fas fa-map-marker-alt"></i> ${event.location}</div>
                    <p class="text-lg leading-loose text-stone-800 serif text-justify">${event.narrative}</p>
                `;
            }, 10);

            // 2. 更新人物列表
            const charList = document.getElementById('characters-list');
            charList.innerHTML = '';
            event.chars.forEach(charKey => {
                const charData = charactersDB[charKey];
                const btn = document.createElement('button');
                btn.className = "px-3 py-1 bg-white border border-stone-300 rounded-full text-xs hover:bg-red-50 hover:border-red-300 hover:text-red-800 transition shadow-sm mb-2";
                
                // 特殊樣式給 "你"
                if (charKey === 'You') {
                    btn.className = "px-6 py-2 bg-red-600 text-white border border-red-700 rounded-full text-lg font-bold hover:bg-red-700 transition shadow-lg animate-pulse mb-2";
                }

                // 使用對照表獲取顯示名稱
                btn.textContent = characterDisplayNames[charKey] || charKey;
                
                btn.onclick = () => showCharacter(charKey);
                charList.appendChild(btn);
            });

            // 3. 更新按鈕狀態
            document.getElementById('prev-btn').disabled = isFirst;
            
            if (isLast) {
                document.getElementById('next-btn').innerHTML = '重新開始之旅 <i class="fas fa-redo ml-2"></i>';
                document.getElementById('next-btn').classList.remove('bg-red-800', 'hover:bg-red-900');
                document.getElementById('next-btn').classList.add('bg-green-700', 'hover:bg-green-800');
            } else {
                document.getElementById('next-btn').innerHTML = '下一章 <span class="text-xl">→</span>';
                document.getElementById('next-btn').classList.add('bg-red-800', 'hover:bg-red-900');
                document.getElementById('next-btn').classList.remove('bg-green-700', 'hover:bg-green-800');
            }
            
            document.getElementById('current-step').textContent = index + 1;
            document.getElementById('total-steps').textContent = events.length;

            // 4. 地圖操作
            updateMap(index);

            // 5. 更新右上角浮動資訊
            document.getElementById('map-location-title').textContent = event.location;
            document.getElementById('map-chapter-ref').textContent = event.chapter;
        }

        function updateMap(index) {
            // 確保 map 已初始化
            if (!map) return;

            // 關鍵修復：檢查地圖容器是否有尺寸
            try {
                map.invalidateSize(); // 強制重新計算尺寸
                const size = map.getSize();
                if (size.x === 0 || size.y === 0) {
                    console.warn("Map container has no size, skipping map update.");
                    return;
                }
            } catch (e) {
                console.warn("Error checking map size", e);
                return;
            }

            // 清除舊圖層 (為了效能與簡潔，我們只保留路徑和當前/過去的標記)
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            if (pathLine) map.removeLayer(pathLine);

            // 繪製路徑 (從第一個事件到當前事件)
            const pathCoords = events.slice(0, index + 1).map(e => e.coords);
            if (pathCoords.length > 1) {
                pathLine = L.polyline(pathCoords, {
                    color: '#8B0000', // 深紅色
                    weight: 3,
                    opacity: 0.7,
                    dashArray: '5, 10',
                    lineCap: 'round'
                }).addTo(map);
            }

            // 繪製標記 (顯示所有到目前的事件，但當前事件要特別醒目)
            for (let i = 0; i <= index; i++) {
                const e = events[i];
                const isActive = i === index;
                const isSign = e.isSign; // 檢查是否為神蹟
                
                // 自定義圖標 (神蹟會有不同的顏色)
                const icon = L.divIcon({
                    className: `custom-icon ${isActive ? 'active' : ''} ${isSign ? 'sign-miracle' : ''}`,
                    html: i + 1,
                    iconSize: isActive ? [40, 40] : [30, 30],
                    iconAnchor: isActive ? [20, 20] : [15, 15]
                });

                const marker = L.marker(e.coords, {
                    icon: icon,
                    zIndexOffset: isActive ? 1000 : i * 10 // 確保後面的編號蓋在前面的編號上
                })
                    .addTo(map)
                    .bindPopup(`<b>${e.title}</b><br>${e.location}`, { offset: [0, -20] });
                
                // 點擊標記跳轉事件
                marker.on('click', () => {
                    currentIndex = i;
                    renderEvent(i);
                });
                
                if (isActive) {
                    marker.openPopup();
                }
                markers.push(marker);
            }

            // 飛往當前地點，使用 try-catch 防止 Leaflet 內部錯誤導致崩潰
            const currentEvent = events[index];
            if (currentEvent && currentEvent.coords && !isNaN(currentEvent.coords[0])) {
                try {
                    // 直接呈現，不使用動畫
                    map.setView(currentEvent.coords, 10);
                } catch (e) {
                    console.log("Map view update failed", e);
                }
            }
        }

        function nextEvent() {
            if (currentIndex < events.length - 1) {
                currentIndex++;
                renderEvent(currentIndex);
            } else {
                // 重新開始
                currentIndex = 0;
                renderEvent(0);
            }
        }

        function prevEvent() {
            if (currentIndex > 0) {
                currentIndex--;
                renderEvent(currentIndex);
            }
        }

        // 顯示人物模態框
        function showCharacter(charKey) {
            const char = charactersDB[charKey];
            const displayName = characterDisplayNames[charKey] || charKey;
            
            document.getElementById('modal-name').textContent = displayName;
            document.getElementById('modal-role').textContent = char.role;
            document.getElementById('modal-desc').innerHTML = char.desc;
            
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // 點擊背景關閉模態框
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

    </script>
