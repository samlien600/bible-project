    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FDFCF8;
            color: #4A4740;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            transition: background-color 3s ease, color 3s ease;
        }

        .font-serif { font-family: 'Noto Serif TC', serif; }

        /* Night Mode */
        body.night-mode { background-color: #0F1014; color: #B0AAA0; }
        body.night-mode .text-dark { color: #B0AAA0 !important; }
        body.night-mode .text-muted { color: #6B7280 !important; }
        
        /* UI Components */
        body.night-mode .btn-interact {
            background-color: #1A1C23;
            color: #B0AAA0;
            border-color: #2F333F;
        }
        body.night-mode .btn-interact:hover {
            background-color: #252830;
            border-color: #4A4F5E;
        }

        /* Animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(15px);
            filter: blur(8px);
            transition: opacity 1.2s ease-out, transform 1.2s ease-out, filter 1.2s ease-out;
            will-change: opacity, transform, filter;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }
        .animate-fade-in { animation: fadeIn 1.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .breathing-text { animation: breathe 6s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

            background-image: url('https://www.transparenttextures.com/patterns/dust.png');

            pointer-events: none;
            mix-blend-mode: multiply;
            transition: opacity 3s ease;

        body.night-mode .noise-bg { opacity: 0.15; mix-blend-mode: overlay; }
        
        .btn-interact { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-interact:active { transform: scale(0.98); }

<body class="min-h-screen flex flex-col selection:bg-[#D6CFC0] selection:text-[#4A4740]">

    <div class="fixed inset-0 noise-bg z-0"></div>
    <canvas id="bg-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-60"></canvas>

    <div id="app" class="relative z-10 w-full max-w-2xl mx-auto min-h-screen flex flex-col"></div>

    <script>
        // --- 1. Visual Effects System ---
        const EFFECTS = {
            canvas: null, ctx: null, particles: [], wind: { x: 0, y: 0 }, isNight: false, animationFrame: null,
            init() {
                this.canvas = document.getElementById('bg-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                const count = window.innerWidth < 768 ? 35 : 70;
                for (let i = 0; i < count; i++) this.particles.push(this.createParticle());
                this.animate();
            },
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
            createParticle() {
                return {
                    x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height,
                    size: Math.random() * 2 + 0.5,
                    baseSpeedX: Math.random() * 0.4 - 0.2, baseSpeedY: Math.random() * 0.4 - 0.2,
                    opacity: Math.random() * 0.4 + 0.1
                };
            },
            setWind(level) {
                const targets = [{ x: 0, y: 0 }, { x: 0.5, y: 0 }, { x: 4.5, y: 0.3 }];
                this.wind = targets[level] || { x: 0, y: 0 };
            },
            setTheme(theme) {
                this.isNight = theme === 'night';
                this.isNight ? document.body.classList.add('night-mode') : document.body.classList.remove('night-mode');
            },
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = this.isNight ? 'rgba(200, 200, 210, 0.5)' : '#8C887E';
                this.ctx.strokeStyle = this.isNight ? 'rgba(200, 200, 210, 0.3)' : 'rgba(140, 136, 126, 0.3)';
                this.particles.forEach(p => {
                    this.ctx.beginPath();
                    this.ctx.globalAlpha = p.opacity;
                    const totalSpeed = Math.abs(this.wind.x) + Math.abs(this.wind.y);
                    if (totalSpeed > 2) {
                        this.ctx.lineWidth = p.size / 2;
                        this.ctx.moveTo(p.x, p.y);
                        this.ctx.lineTo(p.x - this.wind.x * (4 + p.size), p.y - this.wind.y * (4 + p.size));
                        this.ctx.stroke();
                    } else {
                        this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    p.x += p.baseSpeedX + this.wind.x; p.y += p.baseSpeedY + this.wind.y;
                    if (p.x < -50) p.x = this.canvas.width + 50; if (p.x > this.canvas.width + 50) p.x = -50;
                    if (p.y < -50) p.y = this.canvas.height + 50; if (p.y > this.canvas.height + 50) p.y = -50;
                });
                this.animationFrame = requestAnimationFrame(() => this.animate());
            }
        };

        // --- 2. Data Structures ---
        
        const SCENES = { INTRO: 'INTRO', MENU: 'MENU', ROLE_SELECT: 'ROLE_SELECT', GAME: 'GAME', ENDING: 'ENDING' };

                node_3: { theme: 'night', effectLevel: 2, text: ["突然起風了，帳棚被吹得嘎嘎作響。", "孩子驚醒大哭。", "你也很害怕，但在那一刻，你必須做出反應。"], choices: [{ text: "我大聲斥責風聲，試圖用憤怒來掩蓋恐懼。", stat: STATS.CONTROL, nextId: 'node_4' }, { text: "我摀住孩子的耳朵，假裝聽不見外面的聲音。", stat: STATS.ESCAPE, nextId: 'node_4' }, { text: "我抱緊孩子，輕聲說：「風很大，但我們在一起。」", stat: STATS.TRUST, nextId: 'node_4' }] },
                node_4: { theme: 'night', effectLevel: 0, text: ["風停了，漫長的一夜終於過去。", "如果此刻有一位完全的父親/母親對你說話，你覺得他會說什麼？"], choices: [{ text: "他會說我做得還不夠好，要更努力。", stat: STATS.CONTROL, nextId: 'end_calculation' }, { text: "他會說這太苦了，放棄也沒關係。", stat: STATS.ESCAPE, nextId: 'end_calculation' }, { text: "他會說：「孩子交給我，你也可以休息。」", stat: STATS.TRUST, nextId: 'end_calculation' }] }

                },
                node_2: { theme: 'night', effectLevel: 0, text: ["夜深人靜，這是一天中最孤單的時刻。", "沒有人可以商量，決策的重擔只能自己扛。", "你現在最想做什麼？"], choices: [{ text: "反覆推演所有計畫，確保萬無一失。", stat: STATS.CONTROL, nextId: 'node_3' }, { text: "喝一杯酒，讓自己暫時忘記這些數字。", stat: STATS.ESCAPE, nextId: 'node_3' }, { text: "抬頭看星空，承認自己其實很渺小。", stat: STATS.TRUST, nextId: 'node_3' }] },
                node_3: { theme: 'night', effectLevel: 2, text: ["突然市場/環境颳起一陣大風。", "原本的佈局完全失效了。", "恐懼瞬間抓住了你。", "你會？"], choices: [{ text: "我不甘心，我要用更多的資源去對抗環境。", stat: STATS.CONTROL, nextId: 'node_4' }, { text: "我想把公司收了，大家解散算了。", stat: STATS.ESCAPE, nextId: 'node_4' }, { text: "我深呼吸，尋求在風暴中不動搖的智慧。", stat: STATS.TRUST, nextId: 'node_4' }] },
                node_4: { theme: 'night', effectLevel: 0, text: ["風暴過後，一片狼籍，但也異常清晰。", "如果此刻有一個比你更大的老闆（上帝）對你說話，他會說？"], choices: [{ text: "你搞砸了，下次不准再犯。", stat: STATS.CONTROL, nextId: 'end_calculation' }, { text: "你不適合這裡，退下吧。", stat: STATS.ESCAPE, nextId: 'end_calculation' }, { text: "「你當剛強壯膽，不要懼怕，因為我與你同在。」", stat: STATS.TRUST, nextId: 'end_calculation' }] }
            }
        };

        // --- 4. Role-Specific Ending Scriptures ---
        const ENDING_VERSES = {
            [ROLES.PARENT.id]: { text: "「他必像牧人牧養自己的羊群，用膀臂聚集羊羔抱在懷中，慢慢引導那乳養小羊的。」", ref: "— 以賽亞書 40:11" },
            [ROLES.CHILD.id]: { text: "「耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。」", ref: "— 耶利米書 29:11" },
            [ROLES.EMPLOYEE.id]: { text: "「他使我躺臥在青草地上，領我在可安歇的水邊。他使我的靈魂甦醒。」", ref: "— 詩篇 23:2-3" },
            [ROLES.BOSS.id]: { text: "「我豈沒有吩咐你嗎？你當剛強壯膽！不要懼怕，也不要驚惶，因為你無論往哪裡去，耶和華─你的神必與你同在。」", ref: "— 約書亞記 1:9" }
        };

        let currentState = {
            scene: SCENES.INTRO,
            selectedRole: null, // 新增：選擇的角色
            currentNodeId: 'start',
            playerStats: { [STATS.CONTROL]: 0, [STATS.ESCAPE]: 0, [STATS.TRUST]: 0 }
        };

        // --- 5. Core Logic ---

        function initApp() { EFFECTS.init(); renderScene(); }

        function goToMenu() { currentState.scene = SCENES.MENU; renderScene(); }

        // Start logic flow
        function startChapter(chapterId) {
            if (chapterId === 'ch4') {
                currentState.scene = SCENES.ROLE_SELECT; // 先去選角色
                renderScene();
            }
        }

        function selectRole(roleId) {
            currentState.selectedRole = roleId;
            currentState.scene = SCENES.GAME;
            currentState.currentNodeId = 'start';
            currentState.playerStats = { [STATS.CONTROL]: 0, [STATS.ESCAPE]: 0, [STATS.TRUST]: 0 };
            renderScene();
        }

        function handleChoice(stat, nextId) {
            currentState.playerStats[stat] += 1;
            if (nextId === 'end_calculation') {
                currentState.scene = SCENES.ENDING;
            } else {
                currentState.currentNodeId = nextId;
            }
            renderScene();
        }

        function getEndingContent() {
            const { control, escape, trust } = currentState.playerStats;
            const roleId = currentState.selectedRole || ROLES.PARENT.id; // Fallback
            
            // 1. 計算優勢心理狀態 (Dominant Stat) -> 決定 Reflection (通用)
            let dominant = STATS.TRUST;
            if (control >= escape && control >= trust) dominant = STATS.CONTROL;
            else if (escape >= control && escape >= trust) dominant = STATS.ESCAPE;

            const reflections = {
                [STATS.CONTROL]: "在這段旅程中，你一直試圖「搞清楚」狀況。這顯示了你的負責與堅韌，但同時，那個必須隨時保持警戒的你，其實已經很累了。",
                [STATS.ESCAPE]: "面對這片荒蕪，你本能地尋找掩護。這不是軟弱，而是你保護自己心靈不受傷害的方式。但有時候，那些轉移注意力的東西，反而讓你更聽不見自己的聲音。",
                [STATS.TRUST]: "你選擇了最困難的一條路：誠實地面對不確定性。雖然手在發抖，但你沒有逃跑。這份在未知中停留的勇氣，是你最珍貴的特質。"
            };

            const actions = {
                [STATS.CONTROL]: "【今日練習】\n今晚睡覺前，試著不為明天做任何一個具體的計畫。容許明天早上醒來時，有5分鐘的空白，問自己：「我現在感覺如何？」。",
                [STATS.ESCAPE]: "【今日練習】\n今天找一個獨處的時刻，關掉手機，只給自己10分鐘。如果感到焦慮，對那個焦慮說：「我看見你了，沒關係。」",
                [STATS.TRUST]: "【今日練習】\n找一張紙，寫下這段時間讓你感到最「無力」的一件事。寫完後，將紙摺起來放在一個盒子裡，象徵這件事暫時交託出去。"
            };

            // 2. 獲取角色專屬經文 (Role Specific Verse)
            const verseData = ENDING_VERSES[roleId];

            return {
                reflection: reflections[dominant],
                voice: `${verseData.text}<br><span class='text-sm mt-2 block not-italic opacity-80'>${verseData.ref}</span>`,
                action: actions[dominant]
            };
        }

        // --- 6. Render Logic ---

        function renderScene() {
            const app = document.getElementById('app');
            app.innerHTML = ''; 
            
            // Set Theme/Wind defaults based on scene
            if (currentState.scene === SCENES.GAME) {
                // Get node data from specific role script
                const roleScript = ROLE_SCRIPTS[currentState.selectedRole];
                const node = roleScript[currentState.currentNodeId];
                if (node.effectLevel !== undefined) EFFECTS.setWind(node.effectLevel);
                if (node.theme !== undefined) EFFECTS.setTheme(node.theme);
            } else {
                EFFECTS.setWind(0);
                EFFECTS.setTheme('day');
            }

            // --- INTRO ---
            if (currentState.scene === SCENES.INTRO) {
                app.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen p-6 text-center animate-fade-in w-full max-w-2xl mx-auto">
                        <div class="mb-6 opacity-60"><i data-lucide="footprints" width="48" height="48" stroke-width="1" class="text-[#6B6559]"></i></div>
                        <h1 class="text-3xl md:text-5xl font-serif tracking-widest mb-6">THE JOURNEY</h1>
                        <div class="w-16 h-1 bg-[#D6CFC0] mb-8"></div>
                        <div class="bg-white/60 p-6 rounded-lg border border-[#D6CFC0] mb-8 text-left space-y-4 shadow-sm w-full backdrop-blur-sm">
                            <h3 class="font-bold tracking-widest text-sm uppercase mb-2 text-[#4A4740]">關於此體驗</h3>
                            <p class="text-sm md:text-base text-[#6B6559] leading-relaxed">這是一個靈感來自《出埃及記》敘事的沉浸式互動遊戲。</p>
                            <p class="text-sm md:text-base text-[#6B6559] leading-relaxed">我們邀請你戴上耳機，找個安靜的地方，誠實地面對內心的聲音。</p>
                        </div>
                        <button onclick="goToMenu()" class="btn-interact px-8 py-5 rounded-lg text-xl tracking-widest font-medium w-full max-w-xs bg-[#4A4740] text-[#F5F2EA] hover:bg-[#2C2A26] shadow-md">進入旅程</button>
                    </div>`;
            } 
            // --- MENU ---
            else if (currentState.scene === SCENES.MENU) {
                const container = document.createElement('div');
                container.className = "flex flex-col min-h-screen p-6 md:p-12 pt-12 animate-fade-in w-full max-w-2xl mx-auto";
                container.innerHTML = `<div class="mb-10 text-center md:text-left"><h2 class="text-2xl font-serif tracking-widest mb-2">章節選擇</h2><p class="text-sm text-gray-500">請選擇你的旅程節點</p></div>`;
                const list = document.createElement('div');
                list.className = "flex flex-col gap-4 pb-12";
                CHAPTERS.forEach(chapter => {
                    const card = document.createElement('div');
                    const isLocked = chapter.locked;
                    card.className = `chapter-card w-full p-5 rounded-lg border border-[#EAE5D9] flex items-center justify-between group select-none ${isLocked ? 'locked' : 'active bg-white/80 backdrop-blur-sm'}`;
                    card.innerHTML = `
                        <div class="flex-1 pr-4">
                            <div class="flex items-center gap-3 mb-1">
                                <span class="text-sm font-bold ${isLocked ? 'text-gray-400' : 'text-current'} tracking-widest uppercase">${chapter.title}</span>
                                ${!isLocked && chapter.tag ? `<span class="bg-[#D6CFC0] text-[#4A4740] text-[10px] px-2 py-0.5 rounded-full font-bold">${chapter.tag}</span>` : ''}
                            </div>
                            <p class="text-sm ${isLocked ? 'text-gray-400' : 'text-muted'} leading-relaxed">${chapter.desc}</p>
                        </div>
                        <div class="${isLocked ? 'text-gray-300' : 'opacity-0 group-hover:opacity-100 transition-opacity'}">${isLocked ? '<i data-lucide="lock" width="20"></i>' : '<i data-lucide="chevron-right" width="24"></i>'}</div>`;
                    if (!isLocked) card.onclick = () => startChapter(chapter.id);
                    list.appendChild(card);
                });
                container.appendChild(list); app.appendChild(container);
            }
            // --- ROLE SELECT (NEW) ---
            else if (currentState.scene === SCENES.ROLE_SELECT) {
                const container = document.createElement('div');
                container.className = "flex flex-col min-h-screen p-6 md:p-12 pt-12 animate-fade-in w-full max-w-2xl mx-auto";
                
                // Header
                container.innerHTML = `
                    <div class="mb-8">
                        <button onclick="goToMenu()" class="text-xs font-bold tracking-[0.2em] opacity-60 mb-6 uppercase flex items-center gap-2 hover:opacity-100 transition-opacity">
                            <i data-lucide="arrow-left" width="14"></i> 回到目錄
                        </button>
                        <h2 class="text-2xl font-serif tracking-widest mb-2">你的身份</h2>
                        <p class="text-sm text-gray-500 leading-relaxed">每個人進入曠野的原因不同，感受也不同。<br>請選擇最貼近你現在心境的角色：</p>
                    </div>
                `;

                // Role Grid
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 gap-4 pb-12";

                Object.values(ROLES).forEach(role => {
                    const card = document.createElement('div');
                    card.className = "role-card bg-white/80 backdrop-blur-sm p-6 rounded-xl flex flex-col items-center text-center space-y-3";
                    card.innerHTML = `
                        <div class="p-3 bg-[#F5F2EA] rounded-full mb-1">
                            <i data-lucide="${role.icon}" width="24" height="24" class="text-[#4A4740]"></i>
                        </div>
                        <h3 class="font-bold text-lg tracking-wide text-[#4A4740]">${role.title}</h3>
                        <p class="text-sm text-gray-500 leading-relaxed">${role.desc}</p>
                    `;
                    card.onclick = () => selectRole(role.id);
                    grid.appendChild(card);
                });

                container.appendChild(grid);
                app.appendChild(container);
            }
            // --- GAMEPLAY ---
            else if (currentState.scene === SCENES.GAME) {
                const roleScript = ROLE_SCRIPTS[currentState.selectedRole];
                const node = roleScript[currentState.currentNodeId];
                
                const container = document.createElement('div');
                container.className = "flex flex-col flex-grow p-6 md:p-12 pt-12 md:pt-20 max-w-2xl mx-auto w-full";
                
                const header = document.createElement('div');
                header.className = "text-xs font-bold tracking-[0.2em] opacity-60 mb-8 uppercase flex items-center gap-2 cursor-pointer hover:opacity-100 transition-opacity";
                header.innerHTML = `<i data-lucide="arrow-left" width="14"></i> 回到目錄`;
                header.onclick = goToMenu; 
                container.appendChild(header);

                const subTitle = document.createElement('div');
                subTitle.className = "text-xs font-bold tracking-[0.2em] opacity-60 mb-8 uppercase flex items-center gap-2 justify-between";
                // Show current role in header
                const currentRoleTitle = Object.values(ROLES).find(r => r.id === currentState.selectedRole).title;
                subTitle.innerHTML = `
                    <span class="flex items-center gap-2"><i data-lucide="wind" width="14"></i> 第四章：曠野</span>
                    <span class="bg-[#EAE5D9] text-[#4A4740] px-2 py-0.5 rounded text-[10px]">${currentRoleTitle}</span>
                `;
                container.appendChild(subTitle);

                const textContainer = document.createElement('div');
                textContainer.className = "space-y-6 mb-12";
                container.appendChild(textContainer);

                const choicesContainer = document.createElement('div');
                choicesContainer.className = "space-y-4 transition-all duration-1000 opacity-0 transform translate-y-4 pointer-events-none";
                container.appendChild(choicesContainer);

                app.appendChild(container);

                const lineSpeed = 1500;
                node.text.forEach((line, index) => {
                    const p = document.createElement('p');
                    p.className = "text-lg md:text-xl leading-loose fade-in-up"; 
                    p.innerText = line;
                    textContainer.appendChild(p);
                    setTimeout(() => p.classList.add('visible'), index * lineSpeed);
                });

                node.choices.forEach((choice) => {
                    const btn = document.createElement('button');
                    btn.className = "btn-interact w-full px-6 py-4 rounded-lg text-left text-lg leading-relaxed font-medium tracking-wide bg-[#F5F2EA] text-[#4A4740] shadow-sm border border-[#D6CFC0] hover:bg-[#EAE5D9] active:bg-[#D6CFC0] hover:border-gray-400";
                    btn.innerText = choice.text;
                    btn.onclick = () => handleChoice(choice.stat, choice.nextId);
                    choicesContainer.appendChild(btn);
                });

                setTimeout(() => {
                    choicesContainer.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                    choicesContainer.classList.add('opacity-100', 'translate-y-0');
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, node.text.length * lineSpeed);
            }
            // --- ENDING ---
            else if (currentState.scene === SCENES.ENDING) {
                const content = getEndingContent();
                app.innerHTML = `
                    <div class="flex flex-col min-h-screen p-8 md:p-12 pt-16 animate-fade-in max-w-2xl mx-auto w-full">
                        <div class="text-center mb-12">
                            <div class="mx-auto mb-4 opacity-60 flex justify-center"><i data-lucide="feather" width="32" height="32" stroke-width="1"></i></div>
                            <h2 class="text-2xl font-serif tracking-widest">旅程暫歇</h2>
                        </div>
                        <div class="space-y-12">
                            <div class="bg-white/60 backdrop-blur-sm p-8 rounded-xl border border-[#EAE5D9] shadow-sm text-dark">
                                <h3 class="text-sm font-bold text-gray-500 tracking-widest uppercase mb-4">你的旅程鏡像</h3>
                                <p class="text-lg leading-relaxed text-[#4A4740]">${content.reflection}</p>
                            </div>
                            <div class="px-4 border-l-2 border-[#D6CFC0] py-4 breathing-text origin-left">
                                <p class="text-xl md:text-2xl font-serif italic opacity-80 leading-relaxed">${content.voice}</p>
                            </div>
                            <div class="bg-[#4A4740] text-[#F5F2EA] p-8 rounded-xl shadow-lg transform transition-all active:scale-[0.99] btn-interact">
                                <h3 class="text-sm font-bold text-[#D6CFC0] tracking-widest uppercase mb-4 flex items-center gap-2"><i data-lucide="sun" width="16"></i> 下一步行動</h3>
                                <p class="text-lg leading-relaxed whitespace-pre-line">${content.action}</p>
                            </div>
                            <div class="mt-8 p-6 bg-[#F5F2EA]/80 backdrop-blur-sm rounded-xl border border-[#EAE5D9] flex flex-col items-center text-center space-y-4 text-dark">
                                <h3 class="text-sm font-bold text-gray-500 tracking-widest uppercase">延伸探索</h3>
                                <p class="text-sm text-gray-500 leading-relaxed max-w-xs">如果你想找個人聊聊剛才的感受，<br>或是尋找更多類似的陪伴...</p>
                                <div class="bg-white p-3 rounded-lg shadow-sm">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://example.com/church-connect" alt="Connect QR Code" class="w-32 h-32 opacity-90 mix-blend-multiply" loading="lazy">
                                </div>
                                <p class="text-xs text-gray-400 mt-2">掃描 QR Code，延續這份對話</p>
                            </div>
                        </div>
                        <div class="mt-12 pb-12 text-center">
                            <button onclick="goToMenu()" class="opacity-60 hover:opacity-100 py-3 px-6 rounded text-base transition-colors">返回章節目錄</button>
                        </div>
                    </div>`;
            }
            lucide.createIcons();
        }
        initApp();
    </script>
</body>
</html>
