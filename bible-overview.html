<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經六十六卷歷史概覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS for Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            --paper-bg: #fdf6e3;
            --sidebar-bg: #eee8d5;
            --text-main: #433422;
            --accent-gold: #b58900;
            --accent-red: #dc322f;
            --border-color: #d3c6aa;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--paper-bg);
            color: var(--text-main);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* Classical Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--sidebar-bg); 
        }
        ::-webkit-scrollbar-thumb {
            background: #93a1a1; 
            border-radius: 4px;
        }

        .classical-border {
            border: 3px double var(--border-color);
            border-radius: 4px;
        }

        .menu-item {
            transition: all 0.3s ease;
            position: relative;
        }
        .menu-item:hover, .menu-item.active {
            background-color: rgba(181, 137, 0, 0.1);
            color: #8b4513;
            padding-left: 1.5rem;
        }
        .menu-item.active::before {
            content: '❧';
            position: absolute;
            left: 0.5rem;
            color: var(--accent-red);
        }

        .book-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            background: #fffbf0;
            border: 1px solid var(--border-color);
        }
        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(67, 52, 34, 0.15);
            border-color: var(--accent-gold);
        }

        .drop-cap::first-letter {
            font-size: 3em;
            float: left;
            line-height: 0.8;
            padding-right: 0.1em;
            color: var(--accent-red);
        }

        /* Ornament divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: var(--border-color);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider::before { margin-right: .5em; }
        .divider::after { margin-left: .5em; }

        /* Map Styles */
        .map-frame {
            position: relative;
            border: 8px solid #eee8d5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-top: 2rem;
            background: #e6d8ad;
            /* Magnified map height */
            height: 60vh; 
            min-height: 450px;
            z-index: 1; /* Ensure below overlays */
        }
        
        .map-caption-box {
            background: rgba(253, 246, 227, 0.95);
            border-top: 2px solid var(--border-color);
            padding: 1rem;
            font-size: 1rem; /* Slightly larger text */
            color: #586e75;
        }

        /* Leaflet popup styling override to match theme */
        .leaflet-popup-content-wrapper {
            background: var(--paper-bg);
            border-radius: 4px;
            font-family: 'Noto Serif TC', serif;
            color: #433422;
        }
        .leaflet-popup-tip {
            background: var(--paper-bg);
        }
        
        /* Custom label styling for map */
        .map-label {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #8b4513;
            color: #8b4513;
            font-family: 'Noto Serif TC', serif;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        /* Hide leaflet tooltip arrow */
        .leaflet-tooltip-top:before, 
        .leaflet-tooltip-bottom:before, 
        .leaflet-tooltip-left:before, 
        .leaflet-tooltip-right:before {
            border: none !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Mobile Header -->
    <header class="md:hidden bg-[#e6d8ad] p-4 border-b-2 border-[#d3c6aa] flex justify-between items-center z-20 shadow-md">
        <h1 class="text-xl font-bold text-[#8b4513]">聖經全卷概覽</h1>
        <button id="menu-toggle" class="text-[#8b4513] focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <!-- Sidebar Menu -->
    <aside id="sidebar" class="w-full md:w-64 bg-[#eee8d5] border-r-4 border-double border-[#d3c6aa] flex-shrink-0 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 absolute md:relative z-20 h-full">
        <div class="p-6 border-b border-[#d3c6aa] hidden md:block text-center">
            <div class="text-3xl text-[#8b4513] mb-1">✝</div>
            <h1 class="text-2xl font-bold tracking-widest text-[#8b4513]">聖經概覽</h1>
            <p class="text-xs text-[#657b83] mt-2 italic">從亙古到永遠</p>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4">
            <ul id="menu-list" class="space-y-1">
                <!-- JS will populate this -->
            </ul>
        </nav>
        
        <div class="p-4 text-center text-xs text-[#93a1a1] border-t border-[#d3c6aa]">
            Sola Scriptura
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto relative w-full h-full z-0" id="main-scroll">
        <!-- Expanded max-width for magnified view -->
        <div class="w-full max-w-7xl mx-auto p-6 md:p-12 min-h-full">
            
            <!-- Breadcrumb / Back Button -->
            <div id="breadcrumb" class="mb-6 hidden">
                <button onclick="goBack()" class="flex items-center text-[#b58900] hover:text-[#8b4513] transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    返回時期列表
                </button>
            </div>

            <!-- Content Container -->
            <div id="content-display">
                <!-- Dynamic Content Goes Here -->
                <div class="flex flex-col items-center justify-center h-full text-center mt-20 fade-in">
                    <div class="text-6xl mb-6 text-[#d3c6aa]">📖</div>
                    <h2 class="text-3xl font-bold mb-4 text-[#8b4513]">歡迎進入聖經歷史之旅</h2>
                    <p class="text-lg max-w-lg leading-relaxed">
                        這是一個探索聖經六十六卷書的互動地圖。<br>
                        請點選左側選單，依照歷史時期的順序，<br>
                        深入了解神在歷史中的作為。
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Overlay for mobile menu -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 hidden md:hidden"></div>

    <script src="bible_data.js"></script>
    <script>
        // --- Logic ---
        const menuList = document.getElementById('menu-list');
        const contentDisplay = document.getElementById('content-display');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const breadcrumb = document.getElementById('breadcrumb');
        
        // Leaflet Map Variables
        let currentMap = null;
        let currentLayerGroup = null;

        // Init Menu
        function renderMenu() {
            menuList.innerHTML = ''; 
            timelineData.forEach((era, index) => {
                const bookCount = era.books.length;
                const li = document.createElement('li');
                li.innerHTML = `
                    <button onclick="loadCategory(${index})" class="menu-item w-full text-left px-6 py-3 text-[#433422] font-semibold hover:bg-opacity-20 flex justify-between items-center group">
                        <span class="flex items-center">
                            <span class="inline-block w-6 text-center text-[#b58900] mr-2 text-sm font-serif">${era.id}.</span>
                            ${era.title}
                        </span>
                        <span class="text-xs text-[#93a1a1] group-hover:text-[#b58900] transition-colors">(${bookCount})</span>
                    </button>
                `;
                menuList.appendChild(li);
            });
        }

        // Load Category View
        function loadCategory(index) {
            const data = timelineData[index];
            
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-item')[index].classList.add('active');

            closeMobileMenu();
            breadcrumb.classList.add('hidden');

            // Render Content with Map Container
            contentDisplay.innerHTML = `
                <div class="animate-fade-in">
                    <div class="text-center mb-8 border-b-2 border-[#d3c6aa] pb-6">
                        <span class="text-[#b58900] tracking-[0.3em] uppercase text-sm mb-2 block">${data.subtitle}</span>
                        <h2 class="text-4xl font-bold text-[#8b4513] mb-4">${data.title}</h2>
                        <div class="text-2xl text-[#d3c6aa]">❖</div>
                    </div>

                    <div class="mb-8 px-4 md:px-8">
                        <p class="text-lg leading-loose drop-cap text-justify">
                            ${data.desc}
                        </p>
                    </div>

                    <!-- Interactive Map Section -->
                    <div class="mb-10 px-2 md:px-6">
                        <div id="map-container" class="map-frame rounded-sm"></div>
                        <div class="map-caption-box mt-1 rounded-sm shadow-sm border border-[#d3c6aa] text-justify leading-relaxed">
                            <strong class="text-[#b58900] font-bold block mb-1">🗺️ 地理範疇：</strong>
                            ${data.mapScope}
                        </div>
                    </div>

                    <div class="divider"><span class="px-4 text-[#8b4513] italic font-serif">本時期書卷 (${data.books.length})</span></div>

                    <!-- Enhanced Grid for books -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
                        ${data.books.map(book => `
                            <div onclick="loadBook(${index}, '${book.id}')" class="book-card p-6 rounded relative group">
                                <div class="absolute top-0 right-0 p-2 text-[#d3c6aa] opacity-20 group-hover:opacity-100 transition-opacity">
                                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/></svg>
                                </div>
                                <h3 class="text-xl font-bold text-[#8b4513] mb-2 border-l-4 border-[#b58900] pl-3">${book.name}</h3>
                                <p class="text-sm text-[#657b83] line-clamp-2">${book.purpose}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            // Initial Map with Shapes
            initMap(data.mapConfig);
            
            document.getElementById('main-scroll').scrollTop = 0;
        }

        // Initialize Leaflet Map
        function initMap(config) {
            // If map exists but container is gone (re-render), we need to reset
            const container = document.getElementById('map-container');
            if (currentMap && currentMap.getContainer() !== container) {
                currentMap.remove();
                currentMap = null;
            }

            if (!currentMap) {
                 // Default view, will be overridden by fitBounds
                currentMap = L.map('map-container').setView([32, 35], 5);
                
                // Switch to Google Maps Tiles for Chinese Support
                L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=zh-TW', {
                    attribution: '&copy; Google Maps',
                    maxZoom: 18,
                    opacity: 1
                }).addTo(currentMap);
                
                currentLayerGroup = L.layerGroup().addTo(currentMap);
            } else {
                currentLayerGroup.clearLayers();
            }

            // Draw Shapes (Polylines or Polygons)
            if (config.shapes && config.shapes.length > 0) {
                const bounds = L.latLngBounds([]);

                config.shapes.forEach(shape => {
                    let layer;
                    if (shape.type === 'line') {
                        // Arrow decoration is complex in basic Leaflet, using simple dashed line for route
                        layer = L.polyline(shape.coords, {
                            color: shape.color,
                            weight: 4,
                            dashArray: '10, 10', // Dashed line for routes
                            opacity: 0.8
                        });
                    } else if (shape.type === 'polygon') {
                        layer = L.polygon(shape.coords, {
                            color: shape.color,
                            fillColor: shape.color,
                            fillOpacity: 0.2, // Transparent fill
                            weight: 2
                        });
                    }

                    if (layer) {
                        layer.addTo(currentLayerGroup);
                        // CHANGED: Use bindTooltip with permanent: true instead of bindPopup
                        layer.bindTooltip(shape.label, {
                            permanent: true, 
                            direction: 'center', 
                            className: 'map-label'
                        }); 
                        
                        // Extend bounds to fit this shape
                        if (shape.type === 'line') {
                            shape.coords.forEach(coord => bounds.extend(coord));
                        } else {
                            shape.coords.forEach(coord => bounds.extend(coord));
                        }
                    }
                });

                // Auto zoom to fit all shapes
                if (bounds.isValid()) {
                    currentMap.fitBounds(bounds, { padding: [50, 50] });
                }
            }
        }

        // Load Book Detail View (Same as before)
        function loadBook(categoryIndex, bookId) {
            const category = timelineData[categoryIndex];
            const book = category.books.find(b => b.id === bookId);

            breadcrumb.classList.remove('hidden');
            breadcrumb.querySelector('button').onclick = () => loadCategory(categoryIndex);

            contentDisplay.innerHTML = `
                <div class="animate-fade-in bg-[#fffbf0] p-8 md:p-12 rounded shadow-lg border-2 border-[#eee8d5] relative overflow-hidden">
                    <!-- Decor -->
                    <div class="absolute top-0 left-0 w-20 h-20 border-t-4 border-l-4 border-[#d3c6aa] rounded-tl-3xl m-4"></div>
                    <div class="absolute bottom-0 right-0 w-20 h-20 border-b-4 border-r-4 border-[#d3c6aa] rounded-br-3xl m-4"></div>

                    <div class="text-center mb-10 relative z-10">
                        <span class="bg-[#b58900] text-white px-3 py-1 text-xs rounded-full uppercase tracking-wider mb-3 inline-block cursor-pointer hover:bg-[#8b4513] transition-colors" onclick="loadCategory(${categoryIndex})">${category.title}</span>
                        <h2 class="text-5xl font-bold text-[#8b4513] mb-2 tracking-tight">${book.name}</h2>
                        <p class="text-[#93a1a1] italic mt-2">Author: ${book.author}</p>
                    </div>

                    <div class="space-y-10 relative z-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 border-b border-[#d3c6aa] pb-8">
                            <div>
                                <h4 class="text-[#b58900] font-bold uppercase text-xs tracking-widest mb-2 flex items-center"><span class="text-lg mr-2">⏳</span>寫作年代</h4>
                                <p class="text-lg font-serif">${book.date}</p>
                            </div>
                            <div>
                                <h4 class="text-[#b58900] font-bold uppercase text-xs tracking-widest mb-2 flex items-center"><span class="text-lg mr-2">✍️</span>作者</h4>
                                <p class="text-lg font-serif">${book.author}</p>
                            </div>
                        </div>

                        <div>
                            <h4 class="text-[#b58900] font-bold uppercase text-xs tracking-widest mb-3 flex items-center"><span class="text-lg mr-2">🎯</span>寫作目的</h4>
                            <div class="text-lg leading-loose text-[#433422] text-justify bg-white bg-opacity-50 p-6 rounded border border-[#eee8d5] shadow-sm">
                                ${book.purpose}
                            </div>
                        </div>

                        <div>
                            <h4 class="text-[#b58900] font-bold uppercase text-xs tracking-widest mb-3 flex items-center"><span class="text-lg mr-2">🏰</span>歷史背景</h4>
                            <div class="text-lg leading-loose text-[#433422] text-justify">
                                ${book.background}
                            </div>
                        </div>

                        <div class="bg-[#eee8d5] p-8 rounded-lg border-l-4 border-[#dc322f] italic shadow-inner mt-8">
                            <h4 class="text-[#dc322f] font-bold uppercase text-xs tracking-widest mb-4 not-italic flex items-center"><span class="text-lg mr-2">✨</span>關鍵經文</h4>
                            <p class="text-xl md:text-2xl font-serif leading-relaxed text-[#586e75]">"${book.verse}"</p>
                        </div>
                    </div>
                    
                    <div class="mt-8 text-center">
                         <button onclick="loadCategory(${categoryIndex})" class="text-[#b58900] hover:text-[#8b4513] text-sm underline decoration-dotted underline-offset-4">返回 ${category.title} 書卷列表</button>
                    </div>
                </div>
            `;
            document.getElementById('main-scroll').scrollTop = 0;
        }

        const menuBtn = document.getElementById('menu-toggle');
        
        function toggleMobileMenu() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                closeMobileMenu();
            }
        }

        function closeMobileMenu() {
            sidebar.classList.add('-translate-x-full');
            if(window.innerWidth >= 768) {
               sidebar.classList.remove('-translate-x-full');
            }
            overlay.classList.add('hidden');
        }

        menuBtn.addEventListener('click', toggleMobileMenu);
        overlay.addEventListener('click', closeMobileMenu);

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        });

        renderMenu();

        // CSS Animation
        const style = document.createElement('style');
        style.innerHTML = `
            .animate-fade-in { animation: fadeIn 0.5s ease-out; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
