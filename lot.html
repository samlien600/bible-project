        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&display=swap');

        /* 歷史質感基底設定 */
        body {

        .thought-bubble {

            letter-spacing: 0.02em;

        .theme-dark .thought-bubble { 
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #a1887f;
            color: #d7ccc8; 
        }
        .theme-doom .thought-bubble { 
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid #e57373;
            color: #ffcdd2; 
        }

        /* SVG 古地圖標記樣式 */

            letter-spacing: 0.08em;

            stroke-linejoin: round;
            stroke-linecap: round;
            stroke-width: 2.5px;

        }
        .map-text.water {
            fill: #2c3e3c;
        }

        /* 主題切換時的文字對應調整 */
        .theme-dark .map-text,
        .theme-doom .map-text {
            fill: #e6dfd8; /* 暗黑模式文字變紙白色 */
            stroke: #332f2c; /* 描邊融入暗色背景 */
        }
        .theme-dark .map-text.water,
        .theme-doom .map-text.water {
            fill: #8a9c9a;
        }

        /* 古典按鈕特效 */

            position: relative;

            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

    <script>
        // 遊戲狀態
        let state = {
            theme: 'default', // default, dark, doom
            visitedLocations: []
        };

        // 劇本數據 (純聖經主線)
        const storyNodes = {
            "prologue": {
                title: "前言：跨越千年的警告",
                text: `
                    <div class="text-center py-10 my-4 border-y-2 border-[#8c5a45] dark:border-[#a1887f]">
                        <p class="text-3xl md:text-5xl font-bold text-[#8c2222] dark:text-[#e57373] tracking-widest mb-6 leading-relaxed">
                            「你們要回想<br class="md:hidden">羅得的妻子。」
                        </p>
                        <p class="text-xl text-[#5d4037] dark:text-[#d7ccc8] font-semibold tracking-widest">
                            —— 路加福音 17:32
                        </p>
                    </div>
                    <p class="leading-loose mt-8 text-lg">
                        耶穌曾用這句簡短而有力的警告，提醒世人不要貪戀將亡的世界。<br><br>
                        羅得的失敗並非一夕之間造成的。現在，讓我們回到幾千年前的約旦河平原，走進羅得的內心世界，經歷他那一步步走向深淵的抉擇...
                    </p>
                `,
                action: { text: "翻開歷史的書卷", next: "start" }
            },
            "start": {
                title: "序章：蒙福與分歧",
                location: "bethel",
                text: "你是羅得。多年來，你跟隨著你的叔叔亞伯蘭（後改名亞伯拉罕）離開了吾珥，經歷了神的帶領。因為神的賜福，你們的牛群、羊群極多，甚至這片土地已經容不下你們兩家同居了。你的牧人和亞伯蘭的牧人常常發生爭吵。",
                thought: "這片土地實在太擁擠了，我的牧人連給羊群找水喝都要跟叔叔的人爭搶。這樣下去不是辦法，但我也不好意思開口，不知道叔叔會怎麼決定...",
                action: { text: "這天，亞伯蘭主動找你談話...", next: "separation" }
            },
            "separation": {
                title: "第一章：十字路口的選擇",
                location: "bethel",
                text: "亞伯蘭為了平息紛爭，對你說：「你我不可相爭... 遍地不都在你眼前嗎？請你離開我：你向左，我就向右；你向右，我就向左。」<br><br>你舉目觀看，看見約旦河的全平原，直到瑣珥，都是滋潤的。那地如同耶和華的園子。然而，那裡的所多瑪人在耶和華面前罪大惡極。",
                thought: "這片平原水草豐美，這正是我擴張產業的好機會！至於那裡的罪惡...只要我保守自己的心，不和他們同流合污就好了。為家人追求更好的生活，有什麼錯呢？",
                action: { 
                    text: "選擇約旦河的全平原，往東遷移 (創 13:11)", 
                    next: "moving_tent",
                    reflection: "【深度反思：貪戀世俗與舒適——眼目的情慾】<br><br>你用「追求更好的生活」合理化了自己的貪婪。當亞伯蘭憑信心讓出選擇權，將未來交託給神時，你卻憑「眼見」做決定。你看重了物質的豐盛（「如同耶和華的園子」），卻刻意忽略了當地屬靈環境的極度敗壞。這正是約翰一書 2:16 所警告的「眼目的情慾」。你為了現實利益，主動脫離了亞伯蘭的屬靈遮蓋，邁出了墮落的第一步。"
                }
            },
            "moving_tent": {
                title: "第二章：漸漸挪移帳棚",
                location: "plain",
                text: "你選擇了平原，與亞伯蘭分開。起初，你只是在平原的城邑之間遊牧。但你發現，平原的資源與生活，深受其中心城市「所多瑪」的影響。",
                thought: "住在野外風吹日曬，太辛苦了。所多瑪城牆堅固、市場繁榮。我只是把帳棚稍微靠近城一點，享受一些生活便利，這不代表我贊同他們的惡行啊。",
                theme: "dark",
                action: { 
                    text: "漸漸挪移帳棚，直到所多瑪 (創 13:12)", 
                    next: "city_gate",
                    reflection: "【深度反思：漸進式的妥協——向罪惡靠近】<br><br>罪惡的吞噬往往不是一步到位的，而是「溫水煮青蛙」。從「在平原的城邑之間遊牧」，到「漸漸挪移帳棚」，再到最終的「搬入城內」，你對罪惡的環境從警戒、習慣，最終變成了麻木。<br><br>你以為自己能「出淤泥而不染」，卻低估了環境對全家人的腐蝕力。正如箴言 4:23 說：「你要保守你心，勝過保守一切」，當你主動向罪惡靠近時，你的心就已經失守了。"
                }
            },
            "city_gate": {
                title: "第三章：城門口的審判官",
                location: "sodom",
                text: "時間飛逝，你不再是那個居無定所的牧羊人。如今，你買了房子，甚至坐在所多瑪的城門口——這代表著你在這座罪惡之城中擁有了一定的地位和發言權。每天，你看見城裡那些淫亂和強暴的事，你那「義人的心」天天感到痛苦。",
                thought: "我很痛苦，但我能做什麼？我好不容易在這裡取得了一席之地。如果我站出來強烈譴責他們，大家都會翻臉，我會失去一切。我只能在心裡痛苦，表面上還是得明哲保身...",
                action: { 
                    text: "坐在所多瑪城門口，與他們混居 (創 19:1)", 
                    next: "the_warning",
                    reflection: "【深度反思：信仰與生活脫節——失去鹽味的基督徒】<br><br>你成功融入了所多瑪，甚至成為了城門口的長老（審判官）。你贏得了世俗的地位與財富，卻成為了一個「默默無聲的義人」。為了維持人際關係與既得利益，你對罪惡保持沉默。<br><br>正如耶穌所說：「人若賺得全世界，賠上自己的生命，有甚麼益處呢？」（太16:26）你擁有了影響力，卻不敢發揮屬靈的影響力，最終信仰與生活嚴重脫節。"
                }
            },
            "the_warning": {
                title: "第四章：大難臨頭的警告",
                location: "sodom",
                text: "兩個天使在夜晚來到了所多瑪。城裡的人包圍了你的房子企圖行惡。天使將你拉進屋內，並嚴肅地說：「這城的人罪惡甚重，耶和華差我們來毀滅這地方。你去把你的女婿和家人都帶出去！」",
                thought: "神真的要毀滅這裡？我一生的心血都在這裡！但我必須去警告我的女婿們，這次關係到性命，他們總該聽我的了吧！",
                theme: "doom",
                action: { 
                    text: "跑去警告女婿，卻被當作戲言 (創 19:14)", 
                    next: "the_flight",
                    reflection: "【深度反思：失去見證的悲哀——毫無說服力的信仰】<br><br>這是何等諷刺與悲哀的一幕！當危機真正來臨時，你焦急地想拯救家人，但因為你平時的生活與世人毫無分別，你的警告在女婿們眼中竟成了一場「戲言」。<br><br>一個平時不敬畏神、對罪惡妥協的人，在災難前突然談論神的審判，沒有人會相信。你妥協的代價，就是連拯救自己家人的信用都徹底破產了。"
                }
            },
            "the_flight": {
                title: "第五章：遲延與討價還價",
                location: "sodom",
                text: "天明了，天使催逼你逃命：「不可回頭看，也不可在平原站住，要逃到山上！」<br><br>但是，看著屋裡華麗的陳設、積累的財富，你竟然遲延不走。天使因為神憐恤你，強拉著你們的手，把你們領出城外。",

                }
            },
            "the_salt_pillar": {

                location: "zoar",
                text: "神應允了你的請求。當太陽升起，你們終於逃到了瑣珥。就在那一刻，耶和華將硫磺與火從天上降與所多瑪和蛾摩拉。震耳欲聾的轟鳴聲撕裂了清晨的寧靜，平原上煙氣上騰，如同燒窯一般。<br><br>天使曾嚴厲警告：『逃命吧！不可回頭看！』<br><br>然而，在震天的毀滅聲中，你的妻子終究無法放下她留在城裡的一切——她的家、她的財寶、她所習慣的舒適。她違背了神的命令，在你的身後，轉頭望向了那片火海。<br><br>瞬間，她的身體僵住了。神聖的審判與她內心對罪惡之城的眷戀交織，她化作了一根白森森的鹽柱，永遠立在了死海的荒野中，成為了世世代代無言的鑒戒。",
                thought: "不...我的妻子！為什麼妳要回頭？我們明明已經逃出來了啊！那座城裡到底有什麼值得妳連命都不要？",
                theme: "doom",
                action: {

            const node = storyNodes[nodeId];

            if (nodeId === 'prologue') {
                state.theme = 'default';
                state.visitedLocations = [];
                mapContainer.classList.add('hidden'); // 前言隱藏地圖
            }

            if (nodeId === 'start') {
                mapContainer.classList.remove('hidden');

                document.getElementById('path-bethel-plain').style.strokeDashoffset = '100';
                document.getElementById('path-plain-sodom').style.strokeDashoffset = '100';
                document.getElementById('path-sodom-zoar').style.strokeDashoffset = '60';
                document.getElementById('path-zoar-cave').style.strokeDashoffset = '80';

            if (node.location) updateMap(node.location);
            if (node.theme) state.theme = node.theme;
            updateTheme();

            let html = `<div class="fade-in">`;
