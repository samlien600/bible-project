    <script>
        // --- Data: 43 Events with Detailed Narratives ---
        const events = [
            { id: 1, title: "天使報信", location: "拿撒勒", coords: [32.7019, 35.2971], chapter: "路加福音 1:26-38", 
              narrative: "在亙古的榮耀中，我注視著加利利那座名不見經傳的小城——拿撒勒。這裡遠離權力的中心，塵土飛揚，卻是我道成肉身、進入人類歷史的入口。父差遣天使加百列，去到一位名叫馬利亞的童女那裡。這不是偶然的選擇，而是永恆計畫的落實。\n\n我看見馬利亞臉上的驚惶，那是凡人面對屬天榮光時本能的畏懼。但隨即，那份驚惶化為了謙卑的聆聽。當加百列宣告她將因聖靈感孕，生下至高者的兒子時，她雖然困惑問道『我沒有出嫁，怎麼有這事呢？』，但在聽見『因為出於神的話，沒有一句不帶能力的』之後，她沒有再遲疑。她毅然說出：『我是主的使女，情願照你的話成就在我身上。』這句『情願』，如同破曉的第一道光，劃破了人類歷史沈寂的長夜。我的肉身生命，便在這位卑微女子的順服與信心中孕育了。", 
              characters: ["馬利亞(母親)", "天使加百列"] },
            { id: 2, title: "馬利亞訪以利沙伯", location: "猶大山地", coords: [31.765, 35.165], chapter: "路加福音 1:39-56", 
              narrative: "那時，雖然我在母腹中尚未成形，但我能感受到母親馬利亞的急切與喜樂。她急忙起身，往猶大的山地去，那是一段艱辛的旅程，但她心中懷著神聖的奧祕，腳步卻是輕盈的。當她進了撒迦利亞的家，問以利沙伯安時，奇妙的靈裡共鳴發生了。\n\n在以利沙伯腹中，那將要作我先鋒的約翰，因著聖靈的充滿而歡喜跳動。這不是普通的胎動，這是靈裡的歡呼，是僕人認出了君王。以利沙伯大聲宣告馬利亞是有福的。而我的母親馬利亞，她的靈被聖靈提升，唱出了那首傳頌千古的讚歌（Magnificat）：『我心尊主為大，我靈以神我的救主為樂。』這首歌，宣告了神要顛覆世上的權勢，叫有權柄的失位，叫卑微的升高，叫飢餓的得飽美食。這正是我將要帶來的國度，一個翻轉價值、憐憫貧窮的國度。", 
              characters: ["馬利亞(母親)", "以利沙伯", "施洗約翰(胎兒)"] },
            { id: 3, title: "降生伯利恆", location: "伯利恆", coords: [31.7054, 35.2024], chapter: "路加福音 2:1-20", 
              narrative: "因著凱撒亞古士督的一道報名上冊的詔令，約瑟帶著身孕重重的馬利亞，長途跋涉回到了大衛的城伯利恆。這看似是帝王的意志，實則是應驗先知彌迦的預言。客店裡人聲鼎沸，沒有我們容身之處。這個世界似乎沒有為它的造物主預備地方。\n\n於是在一個卑微的馬廄裡，伴隨著牲畜的氣息與乾草的粗糙，我降生了。母親用布將我包起來，放在馬槽裡。這就是我來到世間的第一個寶座——一個餵食牲畜的槽。然而，地上的冷清掩蓋不住天上的榮耀。在野地裡，天使向驚恐的牧羊人報佳音：『不要懼怕！我報給你們大喜的信息，是關乎萬民的。』榮耀歸於至高神，平安歸於地上喜悅的人。我的降生，選擇了最卑微的方式，是為了擁抱最卑微的人，不是為了受人的服事，而是為了服事人。", 
              characters: ["馬利亞(母親)", "約瑟", "牧羊人", "天使"] },
            { id: 4, title: "聖殿獻嬰", location: "耶路撒冷聖殿", coords: [31.7781, 35.2360], chapter: "路加福音 2:22-38", 
              narrative: "按摩西的律法，滿了潔淨的日子，父母帶我上耶路撒冷去獻給主。我們獻上的祭物是窮人的祭物——一對斑鳩。在宏偉的聖殿中，人來人往，並沒有多少人注意到這個貧窮家庭的嬰孩。\n\n但有兩位守望的長者例外。公義虔誠的西面，受了聖靈的感動，接過我，稱頌神說：『主啊，如今可以照你的話，釋放僕人安然去世，因為我的眼睛已經看見你的救恩。』他是舊時代盼望的終點。但他轉向我的母親，預言了一個沉重的未來：『這孩子被立，是要叫以色列中許多人跌倒，許多人興起...你自己的心也要被刀刺透。』救恩的道路，註定是一條伴隨著犧牲與苦痛的道路。年老的亞拿也前來稱謝神，將這事講給一切盼望耶路撒冷得救贖的人聽。我是那被立的記號，將顯露許多人心裡的意念。", 
              characters: ["西面", "亞拿", "馬利亞(母親)", "約瑟"] },
            { id: 5, title: "父家之事", location: "耶路撒冷聖殿", coords: [31.7781, 35.2360], chapter: "路加福音 2:41-52", 
              narrative: "十二歲那年，我們按著規矩上耶路撒冷守逾越節。那是我成年前的重要時刻。節期滿了，父母啟程回家，我卻留在了耶路撒冷。這不是頑皮，而是一種深沉的歸屬感在召喚我，我必須在父的家裡。\n\n三天後，他們在殿裡遇見我。我坐在教師中間，一面聽，一面問。凡聽見的人都希奇我的聰明和應對。當焦急的母親問我為何這樣做時，我回答：『為什麼找我呢？豈不知我應當以我父的事為念嗎？』這是第一次，我公開表明了我與天父的獨特關係，表明了我對神聖使命的意識。但我深知時候未到，於是我同他們下去，回到拿撒勒，並且順從他們。人子的成長，也需要在平凡的家庭生活中，盡諸般的義，在智慧和身量上增長。", 
              characters: ["馬利亞(母親)", "約瑟", "聖殿教師"] },
            { id: 6, title: "受洗", location: "約旦河", coords: [31.8373, 35.5463], chapter: "路加福音 3:21-22", 
              narrative: "三十歲，那沈默預備的日子結束了。我來到約旦河邊。那裡，我的表兄約翰正在宣講悔改的洗禮，眾人如潮水般湧來承認他們的罪。約翰看見我，想要攔阻，但我堅持要盡這諸般的義。\n\n我雖無罪，卻走入水中，與眾罪人同列。這不是為了洗去我的罪，而是為了認同人類的軟弱與需要，為了承擔他們的重擔。當我正禱告的時候，天開了，聖靈降臨在我身上，形狀彷彿鴿子；又有聲音從天上來，說：『你是我的愛子，我喜悅你。』這來自父的印證，如同堅固的磐石，成為我展開公開事奉、面對即將到來的試探與苦難的力量泉源。我是父的愛子，我將以順服來回應這份愛。", 
              characters: ["施洗約翰", "上帝(天父)", "聖靈"] },
            { id: 7, title: "曠野試探", location: "猶大曠野", coords: [31.7250, 35.3500], chapter: "路加福音 4:1-13", 
              narrative: "聖靈將我引到曠野。四十天，沒有食物，只有風沙、烈日與飢餓的燒灼感。在那裡，魔鬼來試探我，攻擊人性的弱點，試圖在我的事奉開始前就扭曲它。\n\n他利用我的飢餓，叫我變石頭為餅。我回答：『人活著不是單靠食物，乃是靠神口裡所出的一切話。』他帶我上高山，展示萬國的榮華，只要我一拜。這是捷徑的誘惑，但我拒絕：『當拜主你的神，單要事奉他。』他叫我從殿頂跳下以證明神的保護。我斥責：『不可試探主你的神。』我得勝，不是靠神蹟的炫耀，而是靠對父話語的絕對順服。這是一場關於身分與使命的戰爭，我選擇了十字架的道路，而非榮耀的捷徑。魔鬼暫時離開我，等待下一個時機。", 
              characters: ["魔鬼", "聖靈"] },
            { id: 8, title: "拿撒勒的拒絕", location: "拿撒勒", coords: [32.7019, 35.2971], chapter: "路加福音 4:16-30", 
              narrative: "帶著聖靈的能力，我回到長大的地方拿撒勒。安息日，我照常進了會堂。有人把先知以賽亞的書交給我。我展開書卷，讀出那關於彌賽亞的應許：『主的靈在我身上，因為他用膏膏我，叫我傳福音給貧窮的人；差遣我報告被擄的得釋放，瞎眼的得看見，叫那受壓制的得自由...』\n\n讀畢，我捲起書卷，對他們說：『這經你們聽見，今天應驗了。』起初他們稱讚我，但當我指出他們不信的心，並引用以利亞和以利沙時代神眷顧外邦人的例子時，他們的驕傲受傷了，轉瞬間變成了暴怒。他們攆我出城，要把我推下山崖。但我從他們中間直行過去了，因為我的時候還沒有到。先知在本地是沒有人尊敬的，這句話應驗在我身上，也預示了我將被本國百姓棄絕的命運。", 
              characters: ["拿撒勒鄉親", "以賽亞(書卷)"] },
            { id: 9, title: "迦百農的權柄", location: "迦百農", coords: [32.8810, 35.5750], chapter: "路加福音 4:31-41", 
              narrative: "我下到迦百農，這城成了我傳道的主要據點。在會堂裡教訓人時，一個被污鬼附著的人喊叫起來：『拿撒勒人耶穌，我們與你有什麼相干？你來滅我們嗎？我知道你是誰，乃是神的聖者！』這邪靈試圖用道出我身分來控制局面。\n\n我責備牠說：『不要作聲，從這人身上出來吧！』鬼雖掙扎，卻不得不服從。眾人都驚訝我的話帶有權柄。出了會堂，我進了西門的家。他的岳母害熱病甚重。我斥責那熱病，病就退了，她立刻起來服事我們。日落的時候，全城的人帶著各種病患來到門前，我一一按手醫治他們。我要讓世人知道，神的國在於大能，也在於對受苦之人的憐憫。我來，是要摧毀魔鬼的作為。", 
              characters: ["西門彼得", "彼得岳母", "污鬼"] },
            { id: 10, title: "呼召首徒", location: "加利利海", coords: [32.8256, 35.5350], chapter: "路加福音 5:1-11", 
              narrative: "清晨的革尼撒勒湖邊，眾人擁擠著要聽神的道。我看見兩隻船灣在湖邊，漁夫正在洗網。我上了西門的那隻船，請他撐開離岸稍微遠一點，就坐下教訓眾人。\n\n講完了，我對西門說：『把船開到水深之處，下網打魚。』西門雖然整夜勞力一無所獲，充滿了疲憊與無奈，但他還是順服了：『但依從你的話，我就下網。』結果，那一網魚裝滿了兩隻船，甚至船都要沉下去。西門彼得看見，就俯伏在我膝前說：『主啊，離開我，我是個罪人！』他在神蹟中看見了我的聖潔，也看見了自己的污穢。我看著這個將要成為教會柱石的漁夫，對他說：『不要怕，從今以後，你要得人了。』他和雅各、約翰，就撇下一切，跟從了我。", 
              characters: ["西門彼得", "雅各", "約翰"] },
            { id: 11, title: "醫治癱子", location: "迦百農", coords: [32.8810, 35.5750], chapter: "路加福音 5:17-26", 
              narrative: "有一天我在屋裡教導人，有法利賽人和教法師在座。因為人多，有人拆了房頂，將一個癱子連褥子縋下來，放在我面前。這突如其來的舉動打斷了講道，但我看見的不是混亂，而是他們信心的光芒。\n\n就對癱子說：『你的罪赦了。』這句話激怒了在場的宗教領袖，他們心裡議論這是僭妄，因為只有神能赦罪。我早已知道他們的意念，便問：『或說罪赦了，或說你起來行走，哪一樣容易呢？但要叫你們知道，人子在地上有赦罪的權柄。』於是我吩咐癱子起來，拿褥子回家去。那人立刻起來，歸榮耀與神。這一刻，我向世人顯明，身體的醫治固然重要，但靈魂的赦免才是天國的核心恩典。", 
              characters: ["癱子", "抬癱子的人", "法利賽人"] },
            { id: 12, title: "呼召利未", location: "迦百農稅關", coords: [32.8810, 35.5750], chapter: "路加福音 5:27-32", 
              narrative: "經過稅關時，我看見一個名叫利未的稅吏坐在那裡。在眾人眼中，他是羅馬人的走狗，是罪人，是不可接觸的。但在我眼中，他是一個迷失的羊，一個渴望被接納的靈魂。\n\n我只對他說了一句：『你跟從我來。』這句話如同閃電擊中他的靈魂。他就撇下一切，起來跟從了我，甚至在他家裡為我大擺筵席。法利賽人向我的門徒發怨言，問為什麼我和稅吏並罪人一同吃喝。我告訴他們：『無病的人用不著醫生，有病的人才用得著；我來本不是召義人悔改，乃是召罪人悔改。』這就是我使命的宣言，我是罪人的朋友，是靈魂的醫生。", 
              characters: ["利未(馬太)", "法利賽人"] },
            { id: 13, title: "平地寶訓", location: "八福山附近", coords: [32.8805, 35.5492], chapter: "路加福音 6:17-49", 
              narrative: "經過整夜的禱告，我選立了十二個使徒。隨後，我下山站在一塊平地上，許多門徒和百姓聚集。我看著這些貧窮的、飢餓的、哭泣的、被恨惡的人，心中充滿了憐憫與愛。\n\n我開口教導他們天國的價值觀，那與世界截然不同的標準：『你們貧窮的人有福了！因為神的國是你們的。』但我也有禍哉的警告給那些富足飽足的人。我頒布了最具挑戰性的命令：『愛你們的仇敵，善待恨你們的人。』這不是軟弱，這是像天父一樣仁慈。我教導他們不要論斷，要結好果子，要把根基立在磐石上。凡聽我話去行的，風吹雨打總不倒塌。這是天國子民的生活憲章。", 
              characters: ["十二使徒", "門徒群眾"] },
            { id: 14, title: "拿因城復活", location: "拿因城", coords: [32.6366, 35.3370], chapter: "路加福音 7:11-17", 
              narrative: "將近拿因城門的時候，一場悲劇正在上演。一個死人被抬出來，他是獨生子，母親又是寡婦。她失去丈夫，如今又失去唯一的兒子，這是何等大的絕望，意味著她將失去所有的依靠和社會地位。\n\n看見她，我的心被憐憫緊緊抓住。我對她說：『不要哭。』這不是空洞的安慰，而是權能的預告。我進前按住槓，抬的人就站住了。我發出命令：『少年人，我吩咐你起來！』死人就坐起，並且說話。我把他交給他的母親。死亡必須在生命之主面前退後。眾人都驚奇，歸榮耀與神，說神眷顧了他的百姓。這神蹟不僅是為了那個家庭，更是為了顯明神對孤苦人的眷顧。", 
              characters: ["拿因寡婦", "少年人"] },
            { id: 15, title: "罪女膏抹", location: "加利利", coords: [32.8500, 35.3000], chapter: "路加福音 7:36-50", 
              narrative: "一個法利賽人西門請我去吃飯。席間，一個城裡有罪的女人進來，拿著玉瓶。她站在我背後，挨著我的腳哭，眼淚溼了我的腳，就用自己的頭髮擦乾，又用嘴連連親我的腳，把香膏抹上。\n\n西門心中論斷：『這人若是先知，必知道摸他的是誰。』我知道他的意念，也知道這女人的心。我講了一個兩個債戶的比喻，問他哪一個更愛債主。西門回答是那多得恩免的。我告訴他：你看見這女人嗎？你沒有給我水洗腳，她卻用眼淚溼了我的腳。所以我告訴你，她許多的罪都赦免了，因為她的愛多。我轉向那女人說：『你的信救了你，平平安安地回去吧。』愛，是赦免的確據。", 
              characters: ["有罪的女人", "法利賽人西門"] },
            { id: 16, title: "平靜風浪", location: "加利利海", coords: [32.8200, 35.5400], chapter: "路加福音 8:22-25", 
              narrative: "有一天，我和門徒上了船，對他們說：『我們可以渡到湖那邊去。』行船的時候，我因疲憊睡著了。忽然湖上起了暴風，船將滿了水，甚是危險。門徒的信心在風浪中動搖了。\n\n他們驚慌地叫醒我：『夫子！夫子！我們喪命啦！』我醒了，站起來斥責那狂風大浪，風浪就止住，大大地平靜了。我轉身問他們：『你們的信心在哪裡呢？』他們既懼怕又希奇。他們需要明白，那位創造滄海的主，此刻就躺在他們的小船上。有我在，風浪能將我們如何呢？這經歷是為了訓練他們，因為將來他們要面對比這更大的屬靈風暴。", 
              characters: ["門徒群眾"] },
            { id: 17, title: "格拉森趕鬼", location: "格拉森", coords: [32.7800, 35.6500], chapter: "路加福音 8:26-39", 
              narrative: "船到了格拉森人的地方。剛上岸，一個被鬼附著的人從墳塋裡出來迎著我。他不穿衣服，不住房子，沒有人能捆住他，日夜喊叫，用石頭砍自己。見到我，他喊叫俯伏：『至高神的兒子耶穌，我與你有什麼相干？求你不要叫我受苦！』\n\n我問他叫什麼名字，他說：『群』，因為進去的鬼很多。鬼求我准牠們進入豬群。我准了牠們。那群豬闖下山崖，投在湖裡淹死了。放豬的逃跑了，城裡的人出來，看見那人坐在我腳前，穿著衣服，心裡明白，就害怕。他們求我離開。我上船時，那人懇求同在，但我差他回去：『你回家去，傳說神為你做了何等大的事。』一個人靈魂的價值，勝過兩千頭豬。", 
              characters: ["格拉森被鬼附者", "群鬼"] },
            { id: 18, title: "醫治血漏與睚魯女", location: "迦百農", coords: [32.8810, 35.5750], chapter: "路加福音 8:40-56", 
              narrative: "回來時，管會堂的睚魯俯伏在我腳前，求我去救他快死的獨生女兒。去的時候，眾人擁擠。有一個女人，患了十二年血漏，耗盡了一切，無人能醫。她從後頭摸我的衣裳繸子，血漏立刻止住了。\n\n我感到有能力出去，便問：『摸我的是誰？』她戰戰兢兢地出來俯伏。我對她說：『女兒，你的信救了你，平平安安地去吧！』這時有人來報信說睚魯的女兒死了。我對睚魯說：『不要怕，只要信！』到了他家，眾人都在哭泣。我拉著女孩的手呼叫說：『女兒，起來！』她的靈魂便回來，立刻起來了。我吩咐給她東西吃。信的人，必看見神的榮耀超越死亡。這兩個神蹟交織，顯明了信心是開啟恩典的鑰匙。", 
              characters: ["睚魯", "睚魯的女兒", "血漏婦人"] },
            { id: 19, title: "五餅二魚", location: "伯賽大", coords: [32.8930, 35.6130], chapter: "路加福音 9:10-17", 
              narrative: "使徒回來後，我們來到伯賽大的野地。群眾跟隨而來。我接待他們，講論神國的道，醫治有病的人。日頭快平西了，十二使徒請我叫眾人散開找吃的。但我挑戰他們：『你們給他們吃吧！』\n\n他們說只有五個餅、兩條魚。我叫眾人一排一排坐下。我拿著這點微薄的食物，望著天祝福，擘開，遞給門徒，門徒又遞給眾人。在傳遞的過程中，恩典倍增了。眾人都吃飽了，剩下的零碎還裝滿了十二籃。這是天國豐盛的筵席，在曠野中供應所需。這神蹟不僅是為了餵飽肚子，更是為了啟示我是生命的糧。", 
              characters: ["五千群眾", "十二使徒"] },
            { id: 20, title: "彼得認信", location: "該撒利亞腓立比", coords: [33.2450, 35.6900], chapter: "路加福音 9:18-22", 
              narrative: "我獨自禱告的時候，門徒也與我同在。我問他們：『眾人說我是誰？』回答各異。我又問：『你們說我是誰？』這個問題是信仰的核心。\n\n彼得回答說：『是神的基督。』這是聖靈的啟示。我切切囑咐他們不可將這事告訴人，並第一次明確預言：『人子必須受許多苦，被長老、祭司長和文士棄絕，並且被殺，第三日復活。』榮耀的基督，必須先行過受苦的道路。若有人要跟從我，就當捨己，天天背起他的十字架來跟從我。這條路不是舒適的，卻是通往生命的。", 
              characters: ["西門彼得", "十二使徒"] },
            { id: 21, title: "登山變像", location: "黑門山", coords: [33.3128, 35.7869], chapter: "路加福音 9:28-36", 
              narrative: "帶著彼得、雅各、約翰上山禱告。正禱告時，我的面貌改變了，衣服潔白放光。摩西和以利亞顯現，在榮光中同我談論我去世的事，就是我在耶路撒冷將要成的事（Exodus）。這表明律法和先知都指向我。\n\n門徒雖然打盹，卻看見了這榮光。彼得想要搭棚留住這時刻。這時有雲彩來遮蓋，有聲音從雲彩裡出來說：『這是我的兒子，我所揀選的，你們要聽他！』榮耀不是終點，而是為了堅固他們。下山後，我們必須面對這世界的黑暗與苦難，直到那榮耀完全顯現的日子。", 
              characters: ["摩西", "以利亞", "三門徒"] },
            { id: 22, title: "撒瑪利亞拒絕", location: "撒瑪利亞", coords: [32.2200, 35.2500], chapter: "路加福音 9:51-56", 
              narrative: "被接上升的日子將到，我定意向耶路撒冷去，這是我在地使命的終點。我打發人先去預備。到了撒瑪利亞的一個村莊，那裡的人因我面向耶路撒冷去，就不接待我。\n\n雅各、約翰看見了，心生憤怒，就說：『主啊，你要我們吩咐火從天上降下來燒滅他們，像以利亞所做的嗎？』我轉身責備兩個門徒說：『你們的心如何，你們並不知道。人子來不是要滅人的性命，是要救人的性命。』我們就往別的村莊去了。這趟旅程的第一課，就是寬恕與包容。恨不能化解恨，唯有愛能。", 
              characters: ["雅各", "約翰", "撒瑪利亞人"] },
            { id: 23, title: "差遣七十人", location: "往南方旅途", coords: [32.0000, 35.3000], chapter: "路加福音 10:1-20", 
              narrative: "莊稼多，工人少。我又設立七十個人，差遣他們兩個兩個在我前面，往我所要到的各城各地方去。我賜給他們權柄，但也告訴他們如羊進入狼群，要他們依賴神的供應，傳講『神的國臨近了』。\n\n那七十個人歡歡喜喜地回來，說：『主啊，因你的名，就是鬼也服了我們。』我對他們說：『我曾看見撒但從天上墜落，像閃電一樣...然而，不要因鬼服了你們就歡喜，要因你們的名記錄在天上歡喜。』最大的神蹟不是能力的彰顯，而是救恩的確據。我為他們的信心在聖靈裡歡樂，感謝父將這些事向嬰孩顯出來。", 
              characters: ["七十門徒"] },
            { id: 24, title: "好撒瑪利亞人", location: "耶利哥路", coords: [31.8415, 35.4057], chapter: "路加福音 10:25-37", 
              narrative: "一個律法師起來試探我：『我該做什麼才可以承受永生？』並問：『誰是我的鄰舍？』他想劃定愛的界線。我便講了一個故事：一個人落在強盜手中，半死不活。\n\n祭司看見他，從那邊過去了；利未人看見他，也照樣過去了。唯有一個被猶太人輕視的撒瑪利亞人，動了慈心，上前包裹傷處，扶他上牲口，帶到店裡照應，並付了銀子。我問律法師：『這三個人哪一個是落在強盜手中的鄰舍呢？』他說是憐憫他的。我說：『你去照樣行吧。』鄰舍不是由血緣或地緣定義的，而是由『憐憫』定義的。愛，就是付代價去行動。", 
              characters: ["律法師", "好撒瑪利亞人"] },
            { id: 25, title: "馬大馬利亞", location: "伯大尼", coords: [31.7720, 35.2570], chapter: "路加福音 10:38-42", 
              narrative: "進了一個村莊，馬大接我到她家。她有一個妹子名叫馬利亞，在我的腳前坐著聽道。馬大伺候的事多，心裡忙亂，就進前來說：『主啊，我的妹子留下我一個人伺候，你不在意嗎？請吩咐她來幫助我。』\n\n我看著焦慮的馬大，溫柔地說：『馬大！馬大！你為許多的事思慮煩擾，但是不可少的只有一件。馬利亞已經選擇那上好的福分，是不能奪去的。』忙碌的事奉雖好，但安靜的親近與聆聽，更是生命的核心。我渴望的不是僕人的勞碌，而是朋友的陪伴。", 
              characters: ["馬大", "馬利亞(伯大尼)"] },
            { id: 26, title: "浪子回頭", location: "比利亞", coords: [31.9000, 35.5500], chapter: "路加福音 15", 
              narrative: "眾稅吏和罪人都挨近我要聽道。法利賽人和文士私下議論說：『這個人接待罪人，又同他們吃飯。』於是我講了三個比喻：失羊、失錢、浪子，來表明天父對罪人的愛。\n\n最動人的是那個浪子。當他耗盡一切，醒悟過來，決定回家為奴時，相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。父親給他穿上袍子，戴上戒指，宰了肥牛犢。我告訴他們，這就是天父的心腸：『我們理當歡喜快樂，因為你這個兄弟是死而復活，失而又得的。』我來，就是要尋找這些迷失的兒子，帶他們回家。", 
              characters: ["慈父", "浪子", "大兒子", "法利賽人"] },
            { id: 27, title: "財主與拉撒路", location: "比利亞", coords: [31.9000, 35.5500], chapter: "路加福音 16:19-31", 
              narrative: "我講了一個財主和討飯的拉撒路的故事。財主生前穿著紫色袍和細麻布衣服，天天奢華宴樂；拉撒路渾身生瘡，被人放在財主門口，要得財主桌子上掉下來的零碎充飢。\n\n死後，情況逆轉。拉撒路在亞伯拉罕的懷裡得安慰，財主在陰間受痛苦。財主請求打發拉撒路去警告他的五個兄弟。亞伯拉罕說：『若不聽從摩西和先知的話，就是有一個從死裡復活的，他們也是不聽。』這不僅是關於貧富，更是關於心是否向神的話語敞開。神蹟不能改變剛硬的心，唯有聽從神的話語才能得救。", 
              characters: ["財主", "拉撒路", "亞伯拉罕"] },
            { id: 28, title: "十個痲瘋", location: "撒瑪利亞邊境", coords: [32.4000, 35.4500], chapter: "路加福音 17:11-19", 
              narrative: "往耶路撒冷去，經過撒瑪利亞和加利利的交界。進入一個村子，有十個長大痲瘋的，遠遠站著高聲喊：『耶穌，夫子，可憐我們吧！』\n\n我看見他們，就對他們說：『你們去把身體給祭司察看。』他們去的時候就潔淨了。內中有一個見自己已經好了，就回來大聲歸榮耀與神，又俯伏在我腳前感謝我；這人是撒瑪利亞人。我感嘆道：『潔淨了的不是十個人嗎？那九個在哪裡呢？』只有這個外族人回來歸榮耀與神。我對他說：『起來，走吧！你的信救了你。』感恩的心，使他的靈魂也得了拯救。肉體的潔淨是恩典，心靈的感恩是信心。", 
              characters: ["十個痲瘋病人", "感恩的撒瑪利亞人"] },
            { id: 29, title: "耶利哥瞎子", location: "耶利哥近郊", coords: [31.8600, 35.4600], chapter: "路加福音 18:35-43", 
              narrative: "將近耶利哥的時候，一個瞎子坐在路旁討飯。聽見許多人經過，他就問是什麼事。人告訴他，是拿撒勒人耶穌經過。他就呼叫說：『大衛的子孫耶穌，可憐我吧！』這呼喊是對彌賽亞身分的承認。\n\n在前頭走的人責備他，不許他作聲；他卻越發喊叫。我站住，吩咐把他領過來。我問他：『你要我為你做什麼？』他說：『主啊，我要能看見。』我看見他單純的信心，就說：『你可以看見！你的信救了你。』瞎子立刻看見了，就跟隨我，一路歸榮耀與神。眾人看見這事，也讚美神。這光，不僅照亮了他的眼，也照亮了他的路。", 
              characters: ["耶利哥瞎子"] },
            { id: 30, title: "撒該", location: "耶利哥城", coords: [31.8560, 35.4600], chapter: "路加福音 19:1-10", 
              narrative: "進了耶利哥，有一個人名叫撒該，作稅吏長，是個財主。他要看看我，因為人多，身量又矮，就跑到前頭，爬上桑樹。我看見了他那顆渴望的心，儘管被世俗包裹，卻依然跳動。\n\n我到了那裡，抬頭一看，對他說：『撒該，快下來！今天我必住在你家裡。』這句話震驚了眾人，也融化了撒該的心。他歡歡喜喜地接待我。面對眾人的議論，撒該站著對我說：『主啊，我把所有的一半給窮人；我若訛詐了誰，就還他四倍。』我宣告：『今天救恩到了這家...人子來，為要尋找、拯救失喪的人。』救恩，就是生命的翻轉。", 
              characters: ["撒該", "群眾"] },
            { id: 31, title: "榮耀進城", location: "橄欖山", coords: [31.7780, 35.2450], chapter: "路加福音 19:28-40", 
              narrative: "我騎著驢駒，從橄欖山下來。眾門徒因所見過的一切異能，都歡樂起來，大聲讚美神說：『奉主名來的王是應當稱頌的！在天上有和平，在至高之處有榮耀！』\n\n眾人把衣服鋪在路上。幾個法利賽人對我說：『夫子，責備你的門徒吧！』我告訴他們：『若是他們閉口不說，這些石頭必要呼叫起來。』這是神定的日子，君王柔和地進了祂的城。但我看見這城，就為它哭泣，因為它不知道眷顧它的時候。榮耀的背後，是即將來臨的審判與毀滅，我的心為耶路撒冷破碎。", 
              characters: ["門徒群眾", "法利賽人"] },
            { id: 32, title: "潔淨聖殿", location: "耶路撒冷聖殿", coords: [31.7781, 35.2360], chapter: "路加福音 19:45-46", 
              narrative: "進入聖殿，我看見這裡充滿了牛羊鴿子的叫聲和兌換銀錢的喧鬧。父的家本應是萬國禱告的殿，如今卻被貪婪充滿，成了強盜的巢穴。\n\n我心焦急，如同火燒。我趕出裡頭做買賣的人，推翻他們的桌子，教訓他們說：『經上寫著：「我的殿必作禱告的殿」，你們倒使它成為賊窩了！』祭司長和文士想要殺我，但百姓都側耳聽我。我要潔淨這殿，因為審判要從神的家起首。這不僅是對制度的挑戰，更是對敬拜本質的回歸。", 
              characters: ["聖殿商人", "祭司長"] },
            { id: 33, title: "寡婦奉獻", location: "耶路撒冷聖殿", coords: [31.7781, 35.2360], chapter: "路加福音 21:1-4", 
              narrative: "我在聖殿裡抬頭觀看，見財主把捐項投在庫裡，洋洋得意。又見一個窮寡婦投了兩個小錢，那是極微小的數目，甚至發不出響聲。\n\n但我指著她告訴門徒：『我實在告訴你們，這窮寡婦所投的比眾人還多；因為眾人都是自己有餘，拿出來投在捐項裡；但這寡婦是自己不足，把她一切養生的都投上了。』神看重的不是數量的多寡，而是那顆完全依靠、全然奉獻的心。她在物質上貧窮，在信心上卻是富足的。", 
              characters: ["窮寡婦"] },
            { id: 34, title: "最後晚餐", location: "耶路撒冷", coords: [31.7750, 35.2300], chapter: "路加福音 22:7-23", 
              narrative: "時候到了，我和十二使徒坐席。我對他們說：『我很願意在受害以先和你們吃這逾越節的筵席。』這是我與他們最後的晚餐，也是新約的開始。\n\n我拿起餅來，祝謝了，擘開，遞給他們，說：『這是我的身體，為你們捨的，你們也應當如此行，為的是記念我。』飯後也照樣拿起杯來，說：『這杯是用我血所立的新約，是為你們流出來的。』然而，那賣我之人的手與我一同在桌子上。雖然心中憂愁，但我必須走這條路，為了愛他們到底，立下這永恆的約。", 
              characters: ["十二使徒", "猶大"] },
            { id: 35, title: "客西馬尼", location: "橄欖山", coords: [31.7790, 35.2400], chapter: "路加福音 22:39-46", 
              narrative: "出來到了橄欖山。我離開門徒約有扔一塊石頭那麼遠，跪下禱告。面對即將到來的審判與與父的隔絕，我極其傷痛，汗珠如大血點滴在地上。這是一場靈魂的熬煉。\n\n我呼求：『父啊！你若願意，就把這杯撤去；然而，不要成就我的意思，只要成就你的意思。』有一位天使從天上顯現，加添我的力量。回到門徒那裡，見他們因憂愁都睡著了。這是一場孤獨的戰役，但我已準備好順服到底。黑暗掌權了，賣我的人近了。", 
              characters: ["天父", "天使", "三門徒"] },
            { id: 36, title: "彼得不認主", location: "大祭司宅院", coords: [31.7730, 35.2320], chapter: "路加福音 22:54-62", 
              narrative: "他們拿住我，帶到大祭司的宅裡。彼得遠遠地跟著。在院子中間的炭火旁，有人認出他，但他三次極力否認：『我不認得他！』恐懼戰勝了他的承諾。\n\n正說話的時候，雞就叫了。我轉過身看彼得。那一眼，沒有定罪，只有深深的愛與提醒。他想起了我對他說的話，就出去痛哭。撒但想要篩他像篩麥子，但我已為他祈求，叫他不至於失了信心。這眼淚，將成為他回頭後堅固弟兄的起點。我的受難，包含了被最親密戰友否認的痛苦。", 
              characters: ["西門彼得", "大祭司僕人"] },
            { id: 37, title: "受審與定罪", location: "彼拉多衙門", coords: [31.7800, 35.2340], chapter: "路加福音 23:1-25", 
              narrative: "天一亮，公會便審問我。接著將我解到彼拉多那裡。彼拉多查不出我有什麼罪，便將我送到希律那裡。希律早已想見我，指望看神蹟，我卻一言不答。那種沈默，是審判前的威嚴。\n\n又回到彼拉多面前。他三次宣告我無罪，想要釋放我。但祭司長和百姓喊著：『釘他十字架！』他們寧願釋放作亂殺人的巴拉巴。彼拉多為了討好群眾，屈服了。無罪的被判有罪，義者代替了不義者，這正是救贖的奧祕。我默默承受，因為這是父的旨意。", 
              characters: ["彼拉多", "希律安提帕", "巴拉巴"] },
            { id: 38, title: "受難", location: "各各他", coords: [31.7790, 35.2300], chapter: "路加福音 23:26-49", 
              narrative: "到了骷髏地，他們在那裡釘我十字架。在劇痛中，我卻禱告：『父啊！赦免他們，因為他們所做的，他們不曉得。』這是我對世界最後的溫柔。\n\n同釘的強盜一個譏誚我，另一個卻求我紀念。我應許他：『我實在告訴你，今日你要同我在樂園裡了。』那時約有午正，遍地都黑暗了，日頭變黑，殿裡的幔子從當中裂為兩半。我大聲喊著：『父啊！我將我的靈魂交在你手裡！』氣就斷了。百夫長看見，歸榮耀與神說：『這真是個義人！』成了，救贖的大功成了。", 
              characters: ["悔改的強盜", "百夫長", "古利奈人西門"] },
            { id: 39, title: "復活", location: "空墳墓", coords: [31.7840, 35.2300], chapter: "路加福音 24:1-12", 
              narrative: "七日的頭一日，黎明的時候，婦女們帶著香膏來到墳墓，發現石頭已經滾開了，進去卻不見我的身體。死亡不能拘禁生命的主。\n\n正在猜疑之間，有兩個人身穿畢挺衣服站在旁邊，對驚怕的婦女說：『為什麼在死人中找活人呢？他不在這裡，已經復活了！』她們回去把這一切事告訴十一使徒。彼得跑去墳墓，低頭往裡看，只見細麻布獨在一處，就回去了，心裡希奇所成的事。新的時代開始了，光明已戰勝黑暗。", 
              characters: ["抹大拉的馬利亞", "約亞拿", "婦女們", "天使"] },
            { id: 40, title: "以馬忤斯", location: "以馬忤斯路", coords: [31.8390, 34.9790], chapter: "路加福音 24:13-35", 
              narrative: "同一天，兩個門徒往以馬忤斯去，臉上帶著愁容，談論最近發生的事。我親近他們，與他們同行，只是他們的眼睛迷糊了，不認識我。我問他們在談論什麼，他們訴說了對『先知耶穌』的失望。\n\n我責備他們信得太遲鈍，於是從摩西和眾先知起，凡經上所指著自己的話，都給他們講解明白了。說明基督必須受害，然後進入榮耀。到了坐席的時候，我拿起餅來，祝謝了，擘開，遞給他們。他們的眼睛明亮了，這才認出是我。我便從他們面前消失了。他們彼此說：『在路上，他和我們說話，給我們講解聖經的時候，我們的心豈不是火熱的嗎？』", 
              characters: ["革流巴", "另一個門徒"] },
            { id: 41, title: "顯現給門徒", location: "耶路撒冷", coords: [31.7750, 35.2300], chapter: "路加福音 24:36-49", 
              narrative: "正當他們談論這事的時候，我親自站在他們當中，說：『願你們平安！』他們驚慌害怕，以為是看見魂。我必須讓他們知道，復活是真實的。\n\n我說：『你們看我的手，我的腳，就知道實在是我了。摸我看看！魂無骨無肉，你們看，我是有的。』為了證實，我還在他們面前吃了一片燒魚。我開啟他們的心竅，使他們能明白聖經，知道基督必受害，第三日從死裡復活，並且人要奉我的名傳悔改、赦罪的道，從耶路撒冷起直傳到萬邦。我是真實復活的主，並要賜下父所應許的能力。", 
              characters: ["十一使徒"] },
            { id: 42, title: "升天", location: "伯大尼", coords: [31.7720, 35.2600], chapter: "路加福音 24:50-53", 
              narrative: "我領他們出來，直到伯大尼的對面，舉手給他們祝福。正祝福的時候，我就離開他們，被帶到天上去了。這不是結束，而是榮耀的歸回。\n\n這不是永遠的離別，而是另一種同在的開始。他們就拜我，大大的歡喜，回耶路撒冷去，常在殿裡稱頌神。地上的事工已完成，天上的代求已開始。福音的火種已交在他們手中，將要燎原直到地極。人子的腳蹤，將藉著教會，繼續走遍全地。", 
              characters: ["十一使徒", "門徒群眾"] },
            { id: 43, title: "永恆的呼召", location: "你的心門", coords: [31.7720, 35.2600], chapter: "現在", 
              narrative: "親愛的朋友，你已經跟隨我走過了這段旅程。你看見了，這不僅僅是歷史，這是給你的一封情書。從伯利恆的馬槽到各各他的十字架，我走的每一步，都是為了尋找你。\n\n我嘗過孤單、被背叛、被羞辱的滋味，所以我能體恤你的軟弱。我戰勝了死亡，所以我能賜你新生命。這世界給不了你真正的平安，但我能。\n\n現在，這旅程的終點不是地圖上的一個點，而是你的心。看哪，我站在門外叩門。若你聽見我的聲音就開門，我要進到你那裡去，我與你，你與我一同坐席。你願意放下重擔，接受這份捨命的愛，並讓我作你生命的主嗎？\n\n不要懼怕，只要信。來跟從我，直到永恆。", 
              characters: ["你"] }
        ];

        const biographies = {
            "施洗約翰": { role: "先鋒", avatar: "🌊", desc: "我是那在曠野呼喊的人聲。我穿著駱駝毛，吃著蝗蟲野蜜，不是為了標新立異，而是為了在荒涼中單單仰望神。我看見了聖靈彷彿鴿子降在他身上，那一刻我知道，我所預備的道路，主角已經來到。我必衰微，他必興旺，這是我最大的喜樂。" },
            "施洗約翰(胎兒)": { role: "先鋒", avatar: "👶", desc: "雖然我還在母腹中，黑暗籠罩著我，但當那位懷著救主的女子聲音傳來，我的靈魂猛烈地震動。那不是驚恐，那是無法抑制的歡喜！即使未見天日，我已認出我的主。這是聖靈在我生命中最早的印記。" },
            "上帝(天父)": { role: "至高者", avatar: "☁️", desc: "這是我的愛子，我所喜悅的。從亙古到永遠，我愛他。我差他去，不是要定世人的罪，而是要叫世人因他得救。看著他走上十字架，我的心何等傷痛，但為了挽回你們，我選擇了沈默與犧牲。" },
            "魔鬼": { role: "試探者", avatar: "🐍", desc: "我曾在曠野給他機會，只要輕輕一拜，萬國榮華唾手可得。但他拒絕了。這不僅僅是拒絕了麵包，更是拒絕了我所定義的『成功』。他選擇了那條愚拙的苦路。但我不會放棄，我在客西馬尼，在猶大的心裡，繼續尋找機會。" },
            "聖靈": { role: "保惠師", avatar: "🕊️", desc: "我如鴿子降下，充滿他，膏抹他。在曠野，我引導他受試煉；在拿撒勒，我藉著他的口宣告禧年。我是那能力，那安慰，那不僅在他裡面，也要在他升天后，澆灌在每一個信他的人裡面。" },
            "拿撒勒鄉親": { role: "同鄉", avatar: "👥", desc: "我們看著他長大，修補我們的桌椅。約瑟的兒子，怎能說出這種僭妄的話？他說神眷顧外邦人勝過我們？這太冒犯了！我們原本期待他給家鄉帶來榮耀，而不是羞辱。推他下山崖？是的，那一刻憤怒淹沒了理智。" },
            "以賽亞(書卷)": { role: "先知書", avatar: "📜", desc: "幾百年前，先知在羊皮卷上寫下了關於受苦僕人的預言。當他在會堂展開我，讀出『主的靈在我身上』時，字句彷彿燃燒起來。我不再是古老的文字，我是活生生的見證，指向眼前這位彌賽亞。" },
            "西門彼得": { role: "使徒", avatar: "🪨", desc: "我本是個打魚的粗人，脾氣暴躁，沒什麼學問。那天，整夜勞碌一無所獲的挫敗感吞噬著我。但他叫我下網，那一網魚多得讓我恐懼。我說『離開我，我是罪人』，因為在他的聖潔面前，我不配站立。但他卻呼召我得人。我曾大言不慚說願為他死，卻在炭火旁三次不認他。那一刻他轉身看我的眼神...那不是定罪，是愛。那愛擊碎了我，也重建了我。" },
            "雅各": { role: "使徒", avatar: "⚡", desc: "他們叫我們『雷子』，因為我們性情剛烈。看見撒瑪利亞人不接待主，我就想叫火從天降下燒滅他們。主卻責備了我。跟隨他的路上，我慢慢明白，真正的權柄不是毀滅，而是捨己。那杯，我後來也喝了。" },
            "約翰": { role: "使徒", avatar: "❤️", desc: "我是主所愛的。在變像山上，我看見了他的榮光；在最後晚餐，我靠在他的胸膛。我比別人更敏銳地感受到他的心跳，那是對世人無盡的愛。當他在十字架上將母親託付給我時，我明白，愛就是責任，就是陪伴到底。" },
            "利未(馬太)": { role: "使徒/前稅吏", avatar: "💰", desc: "坐在稅關上，我看著人們眼中的鄙視。我有錢，但我沒有靈魂。直到他經過，看著我，不像看一條狗，而像看一個失散的朋友。『你跟從我來。』就這一句，我拋下了帳本，拋下了金錢。在他那裡，我第一次找到了尊嚴。" },
            "法利賽人": { role: "宗教領袖", avatar: "⚖️", desc: "我們嚴守律法，禁食，奉獻十分之一。這個人卻和罪人同席，在安息日治病！他打破了我們維護的秩序，挑戰了我們的權威。如果他是對的，那我們所堅持的一切豈不是錯了？不，為了律法的尊嚴，他必須被除掉。" },
            "百夫長": { role: "羅馬軍官", avatar: "🛡️", desc: "我統管百人，知道權柄意味著什麼。我說去，兵就去。這位耶穌，他擁有比凱撒更大的權柄。我不配他進我的舍下，只要他一句話，超越空間的限制，我的僕人就必好了。這種信心，連我自己都驚訝。" },
            "拿因寡婦": { role: "母親", avatar: "🕯️", desc: "丈夫死了，現在唯一的兒子也死了。送殯的路上，我覺得自己也死了。直到那個人按住棺材槓。他說『不要哭』。然後，我聽見死人坐起來說話的聲音。天哪，他把兒子交還給我，也把生命交還給了我。" },
            "少年人": { role: "復活者", avatar: "🛌", desc: "黑暗，無盡的黑暗。然後是一個聲音，充滿力量卻又溫柔：『少年人，起來！』我睜開眼，看見陽光，看見母親的淚水，看見那位賦予我新生命的拉比。" },
            "有罪的女人": { role: "蒙赦免者", avatar: "🏺", desc: "城裡人都知道我是做什麼的，他們繞道而行。但我聽說他在西門家，我顧不得羞恥。我帶著香膏，但我能獻上的只有眼淚。他的腳被我的淚水溼透。西門嫌棄我，但耶穌...他赦免了我。因為愛多，所以赦免多。那一刻，我重生了。" },
            "法利賽人西門": { role: "宴請者", avatar: "🤔", desc: "我請他吃飯是給他面子。這女人闖進來哭哭啼啼，成何體統？如果他是先知，怎會讓這種不潔的人摸他？但他竟然知道我在想什麼...那個關於債戶的比喻，像鞭子一樣抽打我的驕傲。原來，不懂愛的人，是我。" },
            "格拉森被鬼附者": { role: "獲釋者", avatar: "⛓️", desc: "群鬼像尖叫的風暴在我裡面撕扯。我用石頭砍自己，想結束這痛苦。但我看見了他。鬼懼怕他，求他。當豬群衝下山崖，我腦中突然安靜了。穿上衣服，坐在他腳前，那是久違的平安。我想跟他走，但他要我回家作見證。是的，我要告訴所有人，他為我做了何等大的事。" },
            "五千群眾": { role: "領受者", avatar: "🍞", desc: "我們跟著他來到曠野，聽得入神，忘了飢餓。日落時，肚子咕咕叫。原本以為要餓著肚子回家，沒想到，幾個餅、幾條魚，經過他的手，竟然源源不絕。我們吃飽了，還剩了十二籃。這不僅是食物，這是神在人間的筵席。" },
            "摩西": { role: "律法代表", avatar: "⛰️", desc: "我在西奈山領受律法，如今我在黑門山見證恩典。我曾帶領百姓出埃及，如今我與他談論他即將在耶路撒冷完成的『出埃及』——將百姓從罪惡的奴役中領出來。" },
            "以利亞": { role: "先知代表", avatar: "🔥", desc: "我曾乘旋風升天，今日站在榮光中。他是我們所有先知預言的焦點。看著他，我知道我的任務完成了，他才是那要來的真先知。" },
            "撒瑪利亞人": { role: "外族人", avatar: "🏘️", desc: "我們和猶太人老死不相往來。他面向耶路撒冷，我們當然不接待。但他沒有像那個雷子約翰一樣咒詛我們。後來聽說，他講了好撒瑪利亞人的故事，甚至在十個痲瘋病人中稱讚了我們的一個同胞。這人...不一樣。" },
            "律法師": { role: "提問者", avatar: "❓", desc: "我想試探他，顯出我的博學。『誰是我的鄰舍？』我想畫個圈子，圈出我該愛的人。但他用那個撒瑪利亞人的故事，打破了我的圈子。鄰舍不是名詞，是動詞。我羞愧，但也震撼。" },
            "好撒瑪利亞人": { role: "比喻人物", avatar: "🫒", desc: "我看見那人躺在血泊中，我沒想他是猶太人還是什麼人。我看見的是痛苦。祭司走了，利未人走了，但我不能走。我的油、酒、牲口、銀子，這時候不用，更待何時？愛，就是付代價。" },
            "馬大": { role: "伯大尼姐妹", avatar: "🍽️", desc: "家裡來了這麼重要的客人，我忙得團團轉！馬利亞竟然只會坐著聽！我氣不過，抱怨了。主卻溫柔地叫我的名字：『馬大，馬大。』他說我為許多事思慮煩擾。是的，我忙於事奉主，卻忘了享受主。" },
            "馬利亞(伯大尼)": { role: "伯大尼姐妹", avatar: "👂", desc: "姊姊在忙，我知道。但我看著他的眼睛，聽他的話語，我就動不了了。這機會稍縱即逝。我知道什麼是不可少的。世界可以等，廚房可以等，但這上好的福分，我不能錯過。" },
            "慈父": { role: "比喻人物", avatar: "🫂", desc: "每天，我都在村口張望。那個逆子拿走了家產，傷透了我的心。但我不在乎錢，我只在乎他。那天我看見他衣衫襤褸地回來，我顧不得尊嚴，跑過去抱住他。他想做僕人？不，他是我的兒子！死而復活，失而又得，怎能不快樂？" },
            "浪子": { role: "比喻人物", avatar: "🐖", desc: "在豬圈裡搶豆莢吃的時候，我醒了。我得罪了天，也得罪了父。我以為回家只能做奴僕，沒想到迎接我的是擁抱、袍子和戒指。這份愛，我一輩子也還不清，也不用還，只需領受。" },
            "十個痲瘋病人": { role: "獲醫治者", avatar: "🤕", desc: "我們十個同病相憐，遠遠喊叫。他說去給祭司看，半路上我們就好了！太興奮了，我們急著回去過正常生活。只有那個撒瑪利亞人回去道謝。我們...我們是不是錯過了比醫治更重要的東西？" },
            "耶利哥瞎子": { role: "看見者", avatar: "👁️", desc: "黑暗是我的一切。聽說他來了，我拼命喊。旁邊人叫我閉嘴，但我知道這是我唯一的機會。他問我要什麼。『我要能看見！』當光線第一次刺入眼簾，我看見的第一個影像，就是他的臉。我怎能不跟隨他？" },
            "撒該": { role: "稅吏長", avatar: "🌳", desc: "我有錢，但我孤獨像條狗。爬上桑樹只是好奇。沒想到，他在樹下停住，叫我的名字！『撒該，快下來！』他要住我家？眾人罵我，但他接納我。那一刻，錢不重要了。我願意賠償，願意施捨。因為我找到了真正的寶藏。" },
            "聖殿商人": { role: "被趕者", avatar: "🕊️", desc: "生意正紅火，突然桌子翻了，錢灑了一地。那人用鞭子趕我們，眼睛裡噴著火：『賊窩！』我們憤怒，但也恐懼。因為在那一刻，我們知道他說的是對的。我們把敬虔變成了買賣。" },
            "猶大": { role: "賣主者", avatar: "💋", desc: "我是管錢囊的。我跟隨他，是為了榮耀的國度。但他只談受死，不談起義。那瓶香膏值三十兩銀子，就這麼浪費了！失望轉為苦毒，撒但進了我的心。三十塊銀幣，親嘴的暗號...我以為我可以逼他出手，但我錯了。我賣了無辜之人的血。" },
            "彼拉多": { role: "巡撫", avatar: "🏛️", desc: "他是個無辜的人，我看得出來。但我更怕暴動，更怕凱撒。群眾喊著『釘他十字架』，那聲音像海嘯。我洗了手，想洗脫罪名，但良心的污點，洗得掉嗎？" },
            "希律安提帕": { role: "分封王", avatar: "👑", desc: "聽說他很久了，我想看他變個戲法。但他站在那裡，一言不發。那種沈默，比任何言語更像審判。我覺得無趣，把他羞辱一番送回去了。" },
            "古利奈人西門": { role: "路人", avatar: "🪵", desc: "我只是路過，就被羅馬兵抓差。背那個犯人的十字架？真倒霉！血染在我的衣服上。但當我走在他旁邊，聽見他的喘息，看見他的眼神...這段路，改變了我，也改變了我的兒子亞歷山大和魯孚。" },
            "悔改的強盜": { role: "蒙恩者", avatar: "✝️", desc: "我這一生充滿罪惡，死刑是罪有應得。但他不一樣。在劇痛中，我聽見他求父赦免仇敵。我信了。我求他得國降臨時紀念我。他說：『今日你要同我在樂園裡了。』這是死囚聽過最美的特赦。" },
            "抹大拉的馬利亞": { role: "見證人", avatar: "🌅", desc: "曾有七個鬼在我身上，是他救了我。天還沒亮，我帶著香膏去墳墓，心碎欲絕。石頭滾開了！天使說他活了！我跑去告訴彼得。雖然他們起初不信，但我知道我看見了什麼。我的主，戰勝了死亡！" },
            "革流巴": { role: "門徒", avatar: "🥖", desc: "以馬忤斯的路上，我們心灰意冷。那陌生人給我們講解聖經，心裡暖暖的。晚飯時，他擘餅的動作...那是他！絕對是他！他消失了，但我們的絕望也消失了。回耶路撒冷去！告訴大家，主真的復活了！" },
            "馬利亞(母親)": { role: "聖母", avatar: "🤱", desc: "從馬槽的嬰啼，到十字架下的血淚。西面說得對，我的心被刀刺透。看著他受苦，比我自己受苦更痛。但我記得加百列的話，記得他父家之事。他是我的兒子，也是我的主。我默然順服，尊主為大。" },
            "約瑟": { role: "養父", avatar: "🔨", desc: "我本想暗暗休了她，但天使在夢中說話。我便娶過來，給他起名叫耶穌。教他拿鋸子、推刨子。我知道他不是普通的孩子，我的任務是守護他成長，直到天父的時間來到。我是個沈默的義人，這就夠了。" },
            "牧羊人": { role: "朝聖者", avatar: "🐑", desc: "夜裡的榮光，天使的歌聲！我們嚇壞了，也樂壞了。跑去伯利恆，真看見了那嬰孩包著布，臥在馬槽裡。就像天使說的一樣！我們回去的時候，一路歸榮耀與神。我們是卑微人，卻成了第一批見證人。" },
            "天使": { role: "報信者", avatar: "✨", desc: "在亙古中我們敬拜他。如今看見君王降卑為人，我們怎能不歌頌？『在至高之處榮耀歸與神！』我們在曠野服事他，在墳墓前宣告復活。這是宇宙最偉大的奧祕。" },
            "西面": { role: "義人", avatar: "👴", desc: "聖靈告訴我，不死以前必看見基督。那天在殿裡，我看見了那嬰孩。雖然只是個貧窮家庭的孩子，但我靈眼已開。這就是救恩！這就是外邦人的光！我可以安然去世了，因為盼望已成真。" },
            "亞拿": { role: "女先知", avatar: "👵", desc: "我在殿裡禁食祈求八十四年。那天，我也看見了他。我不停地稱謝神，對所有盼望救贖的人說：『看哪，就是他！』" },
            "十二使徒": { role: "跟隨者", avatar: "👣", desc: "我們是漁夫、稅吏、激進份子。一盤散沙，常爭誰為大。但我們跟過他，看過神蹟，聽過寶訓。雖然在他受難時我們逃跑了，但他復活後尋回了我們。我們是見證人，我們要將這福音傳到地極。" },
            "彼得岳母": { role: "獲醫治者", avatar: "🛌", desc: "高燒讓我昏迷，覺得快死了。他來了，斥責熱病。感覺像清涼的水流過全身。我立刻起來，有力氣了！我要做飯，我要服事他，這是我唯一能做的報答。" },
            "污鬼": { role: "邪靈", avatar: "👻", desc: "我們知道他是誰！神的聖者！他的光讓我們痛苦。我們試圖抵抗，但在他的權柄下，我們只能戰兢。不要叫我們下無底坑！" },
            "大兒子": { role: "比喻人物", avatar: "😤", desc: "我服事父親多年，沒違背過命令。這小子敗光家產回來，父親竟然殺牛犢？公平嗎？我生氣，我不進去。我不明白，父親要的不是僱工，是兒子。" },
            "感恩的撒瑪利亞人": { role: "獲醫治者", avatar: "🙏", desc: "祭司可能不看我，但耶穌醫治了我。我不能就這麼走了。我要回去，大聲歸榮耀與神，我要伏在他腳前。我是外族人，但我知道誰是恩主。" },
            "祭司長": { role: "反對者", avatar: "🕍", desc: "這人妖言惑眾，動搖我們的根基。百姓都聽他的，聖殿還有規矩嗎？羅馬人來了怎麼辦？一個人替百姓死，免得通國滅亡，這才合算。他必須死。" },
            "大祭司僕人": { role: "受傷者", avatar: "👂", desc: "那是混亂的一夜。彼得拔刀，我的耳朵掉了，血流如注。痛！但耶穌...他被綁著，卻伸出手摸我。耳朵好了？這人...到底是誰？" },
            "十一使徒": { role: "見證人", avatar: "🙌", desc: "橄欖山上，他被接上升。雲彩接住了他。天使說他還要再來。我們不再憂愁，而是大大的歡喜。回耶路撒冷去！等候聖靈，開始那偉大的見證！" },
            "門徒群眾": { role: "跟隨者", avatar: "👥", desc: "我們從加利利一路跟隨。看見他醫病，聽見他講道。有時糊塗，有時明白。但現在我們確信，他是基督，是永生神的兒子。" },
            "天使加百列": { role: "傳信天使", avatar: "📨", desc: "我站在神面前。奉差遣傳達這宇宙最重要的信息。馬利亞的順服令天庭震動。『聖靈要臨到你身上』，這話語啟動了救贖的計畫。" },
            "以利沙伯": { role: "親屬", avatar: "🤰", desc: "我年老不生育，神卻除去我的羞恥。馬利亞一進門，聖靈就充滿我。我怎配得主的母到我這裡來？這不是普通的問安，這是新時代的黎明。" },
            "聖殿教師": { role: "拉比", avatar: "📖", desc: "我們鑽研律法一輩子。這個十二歲的少年，他的問題直指核心，他的回答充滿智慧。他不是在背誦，他像是在談論家常事。這智慧從何而來？" },
            "抬癱子的人": { role: "信心者", avatar: "🏗️", desc: "人太多了，擠不進去。但我們不能放棄，朋友需要醫治。上房頂！拆瓦片！只要能把他送到耶穌面前，這點代價算什麼？看，耶穌在笑，他看見我們的信心了。" },
            "癱子": { role: "蒙赦罪者", avatar: "🛏️", desc: "我以為我需要的是腿好起來。但他先說『你的罪赦了』。心裡的重擔先卸下了，然後才是腿。拿著褥子走回家的路上，我覺得自己是個全新的人。" },
            "血漏婦人": { role: "信心者", avatar: "🩸", desc: "十二年了，醫生只能拿走錢，不能拿走病。我是不潔的，不能碰人。但我告訴自己，只要摸他的衣裳繸子...就在那一剎那，枯乾的泉源湧出了生命。他不讓我就這樣溜走，他要我抬起頭來，做他的女兒。" },
            "睚魯": { role: "父親", avatar: "👨‍👧", desc: "我是管會堂的，但我不在乎面子了，我女兒快死了。路上耽延了，報信的說『死了』。絕望淹沒了我。但他轉過頭，那眼神堅定如山：『不要怕，只要信。』在那間屋子裡，我看見了復活。" },
            "睚魯的女兒": { role: "復活者", avatar: "👧", desc: "我記得好像睡著了，很深很深的夢。然後有人拉我的手，叫我起來。我餓了，爸爸媽媽在哭又在笑。那個拉我的叔叔，他的手好溫暖。" },
            "七十門徒": { role: "受差者", avatar: "🎒", desc: "我們奉他的名出去，連鬼都服了！太興奮了！但他提醒我們，名字記在天上比趕鬼更重要。是的，權柄是為了服事，不是為了炫耀。" },
            "財主": { role: "比喻人物", avatar: "🍷", desc: "活著時我有紫色袍，有美食。拉撒路？那是門口的風景。死後，火燄太熱了！我看見他在亞伯拉罕懷裡。一滴水，我只求一滴水！太晚了，鴻溝已定。悔改要在活著的時候啊！" },
            "拉撒路": { role: "比喻人物", avatar: "🐕", desc: "生前只有狗舔我的瘡。但我心裡仰望神。現在，我在祖宗懷裡得安慰。痛苦過去了，永恆的福樂開始了。神的公義，終必顯明。" },
            "亞伯拉罕": { role: "信心之父", avatar: "🌟", desc: "孩子，生前享福的，死後受苦。不聽神的話，就算死人復活去警告，他們也會找理由不信。信心來自聽道，不是看神蹟。" },
            "窮寡婦": { role: "奉獻者", avatar: "🪙", desc: "這兩個小錢是我今天的晚餐，也是明天的早餐。但我愛神，我想把我也許是最後的所有都給祂。沒人注意我，除了那一位。他懂。他知道這不是錢，這是命。" },
            "天父": { role: "禱告對象", avatar: "🌌", desc: "我在天上，看著我的兒子在客西馬尼汗如血點。我多想撤去那杯，但我愛世人。為了救贖，我必須掩面不看他。這是三一神最深的痛苦，也是最深的愛。" },
            "三門徒": { role: "沈睡者", avatar: "💤", desc: "他說要警醒。我們想，真的想。但眼皮好重。憂愁讓我們疲憊。醒來時看見火把和刀棒，我們羞愧難當。我們真的不配，但他沒有放棄我們。" },
            "巴拉巴": { role: "強盜", avatar: "⛓️", desc: "我以為今天死定了。十字架都備好了。突然，獄卒開門說我自由了。為什麼？因為那個拿撒勒人替我死？一個無辜的人替換了一個殺人犯。這算什麼道理？這...就是恩典嗎？" },
            "約亞拿": { role: "見證人", avatar: "🏺", desc: "我是希律家宰的妻子，但我跟隨耶穌。那天清晨，我們帶著香膏，心裡比石頭還重。但石頭滾開了！空墳墓！天使的話讓我們想起他的預言。他真的活了！" },
            "另一個門徒": { role: "同行者", avatar: "🚶", desc: "我們在路上爭論，絕望。那個陌生人解開聖經時，心裡那種火熱的感覺...太熟悉了。原來他一直與我們同行。復活不是傳說，是我們親眼所見的事實！" },
            "你": { role: "被愛者", avatar: "🫵", desc: "親愛的讀者，這一切故事，最終都是為了讓你遇見祂。你願意回應這份愛嗎？\n\n如果你願意，請打開心門，用這禱告回應祂：『親愛的主耶穌，我承認自己需要祢。我相信祢為尋找拯救失喪的人而來，為我的罪死而復活。現在我願意敞開心，接受祢作我的救主與生命的主。求祢赦免我、帶領我，讓我一生跟隨祢。奉主耶穌的名，阿們。』" }
        };

        // --- Logic ---
        let currentIndex = 0;
        let map;
        let markers = [];
        let polyline;

        function init() {
            // Delay initialization slightly to ensure DOM layout is computed
            setTimeout(() => {
                initMap();
                loadEvent(currentIndex, true); // true indicates initial load
            }, 300);
        }

        function initMap() {
            // Initialize Leaflet Map
            map = L.map('map', {
                zoomControl: true,
                attributionControl: false // Cleaner look
            }).setView([32.5, 35.5], 8);

            // Ensure map knows its container size
            map.invalidateSize();

            // Google Maps Terrain (Chinese)
            L.tileLayer('https://mt{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}&hl=zh-TW', {
                subdomains: ['0', '1', '2', '3'],
                maxZoom: 20,
                attribution: '© Google Maps'
            }).addTo(map);

            // Create Markers but DO NOT add them to map yet
            events.forEach((evt, idx) => {
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class='marker-container' id='marker-${idx}'>
                             <div class='marker-pin'>
                                <span class='marker-number'>${idx + 1}</span>
                             </div>
                             <div class='marker-label'>${evt.location.split(' ')[0]}</div>
                           </div>`,
                    iconSize: [34, 46], // Updated size
                    iconAnchor: [17, 46]
                });

                const marker = L.marker(evt.coords, {icon: customIcon});
                
                // Click to jump
                marker.on('click', () => {
                    jumpToEvent(idx);
                });

                markers.push(marker);
            });

            // Init Polyline with empty path
            polyline = L.polyline([], {
                color: '#8b5a2b',
                weight: 3,
                opacity: 0.6,
                dashArray: '10, 10'
            }).addTo(map);
        }

        function updateMapVisuals(index, isInitial = false) {
            // Ensure map size is valid before operations
            map.invalidateSize();

            // Manage Markers Visibility and State
            markers.forEach((m, i) => {
                if (i <= index) {
                    // Show marker if it's not already on map
                    if (!map.hasLayer(m)) {
                        m.addTo(map);
                    }
                    
                    // Update active state (Need to check if element exists, as it might be newly created)
                    const el = document.getElementById(`marker-${i}`);
                    if (el) {
                        if (i === index) {
                            el.parentElement.classList.add('marker-active-parent');
                            el.classList.add('marker-active');
                        } else {
                            el.parentElement.classList.remove('marker-active-parent');
                            el.classList.remove('marker-active');
                        }
                    }
                } else {
                    // Hide future markers
                    if (map.hasLayer(m)) {
                        map.removeLayer(m);
                    }
                }
            });

            // Update Polyline Path to show only up to current event
            if (polyline) {
                const visiblePath = events.slice(0, index + 1).map(e => e.coords);
                polyline.setLatLngs(visiblePath);
            }

            // Pan to location
            const evt = events[index];
            if (evt && evt.coords) {
                if (isInitial) {
                    // Use setView for the first load to prevent flyTo animation errors on un-rendered maps
                    map.setView(evt.coords, 10);
                } else {
                    map.flyTo(evt.coords, 10, {
                        animate: true,
                        duration: 1.5
                    });
                }
            }
        }

        function loadEvent(index, isInitial = false) {
            const evt = events[index];
            const contentDiv = document.getElementById('event-content');
            const progressDisplay = document.getElementById('progress-display');
            
            // Update Progress
            progressDisplay.innerText = `${index + 1} / ${events.length}`;

            // Update Map
            if (map) {
                updateMapVisuals(index, isInitial);
            }

            // Build HTML
            const charBadges = evt.characters.map(char => {
                const bioData = biographies[char] || { avatar: '?', role: '人物' };
                return `<button onclick="showBio('${char}')" class="flex items-center gap-2 bg-[#e6dcc3] hover:bg-[#dcd0b3] px-3 py-2 rounded-full border border-[#c9b79c] transition shadow-sm">
                    <span class="text-xl">${bioData.avatar}</span>
                    <span class="font-bold text-yellow-900 text-sm">${char}</span>
                </button>`;
            }).join('');

            contentDiv.innerHTML = `
                <div class="scroll-paper p-8 rounded-lg mb-6 transform transition-all">
                    <div class="flex justify-between items-start border-b border-stone-300 pb-4 mb-4">
                        <div>
                            <h2 class="text-3xl font-bold text-yellow-900 mb-1">${evt.title}</h2>
                            <div class="flex items-center text-stone-500 text-sm gap-2">
                                <span class="font-bold">📍 ${evt.location}</span>
                                <span>|</span>
                                <span class="italic font-serif">${evt.chapter}</span>
                            </div>
                        </div>
                        <div class="text-5xl opacity-10 font-serif text-yellow-900 absolute top-4 right-8 select-none">
                            ${index + 1}
                        </div>
                    </div>

                    <div class="prose prose-lg prose-stone max-w-none font-serif leading-loose text-justify text-stone-800">
                        ${evt.narrative.replace(/\n/g, '<br/>')}
                    </div>
                </div>

                <div class="mt-6">
                    <h3 class="text-sm font-bold text-stone-500 uppercase tracking-widest mb-3">關鍵人物 (點擊查看)</h3>
                    <div class="flex flex-wrap gap-3">
                        ${charBadges}
                    </div>
                </div>
            `;

            // Button states
            document.getElementById('btn-prev').disabled = index === 0;
            const nextBtn = document.getElementById('btn-next');
            if (index === events.length - 1) {
                nextBtn.innerHTML = `重新開始 <span>&#8635;</span>`;
                nextBtn.onclick = () => jumpToEvent(0);
            } else {
                nextBtn.innerHTML = `下個事件 <span>&#8594;</span>`;
                nextBtn.onclick = nextEvent;
            }
        }

        function nextEvent() {
            if (currentIndex < events.length - 1) {
                currentIndex++;
                loadEvent(currentIndex);
            }
        }

        function prevEvent() {
            if (currentIndex > 0) {
                currentIndex--;
                loadEvent(currentIndex);
            }
        }

        function jumpToEvent(index) {
            currentIndex = index;
            loadEvent(currentIndex);
        }

        function showBio(name) {
            const bio = biographies[name];
            if (!bio) return;

            document.getElementById('bio-avatar').innerText = bio.avatar;
            document.getElementById('bio-name').innerText = name;
            document.getElementById('bio-role').innerText = bio.role;
            document.getElementById('bio-desc').innerText = bio.desc;

            const modal = document.getElementById('bio-modal');
            const wrapper = document.getElementById('bio-content-wrapper');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                wrapper.classList.remove('scale-95', 'opacity-0');
                wrapper.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeBio() {
            const wrapper = document.getElementById('bio-content-wrapper');
            wrapper.classList.remove('scale-100', 'opacity-100');
            wrapper.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                document.getElementById('bio-modal').classList.add('hidden');
            }, 200);
        }

        function startJourney() {
            const modal = document.getElementById('intro-modal');
            const content = modal.firstElementChild;
            content.classList.remove('scale-100');
            content.classList.add('scale-95', 'opacity-0');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 500);
        }

        document.getElementById('bio-modal').addEventListener('click', function(e) {
            if (e.target === this) closeBio();
        });

        // Initialize when DOM is ready
        window.onload = init;

    </script>
</body>
