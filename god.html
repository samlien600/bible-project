    <script>
        let godData = [], jesusData = [], spiritData = [];
        let currentTab = 'god';
        let currentData = [];
        
        // Updated logic: Only specific Holy Names are "Proper Names"
        const properNames = {
            god: ['yahweh'],
            jesus: ['jesus'],
            spirit: ['ruach-hakodesh']
        };

        // --- Init ---
        async function loadData() {
            if (typeof window.godData !== 'undefined') {
                godData = window.godData;
                jesusData = window.jesusData;
                spiritData = window.spiritData;
                if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
                switchTab('god');
            } else {
                setTimeout(loadData, 100);
            }
        }
        document.addEventListener('DOMContentLoaded', loadData);

        // --- Theme ---
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="desk-tab-"]').forEach(btn => {
                const isActive = btn.id === `desk-tab-${tab}`;
                btn.className = isActive 
                    ? 'bg-slate-900 text-white px-6 py-2 rounded-full text-sm font-bold shadow-md transition-all flex items-center gap-2 transform scale-105' 
                    : 'px-6 py-2 rounded-full text-sm font-bold text-slate-500 hover:text-slate-900 transition-all flex items-center gap-2 hover:bg-slate-200/50';
            });
            document.querySelectorAll('[id^="mob-tab-"]').forEach(btn => {
                const isActive = btn.id === `mob-tab-${tab}`;
                btn.className = isActive
                    ? 'flex-none snap-center px-5 py-2 rounded-full text-sm font-bold border border-slate-900 bg-slate-900 text-white whitespace-nowrap transition-all shadow-md'
                    : 'flex-none snap-center px-5 py-2 rounded-full text-sm font-bold border border-slate-200 bg-white text-slate-600 whitespace-nowrap transition-all';
            });

            if (tab === 'god') {
                currentData = godData;
                document.getElementById('listTitle').innerHTML = `<span class="w-2 h-8 bg-gold-500 rounded-full inline-block"></span> 父神尊貴稱號`;
            } else if (tab === 'jesus') {
                currentData = jesusData;
                document.getElementById('listTitle').innerHTML = `<span class="w-2 h-8 bg-red-500 rounded-full inline-block"></span> 耶穌尊貴稱號`;
            } else {
                currentData = spiritData;
                document.getElementById('listTitle').innerHTML = `<span class="w-2 h-8 bg-sky-500 rounded-full inline-block"></span> 聖靈尊貴稱號`;
            }
            
            document.getElementById('deskSearchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            applyFilter();
        }

        function syncSearch(val) {
            document.getElementById('deskSearchInput').value = val;
            document.getElementById('mobileSearchInput').value = val;
            applyFilter(val);
        }
        document.getElementById('deskSearchInput').addEventListener('input', (e) => syncSearch(e.target.value));
        document.getElementById('mobileSearchInput').addEventListener('input', (e) => syncSearch(e.target.value));
        function resetSearch() { syncSearch(''); }

        function applyFilter(term = '') {
            const search = term.toLowerCase();
            let primaryId = currentTab === 'god' ? 'yahweh' : (currentTab === 'jesus' ? 'jesus' : 'ruach-hakodesh');

            const primaryItem = currentData.find(i => i.id === primaryId);
            const showPrimary = primaryItem && (!search || primaryItem.name.toLowerCase().includes(search) || primaryItem.meaning.toLowerCase().includes(search));

            const primarySection = document.getElementById('primarySection');
            const primaryCardContainer = document.getElementById('primaryCardContainer');

            if (primaryCardContainer) {
                if (showPrimary) {
                    primarySection.classList.remove('hidden');
                    setTimeout(() => {
                        primarySection.classList.remove('opacity-0', 'translate-y-4');
                        primarySection.classList.add('opacity-100', 'translate-y-0');
                    }, 50);
                    primaryCardContainer.innerHTML = createPrimaryCard(primaryItem);
                } else {
                    primarySection.classList.add('hidden', 'opacity-0', 'translate-y-4');
                    primarySection.classList.remove('opacity-100', 'translate-y-0');
                }
            }

            const gridData = currentData.filter(i => i.id !== primaryId);
            const filtered = gridData.filter(i => {
                return !search || 
                       i.name.toLowerCase().includes(search) || 
                       i.meaning.toLowerCase().includes(search) ||
                       i.verseText.toLowerCase().includes(search);
            });

            document.getElementById('namesGrid').innerHTML = filtered.map(item => createGridCard(item)).join('');
            
            const total = filtered.length + (showPrimary ? 1 : 0);
            document.getElementById('countDisplay').innerText = `${total} 項目`;
            const noResults = document.getElementById('noResults');
            if(total === 0) {
                noResults.classList.remove('hidden');
                document.getElementById('namesGrid').classList.add('hidden');
            } else {
                noResults.classList.add('hidden');
                document.getElementById('namesGrid').classList.remove('hidden');
            }
        }

        function getThemeColors() {
            if (currentTab === 'jesus') return { 
                text: 'text-red-600 dark:text-red-400', 
                bg: 'bg-red-50 dark:bg-red-900/20', 
                gradient: 'from-red-50 to-white dark:from-red-950 dark:to-midnight-950',
                accent: 'bg-red-500',
                border: 'border-red-400'
            };
            if (currentTab === 'spirit') return { 
                text: 'text-sky-600 dark:text-sky-400', 
                bg: 'bg-sky-50 dark:bg-sky-900/20', 
                gradient: 'from-sky-50 to-white dark:from-sky-950 dark:to-midnight-950',
                accent: 'bg-sky-500',
                border: 'border-sky-400'
            };
            return { 
                text: 'text-gold-600 dark:text-gold-400', 
                bg: 'bg-amber-50 dark:bg-amber-900/20', 
                gradient: 'from-orange-50 to-white dark:from-slate-900 dark:to-midnight-950',
                accent: 'bg-gold-500',
                border: 'border-gold-400'
            };
        }

        function createPrimaryCard(item) {
            const theme = getThemeColors();
            const fontClass = (/[א-ת]/.test(item.original)) ? 'hebrew-text' : 'greek-text';
            const cleanDesc = item.description.replace(/<[^>]*>?/gm, '');
            const safeId = item.id.replace(/'/g, "\\'");

            return `
                <div onclick="openModalById('${safeId}')" class="relative overflow-hidden rounded-2xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-soft cursor-pointer group">
                    <div class="absolute inset-0 bg-gradient-to-br ${theme.gradient} opacity-50"></div>
                    <div class="absolute -right-6 -bottom-10 text-[10rem] opacity-5 dark:opacity-[0.02] group-hover:opacity-10 transition-opacity duration-500 text-slate-900 dark:text-white rotate-12 font-serif pointer-events-none">
                        ${item.original.charAt(0)}
                    </div>
                    <div class="relative p-8 md:p-10 flex flex-col md:flex-row gap-8 items-start">
                        <div class="md:w-2/5 border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-700 pb-6 md:pb-0 md:pr-8">
                            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase bg-slate-900 text-white dark:bg-white dark:text-slate-900 mb-4 shadow-lg">聖名</span>
                            <h2 class="text-4xl md:text-5xl font-serif font-bold text-slate-900 dark:text-white mb-3 transition-colors">${item.name.split(' ')[0]}</h2>
                            <p class="${fontClass} text-3xl ${theme.text} font-serif mb-4">${item.original}</p>
                            <div class="h-1 w-12 ${theme.accent} rounded-full"></div>
                        </div>
                        <div class="md:w-3/5 flex flex-col justify-between h-full">
                            <div>
                                <h3 class="text-xl font-bold text-slate-700 dark:text-slate-200 mb-3">${item.meaning}</h3>
                                <p class="text-slate-500 dark:text-slate-400 text-sm md:text-base leading-relaxed line-clamp-3 mb-6">${cleanDesc}</p>
                            </div>
                            <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wide text-slate-400 dark:text-slate-500 group-hover:text-slate-800 dark:group-hover:text-white transition-colors mt-auto">
                                閱讀完整內容 <i class="fas fa-arrow-right ml-1"></i>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function createGridCard(item) {
            const theme = getThemeColors();
            const fontClass = (/[א-ת]/.test(item.original)) ? 'hebrew-text' : 'greek-text';
            const cleanDesc = item.description.replace(/<[^>]*>?/gm, '');
            // Badge Logic: If in properNames array -> 聖名 (Darker badge), Else -> 稱號 (Light badge)
            const isProperName = properNames[currentTab].includes(item.id);
            const badgeHTML = isProperName 
                ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-white dark:bg-white dark:text-slate-900 tracking-wider ml-2">聖名</span>`
                : `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-400 dark:bg-slate-800 dark:text-slate-500 tracking-wider ml-2">稱號</span>`;
            const safeId = item.id.replace(/'/g, "\\'");

            return `
            <div onclick="openModalById('${safeId}')" class="card-base group bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-100 dark:border-slate-800 cursor-pointer flex flex-col h-full relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-0.5 ${theme.accent} opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="mb-4">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center">
                            <span class="text-[10px] font-mono text-slate-300 dark:text-slate-600 uppercase tracking-widest">${item.id}</span>
                            ${badgeHTML}
                        </div>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100 leading-tight mb-1 group-hover:${theme.text.split(' ')[0]} transition-colors">${item.name}</h3>
                    <p class="${fontClass} text-lg text-slate-400 dark:text-slate-500 font-serif transition-colors">${item.original}</p>
                </div>
                <div class="flex-grow space-y-3">
                    <div class="inline-block px-2 py-1 bg-slate-50 dark:bg-slate-800 rounded text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">${item.meaning}</div>
                    <p class="text-xs text-slate-400 dark:text-slate-500 leading-relaxed line-clamp-3">${cleanDesc}</p>
                </div>
                <div class="mt-5 pt-3 border-t border-slate-50 dark:border-slate-800 flex items-center gap-2 text-slate-300 dark:text-slate-600 text-xs">
                    <i class="fas fa-praying-hands group-hover:${theme.text.split(' ')[0]} transition-colors"></i>
                    <span class="italic truncate group-hover:text-slate-500 dark:group-hover:text-slate-400 transition-colors">${item.praise}</span>
                </div>
            </div>`;
        }

        window.openModalById = function(id) {
            const item = currentData.find(i => i.id === id);
            if (item) openModal(item);
        }

        function openModal(item) {
            const modal = document.getElementById('detailModal');
            const panel = document.getElementById('modalPanel');
            const theme = getThemeColors();
            
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalIdDisplay').innerText = item.id;
            document.getElementById('modalOriginal').innerText = item.original;
            document.getElementById('modalMeaning').innerText = item.meaning;
            document.getElementById('modalDescription').innerHTML = item.description;
            document.getElementById('modalVerseText').innerText = item.verseText;
            document.getElementById('modalVerseRef').innerText = item.verseRef;
            document.getElementById('modalPraise').innerText = item.praise;
            
            const fontClass = (/[א-ת]/.test(item.original)) ? 'hebrew-text' : 'greek-text';
            document.getElementById('modalOriginal').className = `text-4xl md:text-5xl font-serif ${theme.text} ${fontClass}`;
            document.getElementById('modalWatermark').innerText = item.original.charAt(0);
            document.getElementById('modalCategoryBadge').innerText = currentTab.toUpperCase();
            
            const verseContainer = document.getElementById('modalVerseContainer');
            if(verseContainer) {
                verseContainer.className = `bg-slate-50 dark:bg-slate-800/50 rounded-xl p-6 border-l-4 ${theme.border} relative`;
            }

            modal.classList.remove('hidden');
            requestAnimationFrame(() => {
                modal.querySelector('.modal-overlay').classList.remove('opacity-0');
                panel.classList.remove('scale-95', 'opacity-0');
                panel.classList.add('scale-100', 'opacity-100');
            });
            document.body.style.overflow = 'hidden';
        }

        window.closeModal = function() {
            const modal = document.getElementById('detailModal');
            const panel = document.getElementById('modalPanel');
            modal.querySelector('.modal-overlay').classList.add('opacity-0');
            panel.classList.remove('scale-100', 'opacity-100');
            panel.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
