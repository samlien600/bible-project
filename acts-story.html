            font-family: 'Noto Serif TC', serif;

        /* 修正手機版視窗高度問題，使用 dvh 避免被網址列遮擋 */

        .parchment-bg {
            background-color: #f3e9d2; /* Base parchment color */

            position: relative;

        /* --- Performance Optimization: GPU Layer --- */
        /* 強制開啟硬體加速，解決閃爍問題 */
        .gpu-layer {
            transform: translate3d(0, 0, 0);

            color: #f3e9d2;
            border-radius: 50%;
            text-align: center;
            font-weight: bold;
            font-size: 12px;

            transform: scale(1.5);
            background-color: #962222;
            z-index: 1000 !important;

            background-color: #b45309; /* Gold/Amber for active */

            box-shadow: 0 0 15px rgba(245, 158, 11, 0.8);

            opacity: 1;
            transform: translateY(0);

            opacity: 0.7;

            color: #43342e !important;

        let map, markers = [], polylinePoints = [], routeLine;
        let currentIndex = 0;

        function initMap() {
             map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([31.7791, 35.2435], 5); 

            L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=zh-TW', {
                maxZoom: 20,
                attribution: 'Google Maps',
                opacity: 0.8
            }).addTo(map);

            // Prepare points from actsData
            actsData.forEach(event => {
                // Check for valid coordinates
                if(event.coords && Array.isArray(event.coords) && event.coords.length === 2 && 
                   !isNaN(event.coords[0]) && !isNaN(event.coords[1])) {
                    polylinePoints.push(event.coords);
                }
            });
            
            routeLine = L.polyline([], {
                color: '#781818',
                weight: 2,
                opacity: 0.5,
                dashArray: '5, 5',
                lineCap: 'butt'
            }).addTo(map);

            actsData.forEach((event, index) => {
                const icon = L.divIcon({
                    className: 'custom-icon-container',
                    html: `<div class="custom-marker" id="marker-${index}">${event.id}</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                // Safe check for coordinates before creating marker
                if (event.coords && Array.isArray(event.coords) && event.coords.length === 2 && 
                    !isNaN(event.coords[0]) && !isNaN(event.coords[1])) {
                    
                    const marker = L.marker(event.coords, { icon: icon });
                    
                    marker.on('click', () => {
                        currentIndex = index;
                        renderCurrentPage();
                    });
                    markers.push(marker);
                }
            });
        }

        function renderCurrentPage() {
            const data = actsData[currentIndex];
            const container = document.getElementById('event-content');
            
            container.classList.remove('fade-enter-active');
            container.classList.add('fade-enter');
            
            setTimeout(() => {
                const buttonsHtml = data.chars.map((char, idx) => {
                    // Check if this is the special "You" character in event 75
                    const isYou = (data.id === 75 && char.name === '你');
                    const specialClass = isYou ? 'witness-you-btn' : '';
                    
                    return `
                    <button onclick="openBioModal(${idx})" class="${specialClass} w-full group relative overflow-hidden rounded border-2 border-[#781818] bg-[#781818] text-[#f3e9d2] py-2 md:py-2.5 shadow-md hover:shadow-lg transition-all duration-300 mb-1.5 last:mb-0">
                        <div class="absolute inset-0 bg-[#962222] transform translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                        <div class="relative flex items-center justify-center gap-2">
                            <div class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-[#f3e9d2] text-[#781818] flex items-center justify-center font-bold chinese-title-font text-sm md:text-base border border-[#781818]">
                                ${char.avatar}
                            </div>
                            <span class="font-bold tracking-widest text-xs md:text-sm">見證：${char.name}</span>
                        </div>
                    </button>
                `}).join('');

                container.innerHTML = `
                    <div class="flex justify-between items-end border-b-2 border-[#8b6b5d] pb-2 mb-4">
                        <span class="text-xl md:text-2xl font-bold font-serif text-[#781818]">${data.id}</span>
                        <span class="text-xs md:text-sm font-serif italic text-[#5c3a2e] opacity-80">${data.ref}</span>
                    </div>

                    <h2 class="text-lg md:text-2xl font-bold text-[#2c2420] mb-2 leading-tight drop-shadow-sm">${data.title}</h2>
                    
                    <div class="flex items-center text-[#781818] text-xs md:text-sm mb-4 font-bold tracking-wide">
                        <i data-lucide="map-pin" class="w-3 h-3 md:w-4 md:h-4 mr-1"></i> ${data.location}
                    </div>

                    <div class="bg-[#fcfaf5] p-4 md:p-6 rounded-lg border-2 border-[#8b6b5d]/30 shadow-inner mb-6 relative flex-1 min-h-[10rem] flex flex-col justify-center overflow-y-auto">
                        <i data-lucide="feather" class="w-5 h-5 md:w-6 md:h-6 text-[#8b6b5d] absolute top-3 right-3 opacity-40"></i>
                        <p class="text-[#43342e] leading-loose text-justify font-serif text-sm md:text-lg tracking-wide">
                            ${data.luke}
                        </p>
                    </div>

                    <div class="mt-auto">
                        ${buttonsHtml}
                    </div>
                `;
                
                if (typeof lucide !== 'undefined') lucide.createIcons();

                container.classList.remove('fade-enter');
                container.classList.add('fade-enter-active');
            }, 50);

            document.getElementById('page-indicator').innerText = `${data.id} / ${actsData.length}`;
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === actsData.length - 1;

            // Update Markers
            markers.forEach((m, i) => {
                if (i <= currentIndex) {
                    if (!map.hasLayer(m)) m.addTo(map);
                    
                    const isActive = (i === currentIndex);
                    const el = document.getElementById(`marker-${i}`);

                    m.unbindTooltip();
                    m.bindTooltip(`
                        <div class="text-center">
                            <div class="font-bold text-[#781818] text-sm">${actsData[i].title}</div>
                            <div class="text-xs text-[#5c4b43] mt-0.5 font-serif flex items-center justify-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin shrink-0"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                <span>${actsData[i].location}</span>
                            </div>
                        </div>
                    `, {
                        direction: 'top',
                        offset: [0, -14],
                        className: 'custom-tooltip',
                        permanent: isActive 
                    });

                    if (isActive) {
                        if (el) el.classList.add('active-marker');
                        m.openTooltip();
                    } else {
                        if (el) el.classList.remove('active-marker');
                        m.closeTooltip();
                    }
                } else {
                    if (map.hasLayer(m)) map.removeLayer(m);
                }
            });

            // Update Route Line
            if (routeLine && polylinePoints.length > 0) {
                const currentPath = polylinePoints.slice(0, currentIndex + 1);
                routeLine.setLatLngs(currentPath);
            }

            // Fly to location with Safe Checks
            if (map && data.coords && Array.isArray(data.coords) && 
                data.coords.length === 2 && 
                !isNaN(Number(data.coords[0])) && !isNaN(Number(data.coords[1]))) {
                
                try {
                    map.invalidateSize(); 
                    const mapSize = map.getSize();
                    if (mapSize.x > 0 || mapSize.y > 0) {
                        map.flyTo(data.coords, data.zoom, { duration: 1.2, easeLinearity: 0.2 });
                    }
                } catch (e) {
                    console.warn("Leaflet flyTo error suppressed:", e);
                }
            }
        }

        function changePage(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < actsData.length) {
                currentIndex = newIndex;
                renderCurrentPage();
            }
        }

        function openBioModal(charIndex) {
            const data = actsData[currentIndex].chars[charIndex];
            const eventData = actsData[currentIndex]; // Get event data to check ID
            
            document.getElementById('modal-name').innerText = data.name;
            document.getElementById('modal-role').innerText = data.role;
            document.getElementById('modal-quote').innerText = `"${data.quote}"`;
            
            // 處理換行符號
            const bioText = data.bio.replace(/\n/g, '<br/>');
            document.getElementById('modal-bio').innerHTML = bioText;

            const modal = document.getElementById('char-modal');
            const modalContent = document.getElementById('modal-content');

            // 聖靈火焰特效邏輯
            // 檢查是否為第 75 個事件 (id 75) 且 角色名稱為 "你"
            if (eventData.id === 75 && data.name === '你') {
                modalContent.classList.add('holy-fire-effect');
            } else {
                modalContent.classList.remove('holy-fire-effect');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('char-modal');
            const modalContent = document.getElementById('modal-content');
            
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            // 關閉時移除特效，以免影響下一次開啟
            setTimeout(() => {
                modal.classList.add('hidden');
                modalContent.classList.remove('holy-fire-effect');
            }, 300);
        }
        
        // --- Welcome Modal Logic (Modified to always show) ---
        function checkFirstVisit() {
            // Removed localStorage check so it always shows
            const modal = document.getElementById('welcome-modal');
            modal.classList.remove('hidden');
            // small delay to allow transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 100);
        }

        function closeWelcomeModal() {
            const modal = document.getElementById('welcome-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                // No need to set flag anymore
            }, 500);
        }

        // 新增：計算不重覆見證人功能的函數
        function countUniqueWitnesses() {
            const uniqueNames = new Set();
            const uniqueRoles = [];

            actsData.forEach(event => {
                if (event.chars && Array.isArray(event.chars)) {
                    event.chars.forEach(char => {
                        if (char.name && char.name.trim() !== "") {
                            // 使用 Set 來過濾重覆的名字
                            if (!uniqueNames.has(char.name)) {
                                uniqueNames.add(char.name);
                                uniqueRoles.push(`${char.name} (${char.role})`);
                            }
                        }
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            
            setTimeout(() => {
                initMap();
                map.whenReady(() => {
                    setTimeout(() => {
                        renderCurrentPage();
                        // 執行計算
                        countUniqueWitnesses();
                        // 總是開啟歡迎視窗
                        checkFirstVisit();
                    }, 100);
                });
            }, 300);
        });
    </script>
</body>
</html>
