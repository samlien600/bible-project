<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>串聯新舊約：每日靈修讀經</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap');

        :root {
            --bg-paper: #fdfbf7;
            --text-primary: #2c2420;
            --text-secondary: #5d5550;
            --accent-gold: #b48e43;
            --accent-subtle: #e8e4db;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-paper);
            color: var(--text-primary);
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 30px 30px; /* 手機上紋理稍微密一點 */
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊高亮 */
        }
        
        .font-display { font-family: 'Cinzel', serif; }
        .font-serif-tc { font-family: 'Lora', 'Noto Serif TC', serif; }

        /* 動畫效果 */
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-card {
            transition: all 0.3s ease;
        }
        /* 僅在支援 hover 的裝置上啟用懸停效果，避免手機點擊時卡住 */
        @media (hover: hover) {
            .month-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
                border-color: var(--accent-gold);
            }
        }
        /* 手機點擊時的微回饋 */
        .month-card:active {
            transform: scale(0.98);
            background-color: #fafafa;
        }

        /* 隱藏滾動條但保持功能 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-amber-100 selection:text-amber-900 overflow-x-hidden">

    <!-- Header / Navigation -->
    <!-- 減少手機上的 Padding (px-4 py-3) -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-stone-100 sticky top-0 z-50 transition-all duration-300 shadow-sm" id="mainNav">
        <div class="max-w-5xl mx-auto px-4 md:px-6 py-3 md:py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer group select-none" onclick="renderHome()">
                <div class="w-9 h-9 md:w-10 md:h-10 bg-stone-800 text-white rounded-full flex items-center justify-center transition-colors shadow-md">
                    <i class="fas fa-cross text-base md:text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold tracking-wide font-serif-tc text-stone-800 transition-colors">串聯新舊約</h1>
                    <p class="text-[9px] md:text-[10px] uppercase tracking-widest text-stone-400 font-display">Connect the Testaments</p>
                </div>
            </div>
            <div id="nav-month-title" class="hidden md:block text-stone-500 font-medium font-serif-tc text-sm">
                <!-- Dynamic Month Title -->
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <!-- 手機版 Padding 縮小 (p-4) -->
    <main id="app" class="flex-grow w-full max-w-5xl mx-auto p-4 md:p-10 min-h-[60vh]">
        <div class="flex flex-col items-center justify-center h-64 text-stone-400 space-y-4">
            <div class="relative">
                <div class="w-10 h-10 md:w-12 md:h-12 border-4 border-stone-200 border-t-amber-600 rounded-full animate-spin"></div>
            </div>
            <p class="font-serif-tc animate-pulse text-sm md:text-base">正在預備心靈糧食...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-stone-200 bg-white py-8 md:py-12 mt-8 md:mt-12 relative z-10 pb-24 md:pb-12">
        <div class="max-w-5xl mx-auto px-6 text-center">
            <div class="mb-4 text-amber-700 opacity-50">
                <i class="fas fa-book-open text-xl md:text-2xl"></i>
            </div>
            <p class="text-stone-600 font-serif-tc text-xs md:text-sm mb-2">© 2025 串聯新舊約靈修計畫</p>
            <p class="text-stone-400 text-[10px] md:text-xs font-display tracking-widest">Connecting the Testaments</p>
        </div>
    </footer>

    <!-- Floating Action Buttons (FAB) -->
    <div class="fixed bottom-6 right-6 md:bottom-8 md:right-8 flex flex-col gap-3 z-40">
        <button onclick="renderHome()" id="floatBackBtn" class="bg-stone-800 text-white w-10 h-10 md:w-12 md:h-12 rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none" title="返回總覽">
            <i class="fas fa-th-large text-xs md:text-sm"></i>
        </button>

        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" id="backToTop" class="bg-white border border-stone-200 text-stone-600 w-10 h-10 md:w-12 md:h-12 rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none" title="回到頂部">
            <i class="fas fa-arrow-up text-xs md:text-sm"></i>
        </button>
    </div>

    <!-- Load Data JS -->
    <script src="bible_data.js"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3DFR7N5MT2');
    </script>
    <script>
        let isDetailPage = false;

        function checkDataLoaded() {
            if (typeof BIBLE_DATA === 'undefined') {
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-[50vh] text-center p-6">
                        <div class="bg-red-50 p-6 rounded-2xl border border-red-100 max-w-sm w-full">
                            <i class="fas fa-exclamation-triangle text-red-400 text-2xl md:text-3xl mb-4"></i>
                            <h2 class="text-lg md:text-xl font-bold text-stone-800 mb-2 font-serif-tc">資料讀取失敗</h2>
                            <p class="text-stone-500 text-sm mb-4">請確認 <strong>bible_data.js</strong> 檔案存在。</p>
                            <button onclick="location.reload()" class="w-full px-4 py-3 bg-white border border-red-200 text-red-500 rounded-lg active:bg-red-50 transition text-sm">重試</button>
                        </div>
                    </div>
                `;
                return false;
            }
            return true;
        }

        window.addEventListener('scroll', () => {
            const backToTopBtn = document.getElementById('backToTop');
            const floatBackBtn = document.getElementById('floatBackBtn');
            const scrollY = window.scrollY;
            const threshold = 200; // 手機上更早顯示

            if (scrollY > threshold) {
                backToTopBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            } else {
                backToTopBtn.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }

            if (isDetailPage && scrollY > threshold) {
                floatBackBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            } else {
                floatBackBtn.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }
        });

        function renderHome() {
            if (!checkDataLoaded()) return;
            isDetailPage = false;

            const app = document.getElementById('app');
            document.getElementById('nav-month-title').innerHTML = ''; 
            document.getElementById('floatBackBtn').classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');

            let html = `
                <div class="text-center mb-10 md:mb-16 fade-in-up px-2">
                    <span class="text-amber-600 font-display tracking-[0.2em] text-xs md:text-sm font-bold uppercase mb-2 block">Daily Devotional</span>
                    <h2 class="text-3xl md:text-5xl font-bold text-stone-800 mb-4 md:mb-6 font-serif-tc leading-tight">2025 每日靈修計畫</h2>
                    <div class="w-16 md:w-24 h-1 bg-amber-500 mx-auto rounded-full mb-4 md:mb-6"></div>
                    <p class="text-stone-500 max-w-2xl mx-auto leading-loose text-base md:text-lg font-light text-justify md:text-center px-2">這不僅是一份讀經表，更是一趟穿越歷史的旅程。看見舊約的預表如何在基督裡得到完美的應驗。</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-8">
            `;

            BIBLE_DATA.themes.forEach((m, index) => {
                const delay = Math.min(index * 50, 600);
                
                html += `
                    <div onclick="renderMonth(${m.id})" style="animation-delay: ${delay}ms" class="month-card bg-white rounded-xl p-6 md:p-8 shadow-[0_2px_10px_rgba(0,0,0,0.03)] border border-stone-100 cursor-pointer relative overflow-hidden group fade-in-up h-full flex flex-col active:bg-stone-50">
                        <!-- 背景大數字：手機版縮小字體以防遮擋 -->
                        <span class="absolute -right-2 -top-4 md:-right-4 md:-top-6 text-[80px] md:text-[120px] font-display font-bold text-stone-50 opacity-60 md:opacity-50 md:group-hover:opacity-10 md:group-hover:text-amber-100 transition-all duration-500 select-none pointer-events-none">${m.id}</span>
                        
                        <div class="relative z-10 flex-grow">
                            <div class="flex items-center justify-between mb-4 md:mb-6">
                                <span class="font-display text-2xl md:text-3xl font-bold text-amber-700/80 border-b-2 border-amber-100 pb-1">${String(m.id).padStart(2, '0')}</span>
                                <div class="w-8 h-8 rounded-full bg-stone-50 flex items-center justify-center text-stone-400">
                                    <i class="fas fa-arrow-right text-xs"></i>
                                </div>
                            </div>
                            <h3 class="text-xl md:text-2xl font-bold text-stone-800 mb-2 md:mb-3 font-serif-tc">${m.title}</h3>
                            <p class="text-stone-500 text-sm leading-relaxed font-light">${m.desc}</p>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            app.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function renderMonth(monthId) {
            if (!checkDataLoaded()) return;
            isDetailPage = true;

            const app = document.getElementById('app');
            const theme = BIBLE_DATA.themes.find(m => m.id === monthId);
            const days = BIBLE_DATA.dailyReadings[monthId.toString()] || [];

            // Mobile Nav Title update
            document.getElementById('nav-month-title').innerHTML = `
                <div class="flex items-center space-x-2 text-stone-400">
                    <span>${String(monthId).padStart(2, '0')}</span>
                    <span class="text-stone-300">/</span>
                    <span class="text-stone-600 font-bold text-xs md:text-sm truncate max-w-[120px]">${theme.title}</span>
                </div>
            `;

            // 生成書卷 Tags HTML
            let booksHtml = '';
            if (theme.books && theme.books.length > 0) {
                booksHtml = `
                    <div class="mt-4 flex flex-wrap gap-2">
                        ${theme.books.map(book => `
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs md:text-sm font-medium bg-amber-50 text-amber-900 border border-amber-100">
                                <i class="fas fa-bookmark mr-1.5 text-[10px] text-amber-500/70"></i>
                                ${book}
                            </span>
                        `).join('')}
                    </div>
                `;
            }

            let html = `
                <div class="fade-in-up">
                    <div class="mb-6 md:mb-10 flex flex-col md:flex-row md:items-end justify-between border-b border-stone-200 pb-4 md:pb-6">
                        <div class="w-full">
                            <button onclick="renderHome()" class="mb-3 md:mb-4 px-3 py-1.5 md:px-4 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-500 transition text-xs font-medium tracking-wide flex items-center w-fit active:scale-95">
                                <i class="fas fa-arrow-left mr-2"></i> 返回總覽
                            </button>
                            <div class="flex justify-between items-baseline w-full">
                                <h2 class="text-2xl md:text-4xl font-bold text-stone-800 font-serif-tc mb-1 md:mb-2">${theme.title}</h2>
                                <span class="text-5xl font-display font-bold text-stone-100 md:hidden">${String(monthId).padStart(2, '0')}</span>
                            </div>
                            <p class="text-stone-500 text-sm md:text-base">${theme.desc}</p>
                            ${booksHtml} <!-- Insert Books Tags Here -->
                        </div>
                        <div class="mt-2 md:mt-0 text-right hidden md:block">
                            <span class="text-5xl font-display font-bold text-stone-100">${String(monthId).padStart(2, '0')}</span>
                        </div>
                    </div>
                    
                    <div class="space-y-4 md:space-y-6">
            `;

            if (days.length === 0) {
                html += `
                    <div class="p-12 text-center text-stone-400 bg-white rounded-xl border border-dashed border-stone-200">
                        <i class="fas fa-pencil-alt mb-3 text-2xl opacity-30"></i>
                        <p>本月內容編撰中...</p>
                    </div>`;
            } else {
                days.forEach((day, index) => {
                    const delay = Math.min(index * 30, 500); 
                    
                    const connectionHtml = day.connection ? `
                        <div class="mt-4 relative">
                            <div class="absolute top-0 left-0 w-1 h-full bg-amber-200 rounded-full"></div>
                            <div class="pl-4 py-1">
                                <div class="flex items-center mb-1 text-amber-700/80 text-[10px] md:text-xs font-bold uppercase tracking-wider font-display">
                                    <i class="fas fa-link mr-2"></i> Connection
                                </div>
                                <p class="text-stone-700 text-base md:text-lg leading-relaxed font-serif-tc text-justify">${day.connection}</p>
                            </div>
                        </div>
                    ` : '';

                    html += `
                        <div style="animation-delay: ${delay}ms" class="fade-in-up bg-white rounded-xl p-5 md:p-8 shadow-sm border border-stone-100 hover:shadow-md transition-shadow group relative overflow-hidden">
                            <div class="flex flex-row items-start gap-4 md:gap-6">
                                <!-- Date Badge: Fixed width to prevent shrinking -->
                                <div class="flex-shrink-0">
                                    <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-stone-50 border border-stone-100 flex flex-col items-center justify-center text-stone-700 md:group-hover:bg-amber-50 md:group-hover:text-amber-700 md:group-hover:border-amber-200 transition-colors duration-300">
                                        <span class="text-[9px] md:text-[10px] uppercase font-display font-bold leading-none mt-1 text-stone-400">Day</span>
                                        <span class="text-lg md:text-xl font-bold font-serif-tc leading-none">${day.day}</span>
                                    </div>
                                </div>

                                <div class="flex-grow min-w-0"> <!-- min-w-0 is crucial for text-truncate/wrap inside flex -->
                                    <h4 class="text-lg md:text-xl font-bold text-stone-800 mb-2 md:mb-3 font-serif-tc md:group-hover:text-amber-800 transition-colors leading-tight">${day.title}</h4>
                                    
                                    <div class="bg-stone-50/50 rounded-lg p-3 md:p-4 border border-stone-100/50">
                                        <div class="flex items-start text-stone-600">
                                            <i class="fas fa-book-open text-amber-600/60 mt-1 mr-2 md:mr-3 text-xs md:text-sm flex-shrink-0 pt-1"></i>
                                            <span class="text-sm md:text-base font-light tracking-wide leading-relaxed text-justify">${day.verses}</span>
                                        </div>
                                    </div>

                                    ${connectionHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });

                // Bottom Back Button
                html += `
                    <div class="mt-8 md:mt-12 flex justify-center pb-4 fade-in-up" style="animation-delay: ${Math.min(days.length * 30 + 100, 600)}ms">
                        <button onclick="renderHome()" class="group relative px-6 py-3 md:px-8 bg-white border border-stone-200 rounded-full shadow-sm active:bg-stone-50 active:scale-95 transition-all duration-300 flex items-center space-x-3 w-full md:w-auto justify-center">
                            <span class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-500 group-hover:bg-amber-100 group-hover:text-amber-700 transition-colors">
                                <i class="fas fa-arrow-left text-sm"></i>
                            </span>
                            <span class="text-stone-600 font-serif-tc font-medium text-sm md:text-base">返回年度總覽</span>
                        </button>
                    </div>
                `;
            }

            html += `</div></div>`;
            app.innerHTML = html;
            window.scrollTo(0, 0);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderHome();
        });

    </script>
</body>
</html>
