<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="先知的聲音">
    <title>先知的聲音 - 救贖的宏大敘事</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3DFR7N5MT2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3DFR7N5MT2');
    </script>
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #f0ebe0;
            color: #2c241b;
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊高亮 */
        }
        
        /* 紋理背景 */
        .texture-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23dcd3c2' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        
        /* 導航項目樣式 */
        .nav-item {
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }
        .nav-item:active, .nav-item:hover {
            background-color: rgba(140, 107, 72, 0.1);
        }
        .nav-item.active {
            background-color: #e6dfd1;
            border-left: 4px solid #8c4848;
            font-weight: 700;
        }
        .nav-item.special-section {
            background-color: #3e3226;
            color: #dcd3c2;
            border-left: 4px solid #cbbba0;
        }
        .nav-item.special-section.active {
            background-color: #251e17;
            color: #fff;
            border-left: 4px solid #d4af37;
        }

        /* 首字放大 */
        .drop-cap::first-letter {
            float: left;
            font-size: 3.5rem;
            line-height: 0.85;
            padding-right: 0.5rem;
            padding-top: 0.2rem;
            color: #8c4848;
            font-weight: 700;
        }
        
        /* 背景大引號 */
        .quote-mark {
            font-family: serif;
            font-size: 6rem;
            position: absolute;
            opacity: 0.08;
            color: #8c6b48;
            top: -1rem;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }
        
        /* 自定義捲軸 */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #a89f91;
            border-radius: 3px;
        }

        /* 動畫 */
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 手機側邊欄過渡 */
        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden texture-bg relative">

    <!-- 1. 手機版頂部導航列 (Mobile Header) -->
    <header class="md:hidden flex-shrink-0 h-16 bg-[#2c241b] text-[#f0ebe0] flex items-center justify-between px-5 shadow-lg z-30 relative border-b border-[#5c4d3c]">
        <div class="flex items-center gap-3">
            <i class="fas fa-scroll text-[#d4af37]"></i>
            <h1 class="text-lg font-bold tracking-widest uppercase">Prophetic Voices</h1>
        </div>
        <button id="menu-btn" class="w-10 h-10 flex items-center justify-center text-[#d4af37] focus:outline-none active:scale-95 transition-transform" aria-label="Menu">
            <i class="fas fa-bars text-2xl"></i>
        </button>
    </header>

    <!-- 2. 手機版遮罩層 (Mobile Overlay) -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-300 opacity-0 backdrop-blur-sm" onclick="closeSidebar()"></div>

    <!-- 3. 側邊導航欄 (Sidebar) -->
    <!-- 手機：Fixed + Translate / 電腦：Static + Visible -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-[85%] max-w-[320px] md:w-80 md:static bg-[#dfd7ca] shadow-2xl z-50 flex flex-col border-r border-[#c2b5a5] transform -translate-x-full md:translate-x-0 sidebar-transition">
        
        <!-- 側邊欄頭部 -->
        <div class="p-6 bg-[#2c241b] text-[#f0ebe0] flex-shrink-0 relative">
            <button onclick="closeSidebar()" class="md:hidden absolute top-4 right-4 text-[#d4af37] p-2">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h1 class="text-xl font-bold tracking-[0.2em] uppercase border-b border-[#5c4d3c] pb-2 mb-1">
                先知的聲音
            </h1>
            <p class="text-xs font-light opacity-70 text-right tracking-wider">The Prophetic Voices</p>
        </div>

        <!-- 導航列表 -->
        <div class="flex-1 overflow-y-auto custom-scroll pb-safe" id="nav-list">
            <!-- JS 生成內容 -->
        </div>
    </aside>

    <!-- 4. 主要閱讀區 (Main Content) -->
    <main class="flex-1 h-full w-full relative overflow-hidden bg-[#f3f0e6]">
        <!-- 頂部裝飾金線 -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[#8c6b48] via-[#d4af37] to-[#8c6b48] opacity-60 z-10"></div>
        
        <!-- 內容容器 -->
        <div id="content-container" class="h-full w-full overflow-y-auto custom-scroll p-5 md:p-12 lg:p-16 scroll-smooth pb-24 md:pb-16">
            <!-- JS 動態注入 -->
        </div>
    </main>

    <!-- 載入資料庫 -->
    <script src="prophet_datas.js"></script>

    <script>
        // DOM 元素
        const navList = document.getElementById('nav-list');
        const contentContainer = document.getElementById('content-container');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        const menuBtn = document.getElementById('menu-btn');

        // YouVersion 書卷代碼對照表 (CUNP-神版)
        const bibleBookCodes = {
            isaiah: 'ISA',
            jeremiah: 'JER',
            ezekiel: 'EZK',
            daniel: 'DAN',
            hosea: 'HOS',
            joel: 'JOL',
            amos: 'AMO',
            obadiah: 'OBA',
            jonah: 'JON',
            micah: 'MIC',
            nahum: 'NAM',
            habakkuk: 'HAB',
            zephaniah: 'ZEP',
            haggai: 'HAG',
            zechariah: 'ZEC',
            malachi: 'MAL'
        };

        // 狀態
        let isMobileMenuOpen = false;

        // 初始化
        function init() {
            if (typeof staticContent === 'undefined' || typeof prophetsData === 'undefined') {
                contentContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-[#8c4848] p-6 text-center">
                        <i class="fas fa-exclamation-circle text-4xl mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">資料載入失敗</h2>
                        <p class="opacity-80">請確認 data.js 檔案存在且內容正確。</p>
                    </div>`;
                return;
            }

            renderSidebar();
            
            // 綁定漢堡選單事件
            menuBtn.addEventListener('click', openSidebar);

            // 預設載入導論
            loadSpecialContent('intro');
        }

        // --- UI 控制 ---

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
            // 小延遲讓 opacity transition 生效
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            isMobileMenuOpen = true;
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
            isMobileMenuOpen = false;
        }

        // 手機版點擊選項後自動關閉選單
        function handleNavClick(element) {
            setActive(element);
            if (window.innerWidth < 768) {
                closeSidebar();
            }
        }

        function setActive(element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            
            // 滾動到頂部
            contentContainer.scrollTop = 0;
        }

        // --- 渲染邏輯 ---

        function renderSidebar() {
            // 1. 導論
            const introBtn = createNavItem(
                `導論：職分與目的`, 
                `The Purpose`, 
                'special', 
                () => loadSpecialContent('intro', introBtn)
            );
            introBtn.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-scroll"></i> <span class="font-bold">導論：職分與目的</span></div>`;
            navList.appendChild(introBtn);

            // 2. 大先知
            addSectionTitle("大先知書 (Major Prophets)");
            prophetsData.major.forEach(p => addProphetItem(p));

            // 3. 小先知
            addSectionTitle("小先知書 (Minor Prophets)");
            prophetsData.minor.forEach(p => addProphetItem(p));

            // 4. 結論
            const outroBtn = createNavItem(
                `結論：最終的救贖`, 
                `Redemption`, 
                'special', 
                () => loadSpecialContent('redemption', outroBtn)
            );
            outroBtn.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-cross"></i> <span class="font-bold">結論：最終的救贖</span></div>`;
            outroBtn.classList.add('mt-4', 'border-t', 'border-[#b8aca0]');
            navList.appendChild(outroBtn);
        }

        function createNavItem(title, subtitle, type, onClick) {
            const div = document.createElement('div');
            div.className = `nav-item px-6 py-4 cursor-pointer flex items-center gap-3 ${type === 'special' ? 'special-section' : 'text-[#5c4d3c] border-b border-[#dcd3c2]'}`;
            div.onclick = () => {
                onClick();
                handleNavClick(div);
            };
            return div;
        }

        function addSectionTitle(text) {
            const div = document.createElement('div');
            div.className = "px-6 py-2 text-xs font-bold text-[#8c6b48] bg-[#d5cbbd] uppercase tracking-wider sticky top-0 z-10 shadow-sm";
            div.textContent = text;
            navList.appendChild(div);
        }

        function addProphetItem(data) {
            const div = document.createElement('div');
            div.className = "nav-item px-6 py-4 cursor-pointer text-[#5c4d3c] border-b border-[#dcd3c2] hover:pl-8 transition-all";
            div.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-lg text-[#2c241b]">${data.name}</span>
                    <span class="text-[10px] font-bold opacity-40 bg-[#cbbba0] px-2 py-0.5 rounded text-white tracking-widest">${data.id.substring(0,3).toUpperCase()}</span>
                </div>
                <div class="text-xs opacity-70 truncate font-light">${data.title}</div>
            `;
            div.onclick = () => {
                loadProphetContent(data, div);
                handleNavClick(div);
            };
            navList.appendChild(div);
        }

        // --- 內容載入 ---

        function loadSpecialContent(key, element) {
            // 初始化時如果沒有傳入 element，手動找第一個
            if (!element && key === 'intro') {
                element = document.querySelectorAll('.nav-item')[0];
            }
            if(element) setActive(element);
            
            const data = staticContent[key];
            
            // 渲染前淡出效果 (可選，這裡直接替換以求反應速度)
            contentContainer.innerHTML = data.content;
        }

        function loadProphetContent(data, element) {
            setActive(element);

            // 取得 YouVersion 連結代碼
            const bibleCode = bibleBookCodes[data.id] || 'GEN'; // 預設創世紀，雖然應該都有對應
            const bibleUrl = `https://www.bible.com/bible/46/${bibleCode}.1.CUNP-神`;

            const html = `
                <div class="max-w-3xl mx-auto fade-in-up pb-10">
                    <!-- 標題區 -->
                    <header class="mb-10 md:mb-14 text-center relative pt-4">
                        <span class="text-xs md:text-sm font-bold text-[#8c6b48] tracking-[0.3em] uppercase block mb-3">${data.book}</span>
                        <h1 class="text-4xl md:text-6xl font-bold text-[#2c241b] mb-6 relative z-10 tracking-tight">${data.name}</h1>
                        <div class="w-16 h-1 bg-[#8c6b48] mx-auto mb-6"></div>
                        
                        <!-- YouVersion 按鈕 -->
                        <div class="mb-8 relative z-20">
                            <a href="${bibleUrl}" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-transparent border border-[#8c6b48] text-[#8c6b48] text-xs font-bold uppercase tracking-widest rounded hover:bg-[#8c6b48] hover:text-[#f0ebe0] transition-colors duration-300">
                                <i class="fas fa-book-open"></i> 閱讀聖經 (YouVersion)
                            </a>
                        </div>

                        <div class="relative px-6 md:px-12">
                            <i class="fas fa-quote-left absolute top-0 left-0 text-[#8c6b48] opacity-30 text-xl"></i>
                            <p class="text-xl md:text-2xl text-[#5c4d3c] font-serif italic relative z-10 leading-relaxed">
                                ${data.quote}
                            </p>
                            <i class="fas fa-quote-right absolute bottom-0 right-0 text-[#8c6b48] opacity-30 text-xl"></i>
                        </div>
                        
                        <!-- 背景裝飾字 -->
                        <div class="quote-mark left-1/2 transform -translate-x-1/2 text-[8rem] opacity-[0.03]">"</div>
                    </header>

                    <!-- 自我介紹 -->
                    <section class="mb-10 bg-white p-6 md:p-10 rounded-xl shadow-sm border-l-4 border-[#cbbba0] relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10 text-[#8c6b48]">
                            <i class="fas fa-user-circle text-6xl"></i>
                        </div>
                        <h3 class="text-[#8c6b48] font-bold text-sm tracking-widest uppercase mb-4 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-[#8c6b48]"></span> 關於我
                        </h3>
                        <div class="prose prose-lg text-[#4a3b2a] text-justify leading-loose">
                            <p class="drop-cap text-lg md:text-xl">${data.intro}</p>
                        </div>
                    </section>

                    <!-- 神的啟示 -->
                    <section class="mb-12">
                         <div class="flex items-center mb-8 gap-4">
                            <div class="h-px bg-[#8c6b48] flex-1 opacity-20"></div>
                            <h3 class="text-xl md:text-2xl font-bold text-[#8c6b48] flex items-center gap-3">
                                <i class="fas fa-pen-nib"></i> 神給我的啟示
                            </h3>
                            <div class="h-px bg-[#8c6b48] flex-1 opacity-20"></div>
                        </div>
                        <div class="prose prose-lg text-[#2c241b] text-justify leading-loose md:px-4">
                            ${data.message}
                        </div>
                    </section>

                    <!-- 金句卡片 -->
                    <section class="mt-16 transform transition-all duration-500 hover:shadow-2xl rounded-xl">
                        <div class="bg-gradient-to-br from-[#2c241b] to-[#3e3226] text-[#f0ebe0] p-8 md:p-12 rounded-xl shadow-xl relative overflow-hidden group border border-[#5c4d3c]">
                            <!-- 裝飾圓圈 -->
                            <div class="absolute -top-10 -right-10 w-40 h-40 bg-[#d4af37] opacity-10 rounded-full blur-2xl"></div>
                            
                            <div class="relative z-10 flex flex-col items-center text-center">
                                <i class="fas fa-bible text-[#d4af37] text-3xl mb-6 opacity-80"></i>
                                <p class="text-lg md:text-2xl font-serif leading-loose tracking-wide italic">
                                    "${data.verse}"
                                </p>
                                <div class="mt-8 pt-4 border-t border-[#d4af37] border-opacity-30 w-full max-w-xs">
                                    <span class="text-[#d4af37] text-xs tracking-[0.2em] uppercase">Key Verse</span>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            `;
            
            contentContainer.innerHTML = html;
        }

        function showPrayer() {
            const btnArea = document.getElementById('invitation-area');
            const prayerContent = document.getElementById('prayer-content');
            
            btnArea.style.display = 'none';
            prayerContent.classList.remove('hidden');
            prayerContent.classList.add('fade-in-up');
            
            // 自動捲動到禱告區塊
            setTimeout(() => {
                prayerContent.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        // 啟動
        init();
    </script>
</body>
</html>
