    <style>
        /* 全局設定 */
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #f0ebe0;
            color: #2c241b;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overscroll-behavior-y: none; /* 防止整體頁面回彈 */
        }

        /* 介面字體優先使用黑體 */
        .ui-font {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 紋理背景 */
        .texture-bg {
            background-color: #f0ebe0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }

        /* iOS Safe Area Utilities */
        .pt-safe {
            padding-top: env(safe-area-inset-top);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .mt-safe {
            margin-top: env(safe-area-inset-top);
        }

        /* 導航項目基礎樣式 */
        .nav-item {
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid transparent;
            overflow: hidden;
        }
        
        .nav-item:hover {
            background-color: rgba(140, 107, 72, 0.08);
            padding-left: 1.75rem; 
        }
        .nav-item:active {
            background-color: rgba(212, 175, 55, 0.15);
        }

        .nav-item .nav-arrow {
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.2s ease;
        }
        .nav-item:hover .nav-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .nav-item.active {
            background-color: #e6dfd1;
            border-left-color: #8c4848;
            color: #2c241b;
        }
        .nav-item.active .nav-arrow {
            opacity: 1;
            transform: translateX(0);
            color: #8c4848;
        }
        
        /* 特殊章節 (導論/結論) */
        .nav-item.special-section {
            background-color: #2c241b; 
            color: #eaddcf; 
            border-left: 4px solid #5c4d3c;
            margin-bottom: 1px; 
        }
        .nav-item.special-section:hover {
            background-color: #3e3226; 
            padding-left: 1.75rem;
            color: #fff;
        }
        .nav-item.special-section .nav-icon-box {
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .nav-item.special-section.active {
            background-color: #1a1510; 
            color: #d4af37; 
            border-left-color: #d4af37;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .nav-item.special-section.active .nav-icon-box {
            background-color: #d4af37;
            color: #2c241b;
            border-color: #d4af37;
        }

        /* 首字放大 */
        .drop-cap::first-letter {
            float: left;
            font-size: 3.8rem;
            line-height: 0.8;
            padding-right: 0.75rem;
            padding-top: 0.2rem;
            color: #8c4848;
            font-weight: 700;
            font-family: 'Noto Serif TC', serif;
        }
        
        /* 背景裝飾大引號 */
        .quote-mark {
            font-family: serif;
            font-size: 8rem;
            position: absolute;
            opacity: 0.05;
            color: #8c6b48;
            top: -2rem;
            left: -1rem;
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }
        
        /* 自定義捲軸 */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbbba0;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #8c6b48;
        }

        /* 動畫類別 */
        .fade-in-up {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 側邊欄過渡 */
        .sidebar-transition {
            transition: transform 0.35s cubic-bezier(0.33, 1, 0.68, 1);
        }

        /* 隱藏/顯示 Header 的過渡 */
        .header-transition {
            transition: transform 0.3s ease-in-out;
        }
        .header-hidden {
            transform: translateY(-100%);
        }

        /* Modal 動畫 */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col md:flex-row overflow-hidden texture-bg relative">

    <!-- 1. 手機版頂部導航列 (Mobile Header) -->
    <!-- z-40 確保覆蓋內容，pt-safe 避開瀏海，box-content 確保高度不被 padding 吃掉 -->
    <header id="mobile-header" class="md:hidden fixed top-0 left-0 right-0 h-14 bg-bible-dark text-bible-paper flex items-center justify-between px-4 shadow-lg z-40 header-transition border-b border-bible-brown pt-safe box-content transition-transform duration-300">

        </div>
        <!-- 擴大點擊範圍 w-12 h-12，加入 touch-manipulation 優化觸控 -->

            <i class="fas fa-bars text-xl"></i>
        </button>
    </header>

    <!-- 2. 手機版遮罩層 (Mobile Overlay) -->

    <!-- 3. 側邊導航欄 (Sidebar) -->

        <!-- 側邊欄頭部 -->
        <div class="p-6 bg-bible-dark text-bible-paper flex-shrink-0 relative">
            <button onclick="closeSidebar()" class="md:hidden absolute top-4 right-4 text-bible-gold p-4 -mr-2 -mt-2 active:scale-90 transition-transform cursor-pointer">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h1 class="text-xl font-bold tracking-[0.2em] uppercase border-b border-bible-brown pb-2 mb-2 ui-font">
                先知的聲音

        </div>

        <!-- 導航列表 -->
        <div class="flex-1 overflow-y-auto custom-scroll pb-safe" id="nav-list">
            <!-- JS 生成內容 -->
        </div>
    </aside>

    <!-- 4. 主要閱讀區 (Main Content) -->
    <main class="flex-1 h-full w-full relative overflow-hidden bg-transparent">
        <!-- 頂部裝飾金線 -->
        <!-- mt-safe 確保在瀏海下方 -->
        <div class="fixed md:absolute top-14 md:top-0 left-0 w-full h-1 bg-gradient-to-r from-bible-red via-bible-gold to-bible-red opacity-80 z-20 mt-safe"></div>
        
        <!-- 內容容器 -->

            { id: 'zechariah', name: '撒迦利亞', start: 16, end: 16, color: 'bg-violet-100 border-violet-500 text-violet-900' }, // Return
            
            { id: 'malachi', name: '瑪拉基', start: 17, end: 17, color: 'bg-violet-100 border-violet-500 text-violet-900' }, // Return
            { id: 'joel', name: '約珥', start: 18, end: 18, color: 'bg-blue-100 border-blue-500 text-blue-900' } // Judah
        ];

        function init() {
            if (typeof staticContent === 'undefined' || typeof prophetsData === 'undefined') {
                contentInner.innerHTML = `<div class="text-center p-10 text-bible-red">錯誤：無法載入 data.js</div>`;
                return;
            }
            renderSidebar();
            document.getElementById('menu-btn').addEventListener('click', openSidebar);
            contentContainer.addEventListener('scroll', handleScroll);
            loadContent('intro');
        }

        // --- 核心：生成甘特圖 (Gantt Chart) ---
        function generateGanttChart() {
            if (ganttContainer.children.length > 0) return;

            // 1. 計算軌道 (Tracks) - 貪婪演算法
            const tracks = [];
            prophetSpans.forEach(p => {
                let assignedTrack = -1;
                for (let i = 0; i < tracks.length; i++) {
                    let conflict = false;
                    for (let span of tracks[i]) {
                        if (!(p.end < span.start || p.start > span.end)) {
                            conflict = true; break;
                        }
                    }
                    if (!conflict) {
                        assignedTrack = i;
                        tracks[i].push(p);
                        break;
                    }
                }
                if (assignedTrack === -1) {
                    tracks.push([p]);
                    assignedTrack = tracks.length - 1;
                }
                p.track = assignedTrack;
            });

            // 2. 繪製 HTML
            // 手機版欄寬調整: 100px (Period) / 160px (Kings)
            const col1Width = 100;
            const col2Width = 160;
            const minGridWidth = 600;

            let html = `
                <div class="grid min-w-[${minGridWidth}px] border-collapse bg-white" style="
                    grid-template-rows: 50px repeat(${kingsTimeline.length}, minmax(50px, auto));
                    grid-template-columns: ${col1Width}px ${col2Width}px repeat(${tracks.length}, 1fr);
                ">
                    <!-- 表頭 -->
                    <div class="sticky top-0 left-0 z-50 bg-[#e6dfd1] border-b-2 border-r border-[#cbbba0] flex items-center justify-center font-bold text-bible-dark ui-font shadow-sm px-1 text-xs md:text-sm">
                        歷史時期
                    </div>
                    <div class="sticky top-0 left-[${col1Width}px] z-50 bg-[#e6dfd1] border-b-2 border-r border-[#cbbba0] flex items-center justify-center font-bold text-bible-dark ui-font shadow-sm px-1 text-xs md:text-sm">
                        君王 / 背景
                    </div>
                    <div class="sticky top-0 z-40 bg-[#f0ebe0] border-b-2 border-[#cbbba0] flex items-center justify-center font-bold text-bible-brown ui-font shadow-sm text-xs md:text-sm" style="grid-column: 3 / -1;">
                        先知活躍時間軸
                    </div>
            `;

            // 生成左側兩欄 (時期 + 君王)
            let currentGroup = -1;
            kingsTimeline.forEach((time, index) => {
                const rowStart = index + 2;
                
                // 時期欄位 (合併儲存格邏輯)
                if (time.group !== currentGroup) {
                    const groupCount = kingsTimeline.filter(t => t.group === time.group).length;
                    const bgColor = index % 2 === 0 ? 'bg-[#faf8f5]' : 'bg-[#f4f1ea]';
                    
                    html += `
                        <div class="sticky left-0 z-30 ${bgColor} border-r border-b border-[#dcd3c2] flex items-center justify-center p-2 font-bold text-bible-dark text-xs ui-font leading-relaxed text-center break-words" 
                             style="grid-row: ${rowStart} / ${rowStart + groupCount}; grid-column: 1;">
                            ${time.period}
                        </div>
                    `;
                    currentGroup = time.group;
                }

                // 君王欄位
                html += `
                    <div class="sticky left-[${col1Width}px] z-20 bg-white border-r border-b border-[#dcd3c2] flex flex-col justify-center px-2 py-2 text-xs text-bible-brown ui-font font-medium" 
                         style="grid-row: ${rowStart} / ${rowStart + 1}; grid-column: 2;">
                        <span class="font-bold text-bible-dark block mb-1">${time.king}</span>
                        ${time.background ? `<span class="text-[10px] opacity-80 leading-tight block text-bible-brown">${time.background}</span>` : ''}
                    </div>
                `;

                // 背景橫線
                html += `
                    <div class="border-b border-[#eee] bg-white hover:bg-yellow-50 transition-colors" style="grid-row: ${rowStart} / ${rowStart + 1}; grid-column: 3 / -1;"></div>
                `;
            });

            // 生成先知長條
            prophetSpans.forEach(span => {
                const rowStart = span.start + 2;
                const rowEnd = span.end + 3; // +1 for 0-index, +1 for header, +1 for span end (exclusive)
                const col = span.track + 3; // 1:Period, 2:King, 3+:Prophets

                html += `
                    <div onclick="jumpToProphet('${span.id}')" 
                         class="relative z-10 m-1 rounded shadow-sm cursor-pointer hover:scale-[1.03] hover:shadow-md transition-all border-l-[6px] flex flex-col justify-center items-center text-center p-1 ${span.color} opacity-90"
                         style="grid-row: ${rowStart} / ${rowEnd}; grid-column: ${col};">
                        <span class="font-bold text-xs md:text-sm leading-tight drop-shadow-sm">${span.name}</span>
                        ${span.end > span.start ? '<i class="fas fa-arrow-down text-[10px] opacity-40 mt-0.5"></i>' : ''}
                    </div>
                `;
            });

            html += `</div>`;
            ganttContainer.innerHTML = html;
        }

        // --- 功能函式 ---
        window.jumpToProphet = function(id) {
            closeTimeline();
            setTimeout(() => loadContent(id), 300);
        };

        function openTimeline() {
            generateGanttChart();
            timelineModal.classList.remove('hidden');
            timelineModal.classList.add('flex');
            requestAnimationFrame(() => {
                timelineModal.children[1].classList.add('modal-enter-active');
                timelineModal.children[1].classList.remove('modal-enter');
            });
            if (window.innerWidth < 768) closeSidebar();
        }

        function closeTimeline() {
            const card = timelineModal.children[1];
            card.classList.remove('modal-enter-active');
            card.classList.add('modal-exit-active');
            setTimeout(() => {
                timelineModal.classList.add('hidden');
                timelineModal.classList.remove('flex');
                card.classList.remove('modal-exit-active');
                card.classList.add('modal-enter');
            }, 200);
        }

        // --- 渲染邏輯 (Sidebar) ---
        function renderSidebar() {
            const createSectionTitle = (text) => {
                const div = document.createElement('div');
                div.className = "px-6 py-3 text-xs font-bold text-bible-red bg-[#d5cbbd] uppercase tracking-widest sticky top-0 z-10 shadow-sm ui-font opacity-90 backdrop-blur-sm border-b border-[#c2b5a5]";
                div.textContent = text;
                return div;
            };

            const introData = { id: 'intro', title: staticContent.intro.title, subtitle: 'The Purpose' };
            navList.appendChild(createNavItem(introData, 'special'));

            navList.appendChild(createSectionTitle("大先知書 Major Prophets"));
            prophetsData.major.forEach(p => navList.appendChild(createNavItem(p, 'prophet')));

            navList.appendChild(createSectionTitle("小先知書 Minor Prophets"));
            prophetsData.minor.forEach(p => navList.appendChild(createNavItem(p, 'prophet')));

            const outroData = { id: 'redemption', title: staticContent.redemption.title, subtitle: 'Conclusion' };
            const outroItem = createNavItem(outroData, 'special');
            outroItem.classList.add('mt-auto', 'border-t-2', 'border-bible-brown');
            navList.appendChild(outroItem);
        }

        function createNavItem(data, type = 'special') {
            const div = document.createElement('div');
            const isSpecial = type === 'special';
            div.className = `nav-item px-6 py-4 cursor-pointer flex items-center justify-between group ${isSpecial ? 'special-section' : 'text-[#5c4d3c] border-b border-[#dcd3c2]'}`;
            div.dataset.id = data.id;

            if (isSpecial) {
                const iconClass = data.id === 'intro' ? 'fa-scroll' : 'fa-cross';
                div.innerHTML = `
                    <div class="flex items-center gap-4 ui-font w-full">
                        <div class="nav-icon-box w-10 h-10 rounded-full flex items-center justify-center transition-colors duration-300">
                            <i class="fas ${iconClass} text-lg"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="font-bold text-base tracking-wide">${data.title}</span>
                            <span class="text-[10px] opacity-60 uppercase tracking-widest font-light">${data.subtitle}</span>
                        </div>
                        <i class="fas fa-chevron-right ml-auto opacity-0 group-hover:opacity-100 transition-opacity duration-300"></i>
                    </div>`;
            } else {
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold text-base group-hover:text-bible-dark transition-colors ui-font flex items-center gap-2">
                            ${data.name}
                        </span>
                        <span class="text-xs opacity-60 font-light truncate mt-0.5">${data.title}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-bold opacity-30 bg-bible-brown text-white px-1.5 py-0.5 rounded tracking-widest ui-font group-hover:opacity-60 transition-opacity">
                            ${data.id.substring(0,3).toUpperCase()}
                        </span>
                        <i class="fas fa-chevron-right nav-arrow text-bible-gold text-xs"></i>
                    </div>`;
            }
            div.onclick = () => { loadContent(data.id); if (window.innerWidth < 768) closeSidebar(); };
            return div;
        }

        function loadContent(key) {
            currentKey = key;
            updateActiveNav(key);
            contentContainer.scrollTop = 0;
            const specialData = staticContent[key];
            contentInner.innerHTML = '';
            void contentInner.offsetWidth;

            if (specialData) {
                contentInner.innerHTML = specialData.content;
            } else {
                const allProphets = [...prophetsData.major, ...prophetsData.minor];
                const prophet = allProphets.find(p => p.id === key);
                if (prophet) renderProphet(prophet);
            }
        }

        function renderProphet(data) {
            const bibleCode = bibleBookCodes[data.id] || 'GEN';
            const bibleUrl = `https://www.bible.com/bible/46/${bibleCode}.1.CUNP-神`;
            
            // Era Display Logic (Prophet Page)
            let eraHtml = '';
            if (data.era) {
                const eras = Array.isArray(data.era) ? data.era : [data.era];
                eraHtml = `
                    <div class="flex flex-col gap-3 mb-8 w-full max-w-xl mx-auto">
                        ${eras.map(e => `
                            <div class="flex flex-col sm:flex-row items-stretch sm:items-center bg-white bg-opacity-60 rounded-lg overflow-hidden shadow-sm border border-bible-light text-sm ui-font">
                                <div class="bg-bible-dark text-bible-paper px-4 py-2 flex items-center justify-center sm:justify-start gap-2 sm:w-1/3 whitespace-nowrap">
                                    <i class="fas fa-map-marker-alt text-bible-gold text-xs"></i>
                                    <span class="font-bold tracking-wide">${e.period || e.kingdom}</span>
                                </div>
                                <div class="px-4 py-2 text-bible-brown flex items-center justify-center sm:justify-start gap-2 sm:w-2/3 border-t sm:border-t-0 sm:border-l border-bible-light bg-white">
                                    <i class="fas fa-crown text-bible-red opacity-60 text-xs"></i>
                                    <span class="font-medium text-xs leading-relaxed text-center sm:text-left">${e.kings}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            const html = `
                <div class="fade-in-up">
                    <header class="text-center relative mb-12">
                        <span class="inline-block py-1 px-3 mb-4 rounded-full border border-bible-gold text-bible-gold text-xs font-bold tracking-[0.2em] uppercase ui-font bg-white bg-opacity-80">
                            ${data.book}
                        </span>
                        <h1 class="text-4xl md:text-6xl font-bold text-bible-dark mb-6 tracking-tight relative z-10 font-serif">
                            ${data.name}
                        </h1>
                        ${eraHtml}
                        <div class="flex justify-center mb-10">
                            <a href="${bibleUrl}" target="_blank" class="group relative inline-flex items-center justify-center px-6 py-2 overflow-hidden font-bold text-bible-red transition-all duration-300 bg-transparent border-2 border-bible-red rounded-full hover:bg-bible-red hover:text-white focus:outline-none ui-font text-sm tracking-widest">
                                <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>
                                <span class="relative flex items-center gap-2"><i class="fas fa-book-open"></i> 閱讀聖經 (YouVersion)</span>
                            </a>
                        </div>
                        <div class="relative px-4 md:px-12 py-6">
                            <i class="fas fa-quote-left absolute top-0 left-4 text-bible-gold opacity-40 text-2xl"></i>
                            <p class="text-xl md:text-3xl text-bible-brown font-serif italic leading-relaxed z-10 relative">
                                ${data.quote}
                            </p>
                            <i class="fas fa-quote-right absolute bottom-0 right-4 text-bible-gold opacity-40 text-2xl"></i>
                        </div>
                        <div class="quote-mark left-1/2 transform -translate-x-1/2 text-[10rem] top-[-20px] opacity-[0.03]">"</div>
                    </header>
                    <section class="mb-10 bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-bible-light relative overflow-hidden">
                        <div class="absolute -right-6 -top-6 w-24 h-24 bg-bible-light rounded-full opacity-50 blur-xl"></div>
                        <h3 class="text-bible-red font-bold text-sm tracking-[0.2em] uppercase mb-6 flex items-center gap-3 ui-font border-b border-bible-light pb-2">
                            <i class="fas fa-user-circle text-lg"></i> 關於我
                        </h3>
                        <div class="prose prose-lg text-bible-dark text-justify leading-loose font-serif">
                            <p class="drop-cap text-lg">${data.intro}</p>
                        </div>
                    </section>
                    <section class="mb-12">
                         <div class="flex items-center mb-8 gap-4">
                            <div class="h-px bg-bible-brown flex-1 opacity-20"></div>
                            <h3 class="text-xl font-bold text-bible-dark flex items-center gap-3 ui-font">
                                <span class="bg-bible-dark text-bible-paper w-8 h-8 rounded-full flex items-center justify-center shadow-md"><i class="fas fa-pen-nib text-sm"></i></span>
                                神給我的啟示
                            </h3>
                            <div class="h-px bg-bible-brown flex-1 opacity-20"></div>
                        </div>
                        <div class="prose prose-lg text-bible-dark text-justify leading-loose md:px-6 font-serif">
                            ${data.message}
                        </div>
                    </section>
                    <section class="mt-16 transform transition-transform hover:scale-[1.01] duration-500">
                        <div class="bg-gradient-to-br from-[#2c241b] to-[#1a1510] text-bible-paper p-8 md:p-12 rounded-2xl shadow-2xl relative overflow-hidden border-t-4 border-bible-gold">
                            <div class="absolute top-0 right-0 w-64 h-64 bg-bible-gold opacity-5 rounded-full blur-3xl -mr-20 -mt-20"></div>
                            <div class="relative z-10 flex flex-col items-center text-center">
                                <i class="fas fa-bible text-bible-gold text-2xl mb-6 opacity-80"></i>
                                <p class="text-lg md:text-2xl font-serif leading-loose tracking-wide italic text-bible-light">
                                    "${data.verse}"
                                </p>
                                <div class="mt-8 pt-4 border-t border-bible-gold border-opacity-20">
                                    <span class="text-bible-gold text-[10px] tracking-[0.3em] uppercase ui-font font-bold">KEY VERSE</span>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            `;
            contentInner.innerHTML = html;
        }

        function updateActiveNav(id) {
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.dataset.id === id) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function handleScroll() {
            const currentScroll = contentContainer.scrollTop;
            
            // Fix: iOS Rubber banding (負值滾動) 忽略
            if (currentScroll < 0) return;

            // Fix: 增加緩衝區，避免微小移動就隱藏
            if (Math.abs(currentScroll - scrollPos) < 10) return;

            if (currentScroll > 60 && currentScroll > scrollPos) {
                mobileHeader.classList.add('header-hidden');
            } else {
                mobileHeader.classList.remove('header-hidden');
            }
            scrollPos = currentScroll;
        }

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function showPrayer() {
            const btnArea = document.getElementById('invitation-area');
            const prayerContent = document.getElementById('prayer-content');
            
            btnArea.style.display = 'none';
            prayerContent.classList.remove('hidden');
            prayerContent.classList.add('fade-in-up');
            
            setTimeout(() => {
                prayerContent.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        init();
    </script>
</body>
</html>
